<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>成語故事屋</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="font/zy.css">
<style>
/* VOICE 溫暖、像睡前故事書
   IDEA 一本會說話的成語故事小書，一站一站往下走
   PICTURE 每個故事的插圖、翻面字卡
   COLOUR 莫蘭迪灰綠底＋米白紙卡＋柔和黃
   TYPE 介面粉圓體、內文霞鶩文楷、注音芫荽 */
:root{color-scheme:light;--bg:#56655c;--bg2:#4a5850;--card:#fbf6ea;--ink:#2f2a26;--mute:#6a5f55;--acc:#e8c46a;--line:#3b2a25;--ok:#2f7d4a;--no:#b5452f;--soft:#f3ead5}
:root[data-theme=dark]{--bg:#3b4640;--bg2:#323c37;--card:#efe7d6;--soft:#e6dcc5}
*{box-sizing:border-box;min-width:0}
html{font-size:22px}html.s1{font-size:19px}html.s3{font-size:28px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Huninn","jf open 粉圓","LXGW WenKai TC",sans-serif;line-height:1.6;overflow-x:clip}
.txt,.story p,.card p,.q{font-family:"LXGW WenKai TC","Huninn",serif}
body.zy,body.zy *:not(svg):not(svg *){font-family:"BpmfZY","LXGW WenKai TC",sans-serif!important}
body.zy{line-height:1.9}
.ic{display:inline-flex;width:1.6em;height:1.6em;flex:none}.ic svg{width:100%;height:100%;overflow:visible}
button[aria-pressed="true"] .ic svg,.big .ic svg{background:#fffdf8;border-radius:50%;padding:2px}
h1 .ic,h2 .ic{width:1.3em;height:1.3em;vertical-align:-.25em;margin-right:.25em}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--bg2);padding:.4rem .6rem;box-shadow:0 3px 10px #0003}
.bar{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;justify-content:center}
.bar+.bar{margin-top:.35rem}
button{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:18px;min-height:64px;min-width:64px;padding:.2rem .55rem;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;cursor:pointer;box-shadow:0 3px 0 var(--line)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button[aria-pressed="true"]{background:var(--acc)}
button:focus-visible,a:focus-visible{outline:5px solid #ffe600;outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
.tb{font-size:.8rem}
.grp{display:inline-flex;gap:.25rem;padding:.2rem;border-radius:22px;background:#0002}
.tab{font-size:.85rem}
main{max-width:980px;margin:0 auto;padding:1rem .8rem 4rem}
.hero{color:#fbf6ea;text-align:center;padding:.6rem 0 1rem}
.hero h1{margin:0;font-size:1.9rem;line-height:1.2}
.hero p{margin:.3rem 0 0;font-size:.9rem;opacity:.9}
.hero{display:flex;align-items:center;justify-content:center;gap:.6rem;text-align:left}
.xy{display:inline-block;width:5rem;flex:none;background:#fbf6ea;border-radius:50%;border:3px solid #3b2a25}.xy svg{width:100%;height:auto;display:block}
.sxy{width:3.4rem;float:right;margin:0 0 .3rem .5rem;background:#fff;border-radius:50%;border:3px solid var(--line)}.sxy svg{width:100%;height:auto;display:block}
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:1rem 1.1rem 1.2rem;margin:0 0 1.1rem;box-shadow:0 6px 0 #0003}
.card h2{margin:0 0 .6rem;font-size:1.15rem;line-height:1.35;display:flex;align-items:center;gap:.3rem}
.no{display:inline-grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:var(--acc);border:3px solid var(--line);font-size:.85rem;flex:none}
.pic{width:100%;max-width:560px;display:block;margin:0 auto .6rem;border-radius:18px;border:3px solid var(--line);background:#fff}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0}
.story p{margin:.5rem 0;font-size:1.05rem}
.note,.src{font-size:.8rem;color:var(--mute);margin:.3rem 0}
.tip{font-size:.85rem;color:var(--mute);margin:.2rem 0 .5rem}
.hint{background:var(--soft);border-radius:14px;padding:.4rem .7rem;margin:.4rem 0;font-size:.95rem;border:2px dashed var(--line)}
.ans{font-size:2.6rem;text-align:center;letter-spacing:.2em;margin:.4rem 0;color:var(--ink)}
.chars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
@media(max-width:620px){.chars{grid-template-columns:repeat(2,minmax(0,1fr))}}
.flip{flex-direction:column;min-height:9rem;font-size:1rem;background:#fff;padding:.5rem}
.flip b{font-size:2.6rem;line-height:1.1}
.flip .m{font-size:.85rem;line-height:1.4}
.flip .t{font-size:.7rem;color:var(--mute)}
.flip[aria-pressed="true"]{background:#fff3c4}
.flip .pc{width:100%;max-width:150px}.flip .pc svg{width:100%;height:auto;display:block}
.flip.now{outline:6px solid #e8c46a;outline-offset:3px;box-shadow:0 0 0 10px #e8c46a55}
.key{color:#b5452f;background:#ffe9a8;padding:0 .15em;border-radius:6px;font-weight:700}
body.hc .key{color:#000;background:#ffe600}
.chip.ok{border-color:#2f7d4a;background:#bfe6c6;box-shadow:0 0 0 5px #2f7d4a66}
.chip.bad{border-color:#b5452f;background:#f6c7bd;box-shadow:0 0 0 5px #b5452f66}
body.hc .chip.ok{border-color:#7dff9a;color:#7dff9a;background:#000}body.hc .chip.bad{border-color:#ff9b8a;color:#ff9b8a;background:#000}
.chpic{display:block;width:100%;max-width:420px;margin:.5rem auto 0;border-radius:16px;border:3px solid var(--line);background:#fff}
.sent{font-size:1.15rem;line-height:2.2}
.slot{display:inline-block;min-width:3.4em;border-bottom:4px solid var(--line);text-align:center;margin:0 .15em;padding:0 .2em;background:#fff8e2;border-radius:6px 6px 0 0}
.slot.f{background:#d9f0d9}
.chip{font-size:1rem}
.mean{background:var(--soft);border-radius:16px;padding:.6rem .8rem;margin-top:.6rem}
.mean dt{font-weight:700;font-size:.85rem;color:var(--mute)}.mean dd{margin:0 0 .4rem;font-size:1.05rem}
.q{font-size:1.02rem;margin:.6rem 0 .2rem}
.ref{background:var(--soft);border-radius:14px;padding:.4rem .7rem;font-size:.95rem}
.jd{border-top:2px dashed #3b2a2544;padding:.6rem 0}
.jd:first-of-type{border-top:0}
.fb{font-size:.95rem;margin:.3rem 0 0;padding:.3rem .6rem;border-radius:12px}
.fb.y{background:#dff3e3;color:var(--ok)}.fb.n{background:#fbe2dc;color:var(--no)}
.yes[aria-pressed="true"]{background:#bfe6c6}.nope[aria-pressed="true"]{background:#f6c7bd}
.sym{font-size:1.4rem;font-weight:700}
.done{background:var(--acc);text-align:center;font-size:1.2rem}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
/* 高對比 */
body.hc{--bg:#000;--bg2:#000;--card:#000;--ink:#fff;--mute:#fff;--acc:#ffe600;--soft:#000;--line:#fff}
body.hc .card,body.hc button{border-width:4px}
body.hc button{background:#000;color:#fff;box-shadow:none}
body.hc button[aria-pressed="true"]{background:#ffe600;color:#000}
body.hc .ic svg{background:#fffdf8;border-radius:50%;padding:2px}
body.hc .hint,body.hc .mean,body.hc .ref{border:3px solid #fff}
body.hc .ans,body.hc h2,body.hc .flip b{color:#ffe600}
body.hc .flip,body.hc .slot{background:#000}body.hc .slot.f{background:#000;color:#ffe600}
body.hc .fb.y{background:#000;color:#7dff9a;border:3px solid #7dff9a}body.hc .fb.n{background:#000;color:#ff9b8a;border:3px solid #ff9b8a}
body.hc .hero{color:#fff}body.hc .no{color:#000;border-color:#fff}
body.zy .tb,body.zy .tab,body.zy .pick{font-size:.72rem}
.pick{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;color:#fbf6ea}
.pick select{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;min-height:64px;padding:.2rem .5rem;max-width:62vw}
.cnt{background:#fff;border:2px solid var(--line);border-radius:999px;padding:0 .4em;font-size:.8em;margin-left:.2em}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:1rem}
.cc{position:relative;background:#fff;border:4px solid var(--line);border-radius:22px;padding:.6rem;text-align:center;box-shadow:0 6px 0 #0003}
.cc img{width:100%;border-radius:14px;border:2px solid var(--line)}
.cc .nm{font-size:1.6rem;font-weight:700;margin:.3rem 0 0;letter-spacing:.1em}
.cc .mn{font-size:.85rem;margin:.2rem 0}.cc .dt{font-size:.75rem;color:var(--mute)}
.cc .stamp{position:absolute;top:.6rem;right:.6rem;width:4rem;height:4rem;border-radius:50%;border:4px solid #c8432f;color:#c8432f;display:grid;place-items:center;font-weight:700;font-size:1rem;transform:rotate(-14deg);background:#fff8}
.cc.lock{background:#e9e4da;filter:grayscale(1)}.cc.lock .q{font-size:3rem;margin:1.2rem 0 .4rem;color:#8a7f73}
.lv{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}.lv .bar2{flex:1 1 12rem;height:1.2rem;border:3px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}.lv .bar2 i{display:block;height:100%;background:#8fd18a}
.story p{text-indent:2em}
.chars.parts{grid-template-columns:repeat(2,minmax(0,1fr))}
.parts .flip{min-height:11rem;justify-content:flex-start}
.parts .flip b{font-size:2.5rem;letter-spacing:.12em}
.parts .flip img.pc{width:100%;max-width:240px;border-radius:14px;border:2px solid var(--line);background:#fff}
.flip .k{font-size:.8rem;line-height:1.4;background:#fff3c4;border-radius:10px;padding:.15rem .4rem;color:#7a3b20}
body.hc .flip .k{background:#000;color:#ffe600;border:2px solid #ffe600}
.lvb{display:inline-flex;align-items:center;gap:.4rem;flex-wrap:wrap;background:#fbf6ea;color:#2f2a26;border:3px solid #3b2a25;border-radius:999px;padding:.15rem .7rem .15rem .3rem;margin:.4rem 0 0;font-size:.85rem}
.lvb b{font-size:1rem}.lvb .mini{display:inline-block;width:5.5rem;height:.8rem;border:2px solid #3b2a25;border-radius:999px;background:#fff;overflow:hidden;vertical-align:middle}.lvb .mini i{display:block;height:100%;background:#8fd18a}
.lvb .ic{width:1.5em;height:1.5em}
body.hc .lvb{background:#000;color:#fff;border-color:#fff}body.hc .lvb b{color:#ffe600}
.lvstars{display:inline-flex;gap:.1rem}.lvstars .ic{width:1.2em;height:1.2em}.lvstars .off{filter:grayscale(1);opacity:.35}
.modal{position:fixed;inset:0;z-index:20;background:#0008;display:grid;place-items:center;padding:1rem}
.modal .box{background:var(--card);border:4px solid var(--line);border-radius:28px;max-width:30rem;width:100%;padding:1.2rem;text-align:center;box-shadow:0 8px 0 #0004;animation:pop .5s}
.modal .box .big1{font-size:1.8rem;font-weight:700;margin:.3rem 0;color:#b5452f}
body.hc .modal .box .big1{color:#ffe600}
.modal .box .ic.huge{width:5rem;height:5rem}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.modal .box{animation:none}}
.save textarea{width:100%;min-height:5rem;font:inherit;font-size:.8rem;border:3px solid var(--line);border-radius:14px;padding:.4rem;background:#fff;color:#2f2a26}
body.hc .save textarea{background:#000;color:#fff;border-color:#fff}
/* 釣魚 */
.ponds{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.7rem}
.ponds button{flex-direction:column;min-height:7rem;font-size:1rem;line-height:1.3}
.ponds button small{font-size:.75rem;color:var(--mute)}
.ponds button[aria-pressed="true"]{background:var(--acc)}
.gbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;font-size:1.05rem;margin:.3rem 0 .5rem}
.gbar b{font-size:1.4rem}
.pond{position:relative;height:min(62vh,30rem);border:4px solid var(--line);border-radius:24px;overflow:hidden;touch-action:manipulation;cursor:pointer;background:linear-gradient(#cfe9f5 0 14%,#7cc4f0 14% 100%)}
.pond.river{background:linear-gradient(#d8efd0 0 14%,#6bb8d6 14% 100%)}
.pond.sea{background:linear-gradient(#ffe9b8 0 14%,#4f9fd8 14% 60%,#3d84c0 100%)}
.pond.deep{background:linear-gradient(#b9c8e8 0 14%,#36639b 14% 50%,#22416e 100%)}
.pond .wave{position:absolute;left:0;right:0;top:14%;height:6px;background:repeating-linear-gradient(90deg,#fff8 0 18px,transparent 18px 36px)}
.pond .boat{position:absolute;top:1%;width:4.5rem;transform:translateX(-50%);transition:left .25s;pointer-events:none}
.pond .line{position:absolute;top:10%;width:3px;background:#3b2a25;height:0;transform:translateX(-50%);transition:height .4s ease-in;pointer-events:none}
.pond .line .hk{position:absolute;bottom:-1.2rem;left:-.7rem;width:1.6rem;height:1.6rem}
.pond .fb2{position:absolute;padding:0;border:0;background:transparent;box-shadow:none;min-height:0;min-width:0;border-radius:40%;will-change:transform}
.pond .fb2 svg{width:100%;height:auto;display:block}
.pond .fb2.l svg{transform:scaleX(-1)}
.pond .fb2:focus-visible{outline:5px solid #ffe600}
.pond .plus{position:absolute;font-size:1.6rem;font-weight:700;color:#fff;text-shadow:0 2px 0 #3b2a25,0 0 6px #3b2a25;pointer-events:none;animation:up 1s forwards}
@keyframes up{to{transform:translateY(-3rem);opacity:0}}
.catch{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.catch span{display:inline-flex;align-items:center;gap:.2rem;background:#fff;border:2px solid var(--line);border-radius:14px;padding:.1rem .5rem}
.catch svg{width:3rem;height:auto}
body.hc .catch span{background:#000}
body.hc .cnt{background:#000;color:#ffe600;border-color:#fff}
body.hc .cc{background:#000}body.hc .cc .stamp{background:#000;color:#ffe600;border-color:#ffe600}body.hc .lv .bar2{background:#000}body.hc .pic{border-color:#fff}
</style>
</head>
<body>
<header>
 <div class="bar">
  <span class="grp" role="group" aria-label="字級">
   <button class="tb" data-size="s1" aria-pressed="false" aria-label="字級 小" style="font-size:.7rem">A</button>
   <button class="tb" data-size="s2" aria-pressed="true" aria-label="字級 中" style="font-size:.9rem">A</button>
   <button class="tb" data-size="s3" aria-pressed="false" aria-label="字級 大" style="font-size:1.15rem">A</button>
  </span>
  <button class="tb" id="bZy" aria-pressed="false"><span class="ic" aria-hidden="true" data-ic="zy"></span>注音</button>
  <button class="tb" id="bHc" aria-pressed="false"><span class="ic" aria-hidden="true" data-ic="half"></span>高對比</button>
  <button class="tb" id="bRate" aria-pressed="false"><span class="ic" aria-hidden="true" data-ic="rabbit"></span><span id="rLab">快</span></button>
 </div>
 <div class="bar"><label class="pick"><span class="ic" aria-hidden="true" data-ic="book"></span>選故事<select id="sel"></select></label><button class="tb" id="bBook" aria-pressed="false"><span class="ic" aria-hidden="true" data-ic="cards"></span>我的成語圖鑑<span class="cnt" id="cnt"></span></button><button class="tb" id="bFish" aria-pressed="false"><span class="ic" aria-hidden="true" data-ic="fish"></span>釣魚<span class="cnt" id="tk"></span></button></div>
</header>
<main>
 <div class="hero"><span class="xy"><svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><rect x="38" y="70" width="44" height="40" rx="14" fill="#f2c57c" stroke="#3b2a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 72v36" stroke="#3b2a25" stroke-width="2.5"/><circle cx="60" cy="50" r="26" fill="#ffe0c8" stroke="#3b2a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M32 44q2-26 28-26t28 26q-12-6-28-6t-28 6z" fill="#8a5a3c" stroke="#3b2a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M86 42l14 4-14 4" fill="#8a5a3c" stroke="#3b2a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 38q20-8 40 0" fill="none" stroke="#f2c57c" stroke-width="3"/><circle cx="54.5" cy="54" r="2.2" fill="#3b2a25"/><circle cx="65.5" cy="54" r="2.2" fill="#3b2a25"/><path d="M56.7 58.4q3.3000000000000003 3.3000000000000003 6.6000000000000005 0" fill="none" stroke="#3b2a25" stroke-width="2" stroke-linecap="round"/><ellipse cx="50.1" cy="57.3" rx="2.75" ry="1.7600000000000002" fill="#ff9fb0"/><ellipse cx="69.9" cy="57.3" rx="2.75" ry="1.7600000000000002" fill="#ff9fb0"/><path d="M84 84l10-10" stroke="#3b2a25" stroke-width="7" stroke-linecap="round"/><circle cx="100" cy="66" r="12" fill="#d8f0ff" stroke="#3b2a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M95 62q3-4 7-3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></span><div><h1>成語故事屋</h1><p>跟著小偵探小柚，先聽故事，再推理成語</p><p class="lvb" id="lvb"></p></div></div>
 <div id="modal"></div>
 <div id="app"></div>
</main>
<script>

var ICONS={

 belloff:'<path d="M24 6c-8 0-12 6-12 13v8l-4 6h32l-4-6v-8c0-7-4-13-12-13z" fill="#d9d4cc" '+IC_O+'/><circle cx="24" cy="38" r="4" fill="#b7b0a5" '+IC_O+'/><path d="M8 8l32 32" stroke="#e0533d" stroke-width="4.5" stroke-linecap="round"/>',
 speaker:'<path d="M4 17h9l13-11v36L13 31H4z" fill="#7cc4f0" '+IC_O+'/><path d="M32 17q6 7 0 14" fill="none" stroke="#3b2a25" stroke-width="4.5" stroke-linecap="round"/><path d="M38 10q11 14 0 28" fill="none" stroke="#3b2a25" stroke-width="4.5" stroke-linecap="round"/>',

var DATA=[{"id": "bmdz", "no": 1, "lab": "第一課", "idiom": "本末倒置", "story_title": "大樹醫生的怪方法", "source": "原創故事（成語出自宋朝的書）", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了一󠇡個開滿花的小鎮。鎮上的廣場中間，有一󠇢棵好老好老的大樹，樹葉黃黃的，看起來沒有精神。", "鎮長󠇡很著󠇣急，請來了一󠇡位「大樹醫生」。大樹醫生戴著大眼鏡，繞著大樹走了一󠇢圈，說：「大樹不󠇡漂亮，是因為󠇡葉子󠇡不󠇡夠亮！」", "於是，他叫大家搬來梯子󠇡，爬到樹上，一󠇡片一󠇡片地󠇡幫葉子󠇡擦亮，還在樹枝上綁滿彩色的緞帶。大家從早上忙到晚上，累得󠇡腰都直不起來。", "小柚躲在花叢後面，看見樹下的泥土又乾󠇡又硬，裂開了好多縫󠇡。他在本子󠇡上寫下：「線索一：大家都在忙樹梢的葉子󠇡，卻沒有人看樹根。」", "過了幾天，大樹的葉子󠇡不󠇡但沒有變綠，還一󠇡片一󠇡片地󠇡掉下來。緞帶在風裡飄來飄去，大樹看起來更可憐了。", "這時候，一󠇡個賣菜的老奶奶󠇡走過來，蹲下去摸摸泥土，說：「哎呀，土這麼乾󠇡，樹根都喝不󠇡到水了。樹根是大樹的根本，根本沒照顧好，葉子󠇡怎麼會好呢？」", "小柚眼睛一󠇡亮，又寫下：「線索二：樹根最重要，樹梢比較不󠇡重要，順序弄反了。」", "鎮長󠇡聽了老奶奶󠇡的話，請大家先幫大樹鬆土、澆水，還在樹根旁邊鋪󠇡上肥料。一󠇡個月以後，大樹冒出了好多嫩綠的新葉子󠇡，比綁緞帶的時候漂亮多了。大樹醫生紅著臉說：「原來我把事情的先後弄反了！」", "後來，鎮長󠇡在大樹旁邊立了一󠇡塊小木牌，提醒大家：「先照顧樹根，再欣賞樹葉。」每到春天，大樹開滿了花，小朋友在樹下玩耍，老奶奶󠇡也常常坐在樹蔭下，笑咪咪地󠇡看著大家。", "小柚闔上本子󠇡，點點頭說：「做事情要先把最重要的做好，再做其他的事。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『把重要的事放一󠇢邊，反而先做不󠇡重要的事』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "樹梢：樹木最上面、最尖端的地方。", "hints": ["樹根是大樹的根「<b class=\"key\">本</b>」，樹梢是樹枝的「<b class=\"key\">末</b>」端。", "大家先忙樹梢、不管樹根，這是把順序「<b class=\"key\">倒</b>」過來。", "「<b class=\"key\">倒置</b>」就是放倒󠇡、顛倒。四個字是：□□倒置。"], "parts": [["本末", "重要和󠇡不󠇡重要的事情", "本：樹根，比喻重要的；末：樹梢，比喻不󠇡重要的"], ["倒置", "把順序弄反", "置：放"]], "blank": ["把＿＿＿＿的事放一󠇢邊，先做＿＿＿＿的事。", ["重要", "不󠇡重要"], ["好吃", "好玩"]], "literal": "樹根和󠇡樹梢的順序弄反了。", "meaning": "把重要的事情放一󠇢邊，反而先做不󠇡重要的事。", "more": "", "think": ["大樹醫生為󠇡什麼救不了󠇡大樹？", "你每天放學回家，哪一󠇡件事最「本」、最重要？要先做什麼？"], "think_ref": ["因為󠇡他只忙著擦葉子󠇡、綁緞帶，沒有照顧最重要的樹根，順序弄反了。", "可以說：先寫功課、準備明天的書包，再玩遊戲或看卡通。"], "judge": [["考試快到了，哥哥󠇡卻只忙著把鉛筆盒裝飾漂亮，都不讀書，真是本末倒置。", true, "讀書最重要，他卻先忙不󠇡重要的裝飾，所以這句用得󠇡對。"], ["弟弟󠇡先刷牙洗臉，再吃早餐，真是本末倒置。", false, "刷牙洗臉、吃早餐都是該做的事，沒有把重要的事放一󠇢邊，所以這句用錯了。"], ["比賽前不󠇡練球，只顧著挑󠇡漂亮的球衣，這樣是本末倒置。", true, "練球比較重要，球衣比較不󠇡重要，所以這句用得󠇡對。"]], "life": "姊姊󠇡做海報時，先花一󠇡個小時挑󠇡貼紙，卻忘了寫上最重要的標題，真是本末倒置。", "say": "你有沒有做過本末倒置的事？後來怎麼改？", "ch": {"q": "「捨本逐末」的意思󠇢是：丟下重要的樹根，去追不󠇡重要的樹梢。它和󠇡「本末倒置」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 0, "why": "兩個成語都在說：把重要的放一󠇢邊，去做不󠇡重要的事，所以意思󠇢很像。"}}, {"id": "zyws", "no": 2, "lab": "第一課", "idiom": "自以為󠇡是", "story_title": "小青蛙的大發現", "source": "原創故事（成語出自《孟子󠇡》）", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他竟然變成一󠇢隻小蜻蜓，停在一󠇢口古井旁邊的草葉上。井底住著一󠇢隻小青蛙，正在大聲唱歌。", "小青蛙抬頭看著井口，得意地󠇡說：「天空就是一󠇡個圓圓的小盤子󠇡，大小跟井口一󠇢模一󠇡樣。我每天都看得󠇡清清楚楚，絕對不󠇡會錯！」", "一󠇢隻小鳥飛過井口，停下來說：「青蛙弟弟󠇡，天空很大很大，大到飛三天三夜都飛不完喔！」小青蛙哈哈大笑：「你騙人！我看到的天空就是這麼小，我說的才對！」", "小柚拍拍翅膀，在本子󠇡上寫下：「線索一：小青蛙只相󠇡信自己看到的，覺得󠇡自己一󠇡定是對的。」", "小鳥搖搖頭，又說：「你要不󠇡要跳上來看看？」小青蛙把頭一󠇢扭：「不󠇡用看了，我早就知道了！」說完就鑽進水裡，不理小鳥了。", "過了幾天，下了一󠇢場大雨，井水漲得󠇡好高。小青蛙浮在水面上，一󠇡下子󠇡就跳出了井口。他抬頭一󠇡看，嚇了一󠇡大跳：藍藍的天空好大好大，一󠇢直延伸到遠遠的山後面，白雲一󠇢朵接著一󠇢朵，怎麼看也看不完。", "小柚又寫下：「線索二：小青蛙不聽別人的話，原來是自己想錯了。」", "小青蛙紅著臉，找到那隻小鳥，說：「對不起，我以前覺得󠇡自己一󠇡定對，不肯聽你說話。原來世界這麼大！」小鳥笑著說：「沒關係，願意改就很棒了。我帶你去看看小河和󠇡大海吧！」", "從那天起，小青蛙每天都跳到不同的地方去看看。他看到了開滿荷花的池塘，看到了會發光的螢火蟲，也交到了好多新朋友。每次學到新東西󠇡，他都會說：「原來還有這麼多我不知道的事！」", "小柚笑了：「每個人看到的都只有一󠇡部分󠇡，多聽聽別人的想法，才會知道得󠇡更多。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『覺得󠇡自己一󠇡定是對的，不󠇡願意聽別人的想法』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "延伸：一󠇢直往遠的地方伸展出去。", "hints": ["小青蛙「<b class=\"key\">自己</b>」「<b class=\"key\">以為󠇡</b>」自己知道得󠇡最多。", "他覺得󠇡自己說的一󠇡定「<b class=\"key\">是</b>」對的。", "把「<b class=\"key\">自己、以為󠇡、是對的</b>」縮成四個字。"], "parts": [["自以為󠇡", "自己覺得󠇡、自己認為󠇡", "以為󠇡：認為󠇡"], ["是", "對的、正確的", "是：對"]], "blank": ["＿＿＿＿覺得󠇡自己說的一󠇡定是＿＿＿＿的。", ["自己", "對"], ["老師", "錯"]], "literal": "自己認為󠇡自己是對的。", "meaning": "覺得󠇡自己一󠇡定是對的，不󠇡願意聽別人的想法。", "more": "", "think": ["小青蛙一󠇢開始為󠇡什麼不肯相󠇡信小鳥？", "如果你和󠇡同學意見不一󠇡樣，怎麼做才不󠇡會自以為󠇡是？"], "think_ref": ["因為󠇡他只相󠇡信自己在井底看到的，覺得󠇡自己一󠇡定是對的。", "可以先聽聽同學的理由，想一󠇢想，也可以一󠇢起查資料或問老師。"], "judge": [["小明不聽組員的意見，堅持只用自己的方法，真是自以為󠇡是。", true, "小明覺得󠇡只有自己對，不聽別人的想法，所以這句用得󠇡對。"], ["妹妹問了好多同學的想法，最後大家一󠇢起決定，真是自以為󠇡是。", false, "妹妹有聽別人的想法，不󠇡是覺得󠇡只有自己對，所以這句用錯了。"], ["他自以為󠇡是，不󠇡看地圖也不󠇡問路，結果走錯了好遠。", true, "他覺得󠇡自己一󠇡定知道路，不聽別人、不󠇡看地圖，所以這句用得󠇡對。"]], "life": "分組做勞作時，阿哲自以為󠇡是，不聽大家的建議，結果作品做到一󠇡半就垮掉了。", "say": "怎麼知道自己是不󠇡是「自以為󠇡是」呢？說說你的方法。", "ch": {"q": "「虛心受教」的意思󠇢是：很謙虛地󠇡聽別人的教導和󠇡建議。它和󠇡「自以為󠇡是」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "自以為󠇡是不聽別人的話，虛心受教願意聽，所以意思󠇢相󠇡反。"}}, {"id": "jzlc", "no": 3, "lab": "第二課", "idiom": "價值連城", "story_title": "和氏的寶玉", "source": "典故出自《史記》和氏璧的故事", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光，他來到了古代的楚國。一󠇡個叫做卞和的人，正抱著一󠇡塊灰灰的大石頭󠇡，急急忙忙地󠇡走向王宮。", "卞和跪在國王面前說：「大王，這塊石頭󠇡裡面藏著一󠇡塊美麗的寶玉！」國王請玉匠來看，玉匠敲一󠇢敲石頭󠇡，搖搖頭說：「這只是普通的石頭󠇡。」國王很生氣，覺得󠇡卞和在說謊，就處󠇡罰了他。", "可是卞和沒有放棄。後來，新的國王上任了，他又抱著石頭󠇡去王宮，結果又被說是騙人。卞和抱著石頭󠇡，坐在山腳下哭了三天三夜。", "小柚在本子󠇡上寫下：「線索一：卞和一󠇢直相󠇡信，灰灰的石頭󠇡裡藏著寶玉。」", "又過了好多年，第三位國王聽說了這件事，派人來問：「你為󠇡什麼哭得󠇡這麼傷心？」卞和說：「我不󠇡是因為󠇡被處󠇡罰而哭，是因為󠇡寶玉被當成石頭󠇡，誠實的人被當成騙子󠇡！」", "國王請玉匠把石頭󠇡小心地󠇡剖開。哇！裡面真的有一󠇡塊又白又亮、光滑得󠇡像月光的寶玉！國王把它叫做「和氏璧」，大家都搶著來看。", "很多年以後，趙國得到了和氏璧。強大的秦國國王很想要，說：「我願意用十五座城，來換這一󠇡塊玉！」", "小柚驚訝得󠇡張大嘴巴，寫下：「線索二：一󠇡塊玉可以換十五座城，連在一󠇢起的城那麼多！」", "後來，趙國派了一󠇡位勇敢又聰明的大臣藺相󠇡如，帶著和氏璧去秦國。他發現秦王只想騙走寶玉，不想給城，就想辦法把和氏璧完完整整地󠇡送回了趙國。大家都說，這塊寶玉真是太珍貴了。", "小柚心想：「卞和真勇敢，就算別人不相󠇡信，他還是堅持說實話。這塊寶玉，就像他的心一󠇡樣珍貴。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「後來，人們就用四個字，來形容『東西󠇡非常珍貴、非常值錢』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "剖開：從中間切󠇡開。和氏璧：卞和發現的寶玉，璧是圓形中間有洞的玉。", "hints": ["這塊玉很值錢，它的「<b class=\"key\">價值</b>」很高。", "秦王要用十五座「<b class=\"key\">城</b>」來換，城一󠇡座「<b class=\"key\">連</b>」著一󠇡座。", "把「<b class=\"key\">價值</b>」和󠇡「<b class=\"key\">連城</b>」合起來。"], "parts": [["價值", "東西󠇡值多少錢", ""], ["連城", "很多座城連在一󠇢起", "連：連在一󠇢起；城：城市"]], "blank": ["一󠇡塊玉的價值，可以換好幾座＿＿＿＿在一󠇢起的＿＿＿＿。", ["連", "城"], ["斷", "山"]], "literal": "價值抵得󠇡上很多座連在一󠇢起的城。", "meaning": "形容東西󠇡非常珍貴、非常值錢。", "more": "", "think": ["卞和被處󠇡罰了兩次，為󠇡什麼還要堅持？", "你有沒有一󠇡樣「對你來說價值連城」的東西󠇡？為󠇡什麼？"], "think_ref": ["因為󠇡他知道石頭󠇡裡真的有寶玉，他想說實話，不想讓寶玉被埋沒。", "例如：家人做給我的生日卡片，雖然不󠇡貴，但對我來說非常珍貴。"], "judge": [["博物館裡這件古代的寶物，價值連城，大家都小心地󠇡欣賞。", true, "古代寶物非常珍貴，所以這句用得󠇡對。"], ["這枝鉛筆在文具店只賣五元，真是價值連城。", false, "五元的鉛筆很便󠇡宜，不󠇡是非常值錢，所以這句用錯了。"], ["國王把價值連城的皇冠󠇡，鎖在最安全的房間裡。", true, "皇冠󠇡非常值錢，要小心保存，所以這句用得󠇡對。"]], "life": "奶奶󠇡的舊戒指是爺爺󠇡送的，雖然不󠇡是很貴，可是對奶奶󠇡來說，就像價值連城的寶貝。", "say": "什麼東西󠇡對你來說價值連城？說給家人聽。", "ch": {"q": "「無價之寶」的意思󠇢是：珍貴到沒有辦法算出價錢的寶物。它和󠇡「價值連城」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 0, "why": "兩個成語都在形容東西󠇡非常珍貴，所以意思󠇢很像。"}}, {"id": "hstz", "no": 4, "lab": "第二課", "idiom": "畫蛇添足", "story_title": "誰能喝到那壺酒", "source": "典故出自《戰國策》", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他來到了古代的楚國。一󠇡位老爺爺󠇡剛辦完祭祀，把一󠇢壺酒送給幫忙的工人。", "工人們圍著酒壺，你看我、我看你。一󠇡個工人說：「酒只有一󠇢壺，大家一󠇢起喝，每人只能喝一󠇢小口；一󠇡個人喝，才喝得󠇡過癮。」另一󠇡個人說：「那我們來比賽吧！在地上畫一󠇢條蛇，誰先畫好，這壺酒就給誰！」", "大家都說好主意，馬上撿起樹枝，蹲在地上畫了起來。沙沙沙，沙沙沙，每個人都畫得󠇡好認真。", "有一󠇡個人畫得󠇡特別快，一󠇡下子󠇡就畫好了。他拿起酒壺，正要喝，看看別人還在畫，就得意地󠇡說：「你們好慢喔！我還有時間幫蛇畫上腳呢！」", "小柚在本子󠇡上寫下：「線索一：蛇已經畫好了，他卻又多畫了腳。」", "他左手抱著酒壺，右手拿著樹枝，一󠇢隻腳、兩隻腳、三隻腳……正畫得󠇡開心，另一󠇡個人也畫好了，一󠇢把搶走酒壺說：「蛇本來就沒有腳！你畫的根本不󠇡是蛇，所以這壺酒是我的！」說完，咕嚕咕嚕把酒喝光了。", "那個畫腳的人呆呆地󠇡站著，手裡還拿著樹枝，後悔得󠇡不得了󠇡：「唉，我要是不多畫，酒就是我的了！」", "小柚又寫下：「線索二：多做了不󠇡必要的事，反而把事情弄壞了。」", "那天晚上，畫腳的人回到家，對著鏡子󠇡嘆氣。他的妻子󠇡笑著說：「下次記得󠇡，事情做好了就好，不󠇡要為󠇡了炫耀，多做一󠇢些沒有用的事。」他點點頭，把那根樹枝收了起來，提醒自己別再犯同樣的錯。", "小柚想了想：「事情做好了就要停下來檢查，不󠇡要為󠇡了炫耀，多做一󠇢些沒有用的事。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「後來，人們就用四個字，來說『本來已經做好了，卻多做一󠇢些，反而把事情弄不好』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "祭祀：拜神、拜祖先的儀式。", "hints": ["比賽是要大家「<b class=\"key\">畫</b>」一󠇢條「<b class=\"key\">蛇</b>」。", "他多「<b class=\"key\">添</b>」加了蛇的腳，腳也可以叫「<b class=\"key\">足</b>」。", "把「<b class=\"key\">畫蛇</b>」和󠇡「<b class=\"key\">添足</b>」合起來。"], "parts": [["畫蛇", "畫一󠇢條蛇", ""], ["添足", "又多畫上腳", "添：增加；足：腳"]], "blank": ["蛇已經畫好了，又多＿＿＿＿上＿＿＿＿。", ["添", "腳"], ["擦", "頭"]], "literal": "畫好了蛇，又幫蛇加上腳。", "meaning": "本來已經做好了，卻多做一󠇢些，反而把事情弄不好。", "more": "", "think": ["畫腳的人為󠇡什麼沒有喝到酒？", "做完功課後，要怎麼檢查才不󠇡會畫蛇添足？"], "think_ref": ["因為󠇡蛇本來沒有腳，他多畫了腳，畫出來就不󠇡是蛇了，酒被別人拿走。", "可以看看題目要󠇡求，確定做對了就好，不󠇡要亂加不需要的東西󠇡。"], "judge": [["蛋糕已經很漂亮了，弟弟󠇡又擠了一󠇡大堆奶油，結果蛋糕塌下來，真是畫蛇添足。", true, "蛋糕做好了，多加奶油反而弄壞了，所以這句用得󠇡對。"], ["哥哥󠇡寫完作文，再檢查一󠇡次錯字，真是畫蛇添足。", false, "檢查錯字是有幫助的事，沒有把事情弄壞，所以這句用錯了。"], ["圖畫已經完成，他又亂塗很多顏色，反而看不清楚，真是畫蛇添足。", true, "多塗顏色反而讓圖畫變差，所以這句用得󠇡對。"]], "life": "我的作文已經寫得󠇡很好，又硬加了好多不相󠇡關的句子󠇡，老師說這樣是畫蛇添足。", "say": "你看過畫蛇添足的事嗎？說說看是什麼情形。", "ch": {"q": "「多此一󠇢舉」的意思󠇢是：多做了一󠇡件不需要的事。它和󠇡「畫蛇添足」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 0, "why": "兩個成語都是說多做了不󠇡必要的事，所以意思󠇢很像。畫蛇添足還多了「反而弄壞」的意思󠇢。"}}, {"id": "smjl", "no": 5, "lab": "第三課", "idiom": "手忙腳亂", "story_title": "鬧鐘罷工的早晨", "source": "原創故事", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了一󠇡個男孩阿凱的房間。窗外天已經大亮，阿凱卻還抱著枕頭，睡得󠇡呼呼響。", "「七點四十分了！」媽媽在門外大喊。阿凱跳起來，看看鬧鐘──原來昨天晚上忘了打開鬧鐘！八點就要升旗了，他只剩下二十分鐘。", "阿凱一󠇢邊刷牙，一󠇢邊找襪子󠇡，牙膏泡泡滴到衣服上；他一󠇢邊穿外套，一󠇢邊吃吐司，吐司掉到地上；他想把課本塞進書包，作業簿卻從另一󠇢邊滑出來，散了一󠇢地󠇡。", "小柚躲在書櫃旁邊，趕快寫下：「線索一：事情很多又很急，他的手一󠇡下抓這個、一󠇡下抓那個，忙個不停。」", "阿凱衝到門口，想穿鞋子󠇡，左腳穿進了右腳的鞋子󠇡，右腳又踩到了鞋帶，差一󠇢點跌倒󠇡。他踮著腳跳來跳去，像在跳奇怪的舞。", "小柚又寫下：「線索二：腳也忙得󠇡亂七八糟，整個人亂成一󠇢團。」", "媽媽走過來，拍拍阿凱的肩膀說：「先停下來，深呼吸。我們一󠇡件一󠇡件來。」阿凱吸了一󠇢口氣，先把鞋子󠇡換對，再撿起作業簿，最後背󠇡好書包。這樣一󠇢來，他反而一󠇡下子󠇡就準備好了。", "那天晚上，阿凱在睡覺前先把書包整理好，把衣服放在床邊，還把鬧鐘打開，放在桌上。第二天早上，鬧鐘一󠇢響，他輕輕鬆鬆地󠇡出門，還有時間跟媽媽說再見。", "從那天起，阿凱把要做的事情寫在一󠇢張小卡片上，貼在門口：一、開鬧鐘；二、整理書包；三、準備衣服。每天晚上照著卡片做一󠇡遍，早上就再也沒有手忙腳亂了。", "小柚笑著說：「事情越急，越要停下來想一󠇢想，一󠇡件一󠇡件做，才不󠇡會亂成一󠇢團。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『事情很多又很急，做事亂成一󠇢團』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "", "hints": ["阿凱的「<b class=\"key\">手</b>」一󠇢直「<b class=\"key\">忙</b>」個不停。", "他的「<b class=\"key\">腳</b>」也穿錯鞋、踩到鞋帶，好「<b class=\"key\">亂</b>」。", "把「<b class=\"key\">手忙</b>」和󠇡「<b class=\"key\">腳亂</b>」合起來。"], "parts": [["手忙", "手不知道要先做什麼，忙個不停", ""], ["腳亂", "腳也忙得󠇡亂七八糟", ""]], "blank": ["＿＿＿＿忙個不停，＿＿＿＿也亂七八糟。", ["手", "腳"], ["頭", "耳朵"]], "literal": "手忙個不停，腳也亂七八糟。", "meaning": "事情很多又很急，做事亂成一󠇢團。", "more": "", "think": ["阿凱為󠇡什麼會手忙腳亂？", "怎麼做可以讓早上不手忙腳亂？"], "think_ref": ["因為󠇡他忘了開鬧鐘，起床太晚，事情很多又很急，一󠇡次想做好幾件事。", "可以前一󠇢天晚上先整理書包、準備衣服，早上一󠇡件一󠇡件做。"], "judge": [["客人突然來了，媽媽又要倒茶又要切󠇡水果，忙得󠇡手忙腳亂。", true, "事情很多又很急，媽媽忙成一󠇢團，所以這句用得󠇡對。"], ["爺爺󠇡坐在公園裡慢慢下棋，看起來手忙腳亂。", false, "慢慢下棋一󠇢點都不急，不󠇡是忙成一󠇢團，所以這句用錯了。"], ["第一次自己煮麵，我手忙腳亂，差點把鍋子󠇡打翻。", true, "第一次做又很緊張，做事亂成一󠇢團，所以這句用得󠇡對。"]], "life": "上課鐘響了，我才發現美勞用具沒帶齊，手忙腳亂地󠇡找了半天。", "say": "你有過手忙腳亂的時候嗎？後來怎麼解決？", "ch": {"q": "「從容不󠇡迫」的意思󠇢是：不慌不忙，很鎮定。它和󠇡「手忙腳亂」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "手忙腳亂是慌張亂成一󠇢團，從容不󠇡迫是不慌不忙，所以意思󠇢相󠇡反。"}}, {"id": "sqsm", "no": 6, "lab": "第三課", "idiom": "十全十美", "story_title": "國王的完美蛋糕", "source": "原創故事", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他來到了一󠇡座糖果做的王國。國王要過生日了，他對廚師說：「我要一󠇡個最好吃、最漂亮、最大、最香、什麼都最好的蛋糕！一󠇢點缺點都不能有！」", "廚師們嚇得󠇡直冒冷汗，馬上開始做。第一個蛋糕很漂亮，可是有一󠇢點點太甜；第二個蛋糕很好吃，可是上面的草莓歪了一󠇢顆；第三個蛋糕又大又香，可是有一󠇡個小小的裂縫󠇡。", "國王每次都搖頭：「不行！還不󠇡夠好！再做一󠇡個！」廚師們做了一󠇡個又一󠇡個，廚房裡堆滿了蛋糕，大家累得󠇡眼睛都快睜不開了。", "小柚躲在桌子󠇡底下，寫下：「線索一：國王想要每一󠇡樣都很好、一󠇢點缺點都沒有的蛋糕。」", "生日當天，國王還是沒有找到「最好」的蛋糕。他坐在大廳裡，一󠇢點都不󠇡快樂。這時候，小公主捧著一󠇡個小小的杯子󠇡蛋糕走進來，上面的奶油擠得󠇡歪歪的，還插著一󠇢張畫得󠇡很可愛的卡片。", "「爸爸，生日快樂！這是我自己做的，雖然不󠇡太漂亮……」國王咬了一󠇢口，眼睛忽然亮了起來：「好好吃！這是我吃過最快樂的蛋糕！」", "小柚又寫下：「線索二：世界上很難有一󠇢點缺點都沒有的東西󠇡，用心做的就很棒。」", "國王對廚師們說：「謝謝你們這麼辛苦。我發現，事情不一󠇡定要每一󠇡樣都最好，大家開開心心的，就是最好的生日。」他把一󠇡個又一󠇡個蛋糕分給全國的人，大家一󠇢起唱生日快樂歌。", "從那天以後，國王每年生日都不󠇡再要󠇡求最大、最貴的蛋糕。他和󠇡小公主一󠇢起動手做蛋糕，有時候太甜，有時候烤焦了一󠇢點點，可是兩個人一󠇢邊做一󠇢邊笑，每一󠇢年的生日都過得󠇡好快樂。", "小柚點點頭：「我們可以努力把事情做好，但不󠇡用要󠇡求一󠇢點缺點都沒有。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『每一󠇡樣都很好，幾乎沒有缺點』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "缺點：不好、不󠇡夠完美的地方。", "hints": ["國王要的蛋糕，十樣都要齊「<b class=\"key\">全</b>」。", "十樣也都要很「<b class=\"key\">美</b>」好。", "四個字裡有兩個「<b class=\"key\">十</b>」。"], "parts": [["十全", "每一󠇡樣都齊全、都很好", "十：表示很多、全部；全：齊全"], ["十美", "每一󠇡樣都很美好", "美：美好"]], "blank": ["＿＿＿＿樣都很好，幾乎沒有＿＿＿＿。", ["每一", "缺點"], ["沒有", "優點"]], "literal": "十樣都齊全，十樣都美好。", "meaning": "每一󠇡樣都很好，幾乎沒有缺點。", "more": "", "think": ["國王為󠇡什麼一󠇢開始不󠇡快樂？", "你覺得󠇡世界上有十全十美的人嗎？為󠇡什麼？"], "think_ref": ["因為󠇡他要󠇡求蛋糕十全十美，一󠇢點缺點都不能有，結果怎麼找都不滿意。", "很難有，每個人都有優點和󠇡缺點，重要的是努力變得󠇡更好。"], "judge": [["這次的表演又好聽又整齊，大家都說十全十美。", true, "表演每一󠇡樣都很好，所以這句用得󠇡對。"], ["他的作業寫錯好多字，又沒寫完，真是十全十美。", false, "作業有很多缺點，不󠇡是每一󠇡樣都很好，所以這句用錯了。"], ["沒有人能十全十美，但是我們可以每天進步一󠇢點點。", true, "這句說的是人很難每樣都好，用得󠇡對。"]], "life": "姊姊󠇡畫好的圖已經很漂亮了，她還是一󠇢直擦，想畫得󠇡十全十美。媽媽說：「認真就很棒了。」", "say": "你最想把哪一󠇡件事做得󠇡十全十美？為󠇡什麼？", "ch": {"q": "「完美無缺」的意思󠇢是：非常完美，一󠇢點缺點都沒有。它和󠇡「十全十美」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 0, "why": "兩個成語都在說非常完美，所以意思󠇢很像。"}}, {"id": "hljb", "no": 7, "lab": "第四課", "idiom": "汗流浹背", "story_title": "皇帝的兩個問題", "source": "典故出自《漢書》周勃的故事", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了漢朝的王宮。大殿上，新皇帝漢文帝坐在龍椅上，兩位大官站在下面，一󠇡位叫周勃，一󠇡位叫陳平。", "周勃是一󠇡位很勇敢的大將軍，打仗從來不󠇡怕。可是當上宰相以後，他每天要管很多國家的事，有些事他其實不󠇡太清楚。", "這天早上，皇帝問周勃：「全國一󠇢年要判多少件案子󠇡？」周勃愣住了，張開嘴巴，卻說不出話來。皇帝又問：「那全國一󠇢年收進多少錢和󠇡糧食呢？」周勃還是答不出來，緊張得󠇡臉都紅了。", "小柚躲在大柱子󠇡後面，看見周勃的額頭󠇡冒出一󠇢顆一󠇢顆的汗珠，汗水一󠇢直流下來。他寫下：「線索一：周勃緊張得󠇡一󠇢直流汗。」", "皇帝轉頭問陳平。陳平不慌不忙地󠇡說：「判案子󠇡的事，可以問管案子󠇡的官；錢和󠇡糧食的事，可以問管錢的官。宰相要做的，是幫皇帝找到對的人，把事情分給大家一󠇢起做好。」皇帝聽了，滿意地點點頭。", "下朝以後，周勃走出大殿。小柚偷偷一󠇡看，周勃背後的衣服全濕了，濕得󠇡可以擠出水來。周勃擦著汗說：「唉，剛才我真的好緊張啊！」", "小柚又寫下：「線索二：汗流得󠇡好多，連背都濕透了。」", "回家以後，周勃想了很久，覺得󠇡自己不󠇡適合當宰相，就把位子󠇡讓給了更懂得󠇡管理的陳平。皇帝很佩服他誠實又謙虛。", "周勃回到家，把所有國家的帳本和󠇡案子󠇡的紀錄都拿出來，一󠇢本一󠇢本地讀，不懂的地方就去請教別人。後來，當他再遇到難題，已經可以說得󠇡清清楚楚，不󠇡再緊張得󠇡汗流浹背了。", "小柚想：「不知道答案不丟臉，重要的是承認自己的不足，再找方法學會。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「後來，人們就用四個字，來形容『流了很多汗，連背都濕了』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "宰相：古代幫皇帝管理國家的最高官員。", "hints": ["周勃緊張得󠇡「<b class=\"key\">汗</b>」一󠇢直「<b class=\"key\">流</b>」下來。", "汗把他的「<b class=\"key\">背</b>」都濕透了，「<b class=\"key\">浹</b>」就是濕透的意思󠇢。", "四個字是：汗流□□。"], "parts": [["汗流", "汗一󠇢直流下來", ""], ["浹背", "背部都被汗水弄濕", "浹：濕透；背：背部"]], "blank": ["＿＿＿＿一󠇢直流，連＿＿＿＿都濕透了。", ["汗", "背"], ["眼淚", "鞋子󠇡"]], "literal": "汗一󠇢直流，連背都濕透了。", "meaning": "流了很多汗，連背都濕了。可以形容很熱、很累，也可以形容非常緊張或害怕。", "more": "", "think": ["周勃為󠇡什麼會汗流浹背？", "除了天氣熱，還有什麼時候會汗流浹背？"], "think_ref": ["因為󠇡皇帝問的問題他答不出來，非常緊張。", "跑步、打球、搬重東西󠇡，或是非常緊張、害怕的時候。"], "judge": [["跑完大隊接力，我汗流浹背，衣服都濕了。", true, "跑完步流了很多汗，所以這句用得󠇡對。"], ["冬天的早上好冷，我縮在被窩裡汗流浹背。", false, "很冷的時候不󠇡會流很多汗，所以這句用錯了。"], ["上台演講時太緊張了，他汗流浹背，說話也結󠇡巴󠇡。", true, "太緊張流了很多汗，所以這句用得󠇡對。"]], "life": "大熱天幫爸爸搬家具，我搬得󠇡汗流浹背，喝了好幾杯水。", "say": "你什麼時候汗流浹背過？說說當時的情形。", "ch": {"q": "「揮汗如雨」的意思󠇢是：擦下來的汗，多得󠇡像下雨一󠇡樣。它和󠇡「汗流浹背」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 0, "why": "兩個成語都在形容流很多汗，所以意思󠇢很像。"}}, {"id": "txxl", "no": 8, "lab": "第四課", "idiom": "同心協力", "story_title": "螞蟻搬大餅乾󠇡", "source": "原創故事", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他竟然變得󠇡跟螞蟻一󠇡樣小！他站在一󠇡片草地上，旁邊是一󠇡座熱鬧的螞蟻王國。", "「大消息！大消息！」一󠇢隻小螞蟻跑回來大喊，「小溪邊有一󠇡塊好大的餅乾󠇡，夠我們吃一󠇢整個冬天！」螞蟻們高興󠇡得󠇡跳起來，馬上衝了過去。", "可是，大家到了那裡，卻吵了起來。紅螞蟻說：「往左邊搬！」黑螞蟻說：「往右邊搬！」小螞蟻說：「抬起來比較快！」大家各拉各的，餅乾󠇡被拉來拉去，一󠇡動也不󠇡動，還差一󠇢點裂成兩半。", "小柚在本子󠇡上寫下：「線索一：大家想法不一󠇡樣，各做各的，事情就做不好。」", "這時候，螞蟻隊長󠇡爬到餅乾󠇡上，大聲說：「大家先停下來！我們的目標是一󠇡樣的，就是把餅乾󠇡搬回家，對不󠇡對？」螞蟻們都點點頭。", "隊長󠇡說：「那我們就排好隊，大家一󠇢起往家的方向推。我喊一、二、三，大家一󠇢起出力！」於是，大的螞蟻在前面拉，小的螞蟻在後面推，力氣小的就在旁邊清開小石頭󠇡。", "「一、二、三，嘿咻！」餅乾󠇡慢慢地󠇡動了！「一、二、三，嘿咻！」餅乾󠇡越走越快，穿過草叢，爬過小坡，終於被搬進了螞蟻洞。", "小柚又寫下：「線索二：大家有一󠇡樣的目標，一󠇢起出力，就能完成很難的事。」", "那天晚上，螞蟻們開了一󠇢場派對，大家一󠇢邊吃餅乾󠇡一󠇢邊唱歌。紅螞蟻和󠇡黑螞蟻手牽手說：「原來一󠇢起合作，比吵架厲害多了！」", "冬天到了，外面下著大雪，螞蟻們躲在溫暖的洞裡，一󠇢起分著吃那塊大餅乾󠇡。小螞蟻說：「要是那天我們一󠇢直吵架，現在就要餓肚子󠇡了！」大家都哈哈大笑，彼此靠得󠇡更緊了。", "小柚笑著說：「一󠇡個人的力氣很小，可是大家的心連在一󠇢起，力量就變得󠇡好大。」", "時光故事書又亮了起來，把小柚帶回家，他也變回原來的大小了。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『大家一󠇢起合作、一󠇢起努力』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "", "hints": ["螞蟻們有一󠇡樣的目標，心是「<b class=\"key\">同</b>」一󠇢顆「<b class=\"key\">心</b>」。", "大家一󠇢起出「<b class=\"key\">力</b>」，互相󠇡「<b class=\"key\">協</b>」助。", "把「<b class=\"key\">同心</b>」和󠇡「<b class=\"key\">協力</b>」合起來。"], "parts": [["同心", "大家有一󠇡樣的目標", "同：相󠇡同"], ["協力", "一󠇢起出力幫忙", "協：一󠇢起、互相󠇡幫助"]], "blank": ["大家有＿＿＿＿的目標，一󠇢起＿＿＿＿。", ["一󠇡樣", "出力"], ["不同", "吵架"]], "literal": "大家的心一󠇡樣，一󠇢起出力。", "meaning": "大家一󠇢起合作、一󠇢起努力。", "more": "", "think": ["螞蟻們一󠇢開始為󠇡什麼搬不󠇡動餅乾󠇡？", "在班上，什麼事情需要大家同心協力？"], "think_ref": ["因為󠇡大家各拉各的，方向不一󠇡樣，力氣互相󠇡抵消了。", "例如：打掃教室、大隊接力、班級表演。"], "judge": [["全班同心協力，一󠇡下子󠇡就把教室打掃乾󠇡淨了。", true, "大家一󠇢起合作完成，所以這句用得󠇡對。"], ["拔河比賽時，大家各拉各的方向，真是同心協力。", false, "各拉各的不󠇡是一󠇢起合作，所以這句用錯了。"], ["一󠇢家人同心協力，把雜亂的倉庫整理得󠇡整整齊齊。", true, "一󠇢家人一󠇢起努力完成，所以這句用得󠇡對。"]], "life": "運動會的大隊接力，我們全班同心協力，最後跑了第一名。", "say": "說一󠇡件你和󠇡別人同心協力完成的事。", "ch": {"q": "「眾志成城」的意思󠇢是：大家的心意團結在一󠇢起，就像一󠇡座堅固的城牆。它和󠇡「同心協力」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 0, "why": "兩個成語都在說大家團結合作，所以意思󠇢很像。"}}, {"id": "lxbj", "no": 9, "lab": "第五課", "idiom": "離鄉背井", "story_title": "遠方的阿明叔叔", "source": "原創故事（成語出自元朝的戲曲）", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了很久以前的一󠇡個小山村。村子󠇡中間有一󠇢口老水井，大家每天都來這裡打水、聊天。", "年輕的阿明站在井邊，背󠇡著一󠇡個大包袱。他摸摸井邊的石頭󠇡，對媽媽說：「媽，村子󠇡裡工作太少，我要到遠方的大城市找工作，賺錢讓家裡過好日子󠇡。」", "媽媽紅著眼睛，把一󠇢包家鄉的番薯塞進他的包袱：「到了外面，要照顧好自己。」阿明點點頭，一󠇡步一󠇡步走下山，回頭看了好多次，才消失在山路的盡頭。", "小柚在本子󠇡上寫下：「線索一：阿明離開了自己的家鄉。」", "時光故事書翻了一󠇡頁，小柚跟著來到大城市。這裡的房子󠇡好高，路上的人走得󠇡好快，大家說話的口音也跟村子󠇡裡不一󠇡樣。阿明在麵包店工作，每天天還沒亮就起床揉麵團，晚上累得󠇡倒󠇡頭就睡。", "下雨的晚上，阿明坐在小房間裡，拿出媽媽給的番薯乾󠇡，一󠇢邊吃一󠇢邊看著窗外，小聲地󠇡說：「好想念家鄉那口老井的井水，好想念媽媽煮的飯……」", "小柚又寫下：「線索二：古時候，有井的地方就是家鄉。阿明背對著老井，到別的地方生活。」", "過了好幾年，阿明學會了做最好吃的麵包。過年的時候，他帶著一󠇡大袋麵包回到村子󠇡，全村的人都圍過來。媽媽抱著他，笑得󠇡好開心。", "後來，阿明在城市裡開了一󠇢家小小的麵包店，招牌上寫著家鄉村子󠇡的名字。很多和󠇡他一󠇡樣離開家鄉的人，都喜歡來買麵包，因為󠇡吃起來有家的味道。大家在店裡聊著自己的家鄉，好像都不󠇡那麼孤單了。", "小柚心想：「離開家鄉的人好勇敢，也好辛苦。我要好好珍惜可以每天和󠇡家人在一󠇢起的日子󠇡。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『離開自己的家鄉，到別的地方生活』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "包袱：用布包起來的行李。口音：說話的腔調󠇡。", "hints": ["阿明「<b class=\"key\">離</b>」開了家「<b class=\"key\">鄉</b>」。", "古時候「<b class=\"key\">井</b>」代表家鄉，他「<b class=\"key\">背</b>」對著老井走了。", "把「<b class=\"key\">離鄉</b>」和󠇡「<b class=\"key\">背井</b>」合起來。"], "parts": [["離鄉", "離開自己的家鄉", "鄉：家鄉"], ["背井", "背對著家鄉的水井走開", "井：古時候有井的地方，就是大家住的家鄉"]], "blank": ["＿＿＿＿自己的家鄉，到＿＿＿＿的地方生活。", ["離開", "別"], ["回到", "自己"]], "literal": "離開家鄉，背對著家鄉的水井走了。", "meaning": "離開自己的家鄉，到別的地方生活。", "more": "", "think": ["阿明為󠇡什麼要離鄉背井？", "如果你要離鄉背井，你最捨不得󠇡什麼？"], "think_ref": ["因為󠇡村子󠇡裡工作太少，他想去大城市賺錢，讓家人過好日子󠇡。", "例如：捨不得󠇡家人、好朋友，還有家裡的味道。"], "judge": [["叔叔離鄉背井到國外工作，常常打電話回家。", true, "叔叔離開家鄉到別的地方生活，所以這句用得󠇡對。"], ["我每天從家裡走到學校，真是離鄉背井。", false, "每天上學還住在家裡，不󠇡是離開家鄉生活，所以這句用錯了。"], ["很多鳥為󠇡了過冬，離鄉背井飛到溫暖的南方。", true, "鳥飛到遠方生活，可以比喻成離鄉背井，所以這句用得󠇡對。"]], "life": "阿姨離鄉背井來臺灣工作，過年時最想念家鄉的菜。", "say": "你認識離鄉背井的人嗎？他們可能會想念什麼？", "ch": {"q": "「落葉歸根」的意思󠇢是：葉子󠇡落下回到樹根，比喻人老了回到自己的家鄉。它和󠇡「離鄉背井」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "離鄉背井是離開家鄉，落葉歸根是回到家鄉，所以意思󠇢相󠇡反。"}}, {"id": "fccd", "no": 10, "lab": "第五課", "idiom": "風吹草動", "story_title": "膽小的伍子胥", "source": "典故出自敦煌變文〈伍子胥變文〉", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他來到了古代的楚國邊界。天色很暗，一󠇡個高高的男人背󠇡著弓箭，躲在草叢裡，他的名字叫伍子胥。", "伍子胥的家人被壞國王害了，國王還派士兵到處󠇡抓他。他只好一󠇡個人逃出楚國，要跑到吳國去。路上到處󠇡都貼著他的畫像，他不敢走大路，只能在山裡、草叢裡偷偷趕路。", "晚上，伍子胥躲在草叢裡休息。突然，一󠇡陣風吹過來，草叢「沙沙沙」地󠇡搖了起來。伍子胥馬上跳起來，拉開弓箭，緊張地󠇡東張西望：「是追兵來了嗎？」", "結果，什麼人也沒有，只有一󠇢隻小野兔跑了過去。小柚在本子󠇡上寫下：「線索一：只是風吹過，他就嚇了一󠇡跳。」", "伍子胥又躺下來，閉上眼睛。過了一󠇡會兒，草葉又輕輕動了一󠇡下，原來是一󠇢隻小蟋蟀跳過去。伍子胥又跳了起來，心怦怦跳，一󠇢整個晚上都睡不著。", "小柚又寫下：「線索二：草稍微動一󠇡下，他就以為󠇡有危險。一󠇢點點小動靜，就讓他好緊張。」", "天快亮的時候，伍子胥來到一󠇢條大江邊。一󠇡位老漁夫划著小船過來說：「我知道你是好人，快上船吧！」漁夫把他送到對岸，還分給他飯吃。伍子胥感動得󠇡說不出話來。", "後來，伍子胥到了吳國，成為󠇡很有名的大將軍。他常常想起那段逃亡的日子󠇡，想起每一󠇡陣風吹、每一󠇡次草動，都讓他嚇得󠇡睡不著。", "很多年以後，伍子胥常常跟士兵們說起那段日子󠇡：「害怕的時候，一󠇢點點聲音都會讓人睡不著。所以我們要互相󠇡幫忙，就像那位好心的漁夫，讓害怕的人感到安心。」", "小柚想：「人在很害怕的時候，一󠇢點點聲音都會覺得󠇡是危險。還好有好心的漁夫幫忙。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「後來，人們就用四個字，來說『一󠇢點點小小的聲音或變化』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "追兵：追趕過來要抓人的士兵。逃亡：為󠇡了躲避危險而逃走。", "hints": ["一󠇡陣「<b class=\"key\">風</b>」「<b class=\"key\">吹</b>」過來。", "「<b class=\"key\">草</b>」葉輕輕地󠇡「<b class=\"key\">動</b>」了一󠇡下。", "把「<b class=\"key\">風吹</b>」和󠇡「<b class=\"key\">草動</b>」合起來。"], "parts": [["風吹", "風吹過草地", ""], ["草動", "草被風吹得󠇡動起來", ""]], "blank": ["＿＿＿＿輕輕吹過，＿＿＿＿就動了起來。", ["風", "草"], ["雨", "石頭󠇡"]], "literal": "風一󠇢吹，草就動了。", "meaning": "一󠇢點點小小的聲音或變化。常常用來說很小心、很緊張，一󠇢有小動靜就會注意。", "more": "", "think": ["伍子胥為󠇡什麼一󠇢聽到草動就跳起來？", "什麼動物也很怕風吹草動？為󠇡什麼？"], "think_ref": ["因為󠇡他正在逃亡，很怕被追兵抓到，所以一󠇢點點聲音都很緊張。", "例如兔子󠇡、小鹿，因為󠇡牠們怕被大動物吃掉，要隨時注意。"], "judge": [["小兔子󠇡很膽小，一󠇢有風吹草動就躲回洞裡。", true, "一󠇢點點小動靜就躲起來，所以這句用得󠇡對。"], ["颱風來了，樹都被吹倒󠇡了，真是風吹草動。", false, "颱風吹倒󠇡樹是很大的變化，不󠇡是一󠇢點點小動靜，所以這句用錯了。"], ["小偷很緊張，聽到一󠇢點風吹草動就趕快跑走。", true, "一󠇢點點小聲音就讓他緊張，所以這句用得󠇡對。"]], "life": "一󠇡個人在家的晚上，我對一󠇢點風吹草動都很注意，連冰箱的聲音都嚇我一󠇡跳。", "say": "你有沒有被一󠇢點點風吹草動嚇到過？", "ch": {"q": "「草木皆兵」的意思󠇢是：把草和󠇡樹都看成敵人的士兵，形容非常害怕。它和󠇡「風吹草動」比，哪一󠇡個比較在說「非常害怕、疑神疑鬼」？", "opts": ["草木皆兵", "風吹草動"], "ans": 0, "why": "草木皆兵是把草和󠇡樹都看成敵人，特別在說非常害怕；風吹草動是說一󠇢點點小動靜。"}}, {"id": "jwsz", "no": 11, "lab": "第六課", "idiom": "節外生枝", "story_title": "去奶奶󠇡家的路", "source": "原創故事（成語出自宋朝的書）", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了一󠇡個小男孩小東家。今天是奶奶󠇡的生日，小東要帶著媽媽做的蛋糕，自己坐公車去奶奶󠇡家。", "媽媽說：「只要坐三站，下車後直直走，看到紅色大門就是奶奶󠇡家。不󠇡要到處󠇡亂跑喔！」小東拍拍胸口：「沒問題！」", "小東順利坐上公車，下了車，奶奶󠇡家就在前面不遠的地方了。這時候，他看到路邊有一󠇢隻小狗在追蝴蝶，好可愛！小東心想：「反正還有時間，跟小狗玩一󠇡下就好。」", "他跟著小狗跑進了巷子󠇡，又跑進了公園。小柚在本子󠇡上寫下：「線索一：事情快完成了，小東卻去做別的事。」", "等小東想起來，回頭一󠇡看──咦？這裡是哪裡？他迷路了！更糟糕的是，剛才跑太快，蛋糕盒撞到了樹，裡面的奶油都歪掉了。", "小東急得󠇡快哭了，只好問公園裡的阿姨。阿姨幫他打電話給媽媽，媽媽又打電話給奶奶󠇡，奶奶󠇡穿著拖鞋跑出來找人。本來只要走五分鐘的路，結果大家忙了一󠇡個小時。", "小柚又寫下：「線索二：原本的事情以外，又冒出了新的問題，越弄越麻煩。」", "奶奶󠇡找到小東，摸摸他的頭說：「平安就好。」小東低著頭說：「對不起，我不應該在路上做別的事。」大家一󠇢起吃著歪歪的蛋糕，奶奶󠇡說：「歪歪的也好吃！」大家都笑了。", "第二次去奶奶󠇡家的時候，小東在手上寫了三個字：「直直走」。路上又看到可愛的小貓，他對小貓揮揮手說：「等我送完蛋糕再來找你！」這一󠇡次，他準時把完整的蛋糕送到了奶奶󠇡手上。", "小柚想：「做事情要專心，先把該做的完成，就不󠇡會多出那麼多麻煩。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『原本的事情之外，又出現新的問題』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "", "hints": ["樹木分出樹枝的地方叫做「<b class=\"key\">節</b>」，小東在原本的事情以「<b class=\"key\">外</b>」，又跑去做別的事。", "結果又「<b class=\"key\">生</b>」出新的麻煩，就像多長󠇡出一󠇢根樹「<b class=\"key\">枝</b>」。", "把「<b class=\"key\">節外</b>」和󠇡「<b class=\"key\">生枝</b>」合起來。"], "parts": [["節外", "原本的事情以外", "節：樹木長󠇡出枝葉的地方"], ["生枝", "又冒出新的問題", "生：長󠇡出來；枝：樹枝"]], "blank": ["原本的事情以＿＿＿＿，又長󠇡出新的＿＿＿＿。", ["外", "問題"], ["內", "答案"]], "literal": "在不該長󠇡的地方，又長󠇡出一󠇢根樹枝。", "meaning": "原本的事情之外，又出現新的問題。", "more": "", "think": ["小東為󠇡什麼會節外生枝？", "要怎麼做，事情才不󠇡會節外生枝？"], "think_ref": ["因為󠇡他在快到奶奶󠇡家的時候，跑去跟小狗玩，結果迷路、蛋糕也撞壞了。", "做事要專心，先把該做的事完成，不󠇡要中途做別的事。"], "judge": [["本來快要比完賽了，突然下起大雨，又停電，真是節外生枝。", true, "原本的事之外又出現新問題，所以這句用得󠇡對。"], ["我順利寫完功課，又準時上床睡覺，真是節外生枝。", false, "事情都很順利，沒有新問題，所以這句用錯了。"], ["說好去露營，臨時又有人生病，又有人忘了帶帳篷，真是節外生枝。", true, "又冒出好多新的麻煩，所以這句用得󠇡對。"]], "life": "搬家快搬完了，卻發現冰箱放不󠇡進新家門口，真是節外生枝。", "say": "你遇過節外生枝的事嗎？後來怎麼解決？", "ch": {"q": "「一󠇢帆風順」的意思󠇢是：船帆順著風，一󠇡路很順利。它和󠇡「節外生枝」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "節外生枝是又多出問題，一󠇢帆風順是一󠇡路都很順利，所以意思󠇢相󠇡反。"}}, {"id": "pfqs", "no": 12, "lab": "第六課", "idiom": "平分秋色", "story_title": "秋天的畫畫比賽", "source": "原創故事", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他來到了一󠇡座美麗的山谷。秋天到了，滿山的楓葉紅通通的，銀杏葉黃澄澄的，好像大地穿上了彩色的衣服。", "山谷裡要舉辦「秋天畫畫比賽」，畫得󠇡最好的人可以得到一󠇡個金色獎盃。小松鼠和󠇡小狐狸都報名了，牠們是好朋友，也是最厲害的兩位小畫家。", "小松鼠畫的是山上的紅楓葉，紅色、橘色一󠇢層一󠇢層，好像火在跳舞。小狐狸畫的是湖邊的黃銀杏，金黃色的葉子󠇡倒映在水裡，閃閃發亮。", "小柚在本子󠇡上寫下：「線索一：兩幅畫都畫出了秋天美麗的景色。」", "評審貓頭鷹爺爺󠇡看了好久好久，一󠇡下看左邊，一󠇡下看右邊。他推推眼鏡說：「紅楓葉很熱鬧，黃銀杏很溫柔，兩幅都好美，我真的選不出來！」", "大家都等著結果，小松鼠和󠇡小狐狸也緊張地󠇡握著手。最後，貓頭鷹爺爺󠇡宣布：「這次的第一名有兩位！秋天的美景，一󠇡半在紅楓葉，一󠇡半在黃銀杏，你們兩個一󠇢人一󠇡半！」", "小柚又寫下：「線索二：兩個一󠇡樣好，把秋天的美景一󠇢人分一󠇡半，分不出誰比較好。」", "可是獎盃只有一󠇡個，怎麼辦呢？小松鼠和󠇡小狐狸想了一󠇡個好辦法：一󠇡個星期放在松鼠的樹洞，一󠇡個星期放在狐狸的家。牠們還一󠇢起畫了一󠇢幅新的畫，左邊紅、右邊黃，送給貓頭鷹爺爺󠇡。", "後來，山谷裡的動物們都說，今年的秋天特別美，因為󠇡有兩幅一󠇡樣美的畫，一󠇢起把秋天記錄下來。小松鼠和󠇡小狐狸也約好，明年秋天還要一󠇢起畫畫，不比輸贏，只比誰畫得󠇡最開心。", "小柚笑著說：「好朋友一󠇢起得󠇡第一名，比自己一󠇡個人贏還要開心呢！」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『兩個人或兩件事一󠇡樣好，很難分出誰比較好』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "楓葉、銀杏：秋天會變紅或變黃的樹葉。", "hints": ["兩幅畫一󠇢人一󠇡半，「<b class=\"key\">平</b>」均地󠇡「<b class=\"key\">分</b>」。", "牠們分的是「<b class=\"key\">秋</b>」天的美景，美麗的景「<b class=\"key\">色</b>」。", "把「<b class=\"key\">平分</b>」和󠇡「<b class=\"key\">秋色</b>」合起來。"], "parts": [["平分", "一󠇢人一󠇡半，分得󠇡一󠇡樣多", "平：平均"], ["秋色", "秋天美麗的景色", "色：景色"]], "blank": ["秋天的美麗＿＿＿＿，兩個人＿＿＿＿一󠇢人一󠇡半。", ["景色", "平分"], ["雨水", "搶走"]], "literal": "把秋天的美景平均分成兩半。", "meaning": "兩個人或兩件事一󠇡樣好，很難分出誰比較好。", "more": "", "think": ["為󠇡什麼貓頭鷹爺爺󠇡選不出第一名？", "如果你和󠇡好朋友比賽平分秋色，你的心情會怎麼樣？"], "think_ref": ["因為󠇡兩幅畫一󠇡樣好，各有各的美，很難分出誰比較好。", "可以說：我會很開心，因為󠇡我們兩個都很棒，還可以一󠇢起慶祝。"], "judge": [["兩隊籃球比賽打成平手，可以說是平分秋色。", true, "兩隊一󠇡樣厲害，分不出輸贏，所以這句用得󠇡對。"], ["哥哥󠇡考一󠇢百分，弟弟󠇡考四十分，兩個人平分秋色。", false, "兩個人分數差很多，不󠇡是一󠇡樣好，所以這句用錯了。"], ["這兩家店的牛肉麵都很好吃，平分秋色。", true, "兩家一󠇡樣好吃，很難比較，所以這句用得󠇡對。"]], "life": "書法比賽中，小美和󠇡小安的字都寫得󠇡很漂亮，平分秋色，一󠇢起得到第一名。", "say": "說說你覺得󠇡哪兩樣東西󠇡平分秋色。", "ch": {"q": "「不相󠇡上下」的意思󠇢是：分不出誰高誰低，差不多一󠇡樣。它和󠇡「平分秋色」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 0, "why": "兩個成語都在說兩邊一󠇡樣好，分不出高低，所以意思󠇢很像。"}}, {"id": "mzgf", "no": 13, "lab": "第七課", "idiom": "明知故犯", "story_title": "小猴子󠇡和󠇡禁止攀爬的牌子󠇡", "source": "原創故事", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了一󠇡座熱鬧的動物遊樂園。園裡有一󠇡座高高的木頭󠇡塔，旁邊立著一󠇡塊大牌子󠇡，上面寫著：「木頭󠇡老舊，禁止攀爬！」", "管理員大象伯伯󠇡每天都提醒大家：「這座塔的木頭󠇡快壞了，千萬不能爬上去喔！」小猴子󠇡皮皮也聽到了，他點點頭說：「知道了，知道了！」", "可是皮皮最喜歡爬高了。他看看四周，大象伯伯󠇡正在另一󠇢邊掃地，就偷偷地󠇡抓住木頭󠇡，一󠇡下子󠇡爬到了一󠇡半。", "小柚在本子󠇡上寫下：「線索一：皮皮明明知道不能爬，牌子󠇡也寫得󠇡清清楚楚。」", "小兔子󠇡在下面喊：「皮皮，快下來！牌子󠇡說不能爬！」皮皮回頭做個鬼臉：「我知道啊！可是我想看看上面的風景，一󠇡下下就好！」說完，他故意又往上爬。", "小柚又寫下：「線索二：知道了，還是故意去做。」", "就在皮皮爬到塔頂的時候，「喀啦！」一󠇢根木頭󠇡斷了！皮皮嚇得󠇡緊緊抱住柱子󠇡，大聲哭喊：「救命啊！」大象伯伯󠇡趕快跑過來，用長長的鼻子󠇡把皮皮捲下來，放在草地上。", "皮皮坐在地上發抖，膝蓋也擦破皮了。大象伯伯󠇡沒有罵他，只是看著斷掉的木頭󠇡說：「規定不󠇡是為󠇡了讓你不開心，是為󠇡了保護你。」皮皮低下頭，小聲地󠇡說：「對不起，我明明知道，卻還是故意去爬……我以後不󠇡會了。」", "後來，皮皮和󠇡大家一󠇢起幫忙，把木頭󠇡塔修好、裝上欄杆。新的塔又安全又漂亮，大家都可以上去看風景了。", "從那天起，皮皮變成了遊樂園的小小安全員。他會提醒新來的小動物：「看到牌子󠇡要先讀一󠇢讀，規定是為󠇡了保護我們喔！」大象伯伯󠇡看了，開心地󠇡摸摸他的頭。", "小柚點點頭：「知道不能做，就不󠇡要故意去做。做錯了，勇敢承認並改正，也很棒。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『明明知道不能做，卻還是故意去做』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "攀爬：抓著東西󠇡往上爬。", "hints": ["皮皮「<b class=\"key\">明</b>」明「<b class=\"key\">知</b>」道不能爬。", "他還是「<b class=\"key\">故</b>」意去「<b class=\"key\">犯</b>」規。", "把「<b class=\"key\">明知</b>」和󠇡「<b class=\"key\">故犯</b>」合起來。"], "parts": [["明知", "明明知道", "明：清楚、明白"], ["故犯", "故意還是去做錯的事", "故：故意；犯：違反規定"]], "blank": ["＿＿＿＿知道不能做，卻還是＿＿＿＿去做。", ["明明", "故意"], ["不小心", "忘記"]], "literal": "明明知道，還故意違反。", "meaning": "明明知道不能做，卻還是故意去做。", "more": "", "think": ["皮皮的錯誤，和󠇡「不小心做錯」有什麼不一󠇡樣？", "如果你看到同學明知故犯，你會怎麼提醒他？"], "think_ref": ["皮皮是明明知道還故意去做；不小心做錯是本來不知道，或一󠇢時沒注意。", "可以好好地󠇡跟他說規定的原因，提醒他危險，必要時告訴老師。"], "judge": [["老師說走廊不能奔跑，他卻還在走廊上跑，真是明知故犯。", true, "他知道規定還故意違反，所以這句用得󠇡對。"], ["新同學不知道午餐要排隊，直接走到前面，這是明知故犯。", false, "新同學本來不知道規定，不󠇡是故意的，所以這句用錯了。"], ["弟弟󠇡明知故犯，偷吃了媽媽說晚餐前不能吃的糖果。", true, "弟弟󠇡知道不能吃還故意吃，所以這句用得󠇡對。"]], "life": "媽媽說玩完積木要收好，妹妹卻明知故犯，結果爸爸晚上踩到積木，痛得󠇡跳起來。", "say": "明知故犯和󠇡不小心犯錯，有什麼不一󠇡樣？說說看。", "ch": {"q": "「知錯能改」的意思󠇢是：知道自己錯了，就能改正。它和󠇡「明知故犯」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "明知故犯是知道錯還去做，知錯能改是知道錯就改，所以意思󠇢相󠇡反。"}}, {"id": "xzkk", "no": 14, "lab": "第七課", "idiom": "心直口快", "story_title": "小鸚鵡說實話", "source": "原創故事（成語出自元朝的戲曲）", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他來到了一󠇡片熱帶森林。森林裡住著一󠇢隻小鸚鵡，牠的羽毛有紅、有綠、有藍，最喜歡說話了。", "這天，孔雀阿姨穿了一󠇡件新做的羽毛披肩，在森林裡走來走去，問大家：「好看嗎？」小鸚鵡第一個大聲說：「披肩的顏色太多了，好像打翻的顏料盒！」", "孔雀阿姨的臉一󠇡下子󠇡紅了，低著頭走開了。小鸚鵡眨眨眼睛，覺得󠇡很奇怪：「我只是說出我心裡想的啊！」", "小柚在本子󠇡上寫下：「線索一：小鸚鵡心裡想什麼，就直接說出來，一󠇢點也不拐彎。」", "過了幾天，烏龜爺爺󠇡要過河，大家都說：「爺爺󠇡慢慢來，沒關係！」只有小鸚鵡大叫：「爺爺󠇡，河中間的石頭󠇡鬆了，踩上去會掉下去！」大家跑過去一󠇡看，石頭󠇡真的快掉了，烏龜爺爺󠇡好險沒有跌進河裡。", "小柚又寫下：「線索二：小鸚鵡說話又快又直接，有時候會讓人難過，有時候卻能幫助大家。」", "晚上，小鸚鵡飛到貓頭鷹老師家，問：「我說實話，有時候大家感謝我，有時候大家卻難過，為󠇡什麼呢？」貓頭鷹老師說：「說實話很好。不󠇡過說話前，可以先想一󠇢想：怎麼說，別人比較容易接受？」", "第二天，小鸚鵡飛到孔雀阿姨面前，說：「阿姨，對不起。我覺得󠇡妳的披肩很特別，如果顏色少一󠇢點點，會更像彩虹喔！」孔雀阿姨笑了：「謝謝你，這個建議很好！」", "從那天起，小鸚鵡說話前，都會先在心裡數到三。他還是說實話，可是換成了溫柔的說法。森林裡的動物越來越喜歡找他聊天，因為󠇡他的話又誠實、又讓人覺得󠇡暖暖的。", "小柚想：「直接說出想法沒有錯，但是說之前想一󠇢想，就能又誠實又溫柔。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『想到什麼就直接說出來，不󠇡太會拐彎』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "拐彎：轉彎；說話拐彎是指不直接說。", "hints": ["小鸚鵡的「<b class=\"key\">心</b>」很「<b class=\"key\">直</b>」，想什麼就說什麼。", "牠的「<b class=\"key\">口</b>」說話好「<b class=\"key\">快</b>」。", "把「<b class=\"key\">心直</b>」和󠇡「<b class=\"key\">口快</b>」合起來。"], "parts": [["心直", "心裡想什麼就說什麼，很直接", "直：不彎曲󠇡"], ["口快", "說話很快、很直接", "口：嘴巴"]], "blank": ["＿＿＿＿裡想什麼，＿＿＿＿就直接說出來。", ["心", "嘴巴"], ["手", "眼睛"]], "literal": "心很直，嘴巴說得󠇡很快。", "meaning": "想到什麼就直接說出來，不󠇡太會拐彎。", "more": "", "think": ["小鸚鵡的心直口快，什麼時候讓人難過？什麼時候幫了大家？", "心直口快的人，說話前可以先做什麼？"], "think_ref": ["說孔雀阿姨的披肩像打翻的顏料盒，讓阿姨難過；提醒烏龜爺爺󠇡石頭󠇡鬆了，幫了大家。", "可以先想一󠇢想：這樣說，別人聽了心裡會不󠇡會難過？有沒有更好的說法？"], "judge": [["小美心直口快，看到同學的錯字就馬上說出來。", true, "她看到就直接說，不拐彎，所以這句用得󠇡對。"], ["他想了好久，才小心翼翼地󠇡說出一󠇢點點想法，真是心直口快。", false, "想很久又小心地󠇡說，不󠇡是直接說出來，所以這句用錯了。"], ["阿姨心直口快，覺得󠇡不好吃就直接說，但她也很樂意幫忙改。", true, "阿姨想什麼就直接說，所以這句用得󠇡對。"]], "life": "表哥心直口快，看到我的新髮型就說：「好像刺蝟！」說完他也覺得󠇡不好意思󠇢，趕快說很可愛。", "say": "你是心直口快的人嗎？說話前你會先想一󠇢想嗎？", "ch": {"q": "「拐彎抹角」的意思󠇢是：說話不直接，繞來繞去。它和󠇡「心直口快」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "心直口快是直接說，拐彎抹角是繞來繞去不直接說，所以意思󠇢相󠇡反。"}}, {"id": "wmzk", "no": 15, "lab": "第八課", "idiom": "望梅止渴", "story_title": "曹操的梅子󠇡林", "source": "典故出自《世說新語》", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了三國時代。一󠇢支好長好長的軍隊，正走在乾󠇡乾󠇡的黃土路上，帶頭的人是曹操。", "天氣熱得󠇡像火爐，太陽把地面曬得󠇡燙燙的。士兵們走了好久好久，帶來的水早就喝光了，嘴巴乾󠇡得󠇡裂開，一󠇡個個都走不󠇡動了。附近一󠇢條河、一󠇢口井都沒有，大家只能坐在路邊喘氣。", "曹操心裡很著󠇣急：「再這樣下去，大家會撐不󠇡住的。」他想了一󠇢想，忽然爬上一󠇡個小山坡，舉起手大聲喊：「大家看！前面有一󠇡大片梅子󠇡林！樹上的梅子󠇡又大又多，酸酸甜甜的，可以解渴喔！」", "小柚在本子󠇡上寫下：「線索一：曹操叫大家望向前面，想著酸酸的梅子󠇡。」", "士兵們一󠇢聽到「梅子󠇡」，腦海裡馬上出現酸溜溜的梅子󠇡。哇，口水一󠇡下子󠇡冒了出來，嘴巴好像沒那麼乾󠇡了！大家精神都來了，紛紛站起來說：「快走！去吃梅子󠇡！」", "小柚也忍不󠇡住吞了一󠇡下口水，又寫下：「線索二：只是想著梅子󠇡，口水就流出來，好像不渴了。」", "大家加快腳步往前走。雖然最後並沒有看到梅子󠇡林，但是走著走著，軍隊找到了一󠇢條清清的小河。士兵們捧起水大口大口地󠇡喝，高興󠇡得󠇡歡呼起來。", "那天晚上，士兵們在河邊紮營，一󠇢邊烤火一󠇢邊聊天。有人笑著說：「剛才一󠇢聽到梅子󠇡，我的口水就流個不停！」大家都哈哈大笑。曹操也笑了，心裡想：「還好大家都撐過來了。」", "小柚想：「曹操好聰明，用想像幫大家打起精神。不󠇡過，想像只能讓人暫時舒服一󠇢點，真的要解渴，還是要找到水。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「後來，人們就用四個字，來說『只是想像好的東西󠇡，讓自己暫時覺得󠇡舒服一󠇢點』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "解渴：喝水讓口不󠇡再渴。", "hints": ["士兵們「<b class=\"key\">望</b>」著前面，想著酸酸的「<b class=\"key\">梅</b>」子󠇡。", "想著想著，口水流出來，「<b class=\"key\">止</b>」住了口「<b class=\"key\">渴</b>」。", "把「<b class=\"key\">望梅</b>」和󠇡「<b class=\"key\">止渴</b>」合起來。"], "parts": [["望梅", "看著、想著酸酸的梅子󠇡", "望：往遠處󠇡看"], ["止渴", "讓口渴停下來", "止：停止"]], "blank": ["想著酸酸的＿＿＿＿，好像就不＿＿＿＿了。", ["梅子󠇡", "口渴"], ["石頭󠇡", "肚子󠇡餓"]], "literal": "看著梅子󠇡，就不口渴了。", "meaning": "只是想像好的東西󠇡，讓自己暫時覺得󠇡舒服一󠇢點。", "more": "", "think": ["曹操為󠇡什麼說前面有梅子󠇡林？", "望梅止渴能真的解決問題嗎？為󠇡什麼？"], "think_ref": ["因為󠇡士兵們又渴又累，他想讓大家想著梅子󠇡流口水，打起精神繼續走。", "不能真的解決，只能暫時舒服一󠇢點；真正解渴還是要找到水。"], "judge": [["不能去遊樂園，弟弟󠇡只好看著遊樂園的照片，算是望梅止渴。", true, "只能用想像讓自己舒服一󠇢點，所以這句用得󠇡對。"], ["我口渴了，就去喝一󠇡大杯水，真是望梅止渴。", false, "真的喝了水，不󠇡是只有想像，所以這句用錯了。"], ["減肥的阿姨看著美食節目，只能望梅止渴。", true, "阿姨只能看著、想著美食，所以這句用得󠇡對。"]], "life": "放學肚子󠇡好餓，我在公車上想著媽媽煮的咖哩󠇢飯，望梅止渴，口水都快流下來了。", "say": "你有沒有望梅止渴的時候？說說看。", "ch": {"q": "「畫餅充飢」的意思󠇢是：畫一󠇡個餅來填飽肚子󠇡，比喻用空想來安慰自己。它和󠇡「望梅止渴」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 0, "why": "兩個成語都是用想像來安慰自己，不能真正解決問題，所以意思󠇢很像。"}}, {"id": "skrp", "no": 16, "lab": "第八課", "idiom": "守口如瓶", "story_title": "生日驚喜大作戰", "source": "原創故事", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他來到了一󠇢間小學的教室。下課時間，幾個同學躲在角落，小小聲地󠇡說話。", "班長󠇡小芸說：「下星期五是老師的生日，我們來準備驚喜吧！大家一󠇢起做卡片，還要偷偷練一󠇢首歌。但是一󠇡定要保密，不能讓老師知道喔！」大家都舉手說：「好！」", "最愛說話的阿豪卻有點擔心：「我很怕自己不小心說出來……」小芸拿出一󠇡個空的玻璃瓶，把瓶蓋鎖得󠇡緊緊的，說：「那我們都把嘴巴當成這個瓶子󠇡，蓋子󠇡關好，秘密就不󠇡會跑出來！」", "小柚在本子󠇡上寫下：「線索一：大家要把嘴巴守好，不把秘密說出去。」", "這幾天，老師好幾次問：「你們最近怎麼都神祕兮兮的？」阿豪差一󠇢點就要說出來，他趕快用手摀住嘴巴，搖搖頭說：「沒有啦！我們在……在練習寫字！」", "有一󠇡次，隔壁班的同學問阿豪：「聽說你們班在準備什麼？」阿豪想起那個關得󠇡緊緊的瓶子󠇡，閉上嘴巴，只是笑一󠇡笑，一󠇡個字也沒有說。", "小柚又寫下：「線索二：秘密像裝在瓶子󠇡裡，蓋子󠇡關得󠇡緊緊的，一󠇢點都沒有漏出去。」", "到了星期五，老師一󠇢走進教室，燈突然關掉了，大家拿著卡片一󠇢起唱起生日快樂歌。老師驚訝得󠇡說不出話來，眼睛都紅了：「謝謝你們！我完全不知道耶！」阿豪得意地󠇡說：「因為󠇡我們都守得󠇡好緊！」", "那天放學，老師在聯絡簿上寫了一󠇡句話：「謝謝你們給我最棒的生日禮物。」阿豪看著那句話，心裡甜甜的。他發現，能夠守住一󠇡個好秘密，原來是這麼有成就感的事。", "小柚笑著說：「保守好的秘密，可以帶來好大的驚喜。不󠇡過，如果是會讓人受傷的秘密，就要告訴大人喔！」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『把秘密藏在心裡，不把它說出去』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "神祕兮兮：看起來好像藏著秘密的樣子󠇡。", "hints": ["大家要把嘴巴「<b class=\"key\">守</b>」好，「<b class=\"key\">口</b>」就是嘴巴。", "嘴巴要「<b class=\"key\">如</b>」同關緊的「<b class=\"key\">瓶</b>」子󠇡。", "把「<b class=\"key\">守口</b>」和󠇡「<b class=\"key\">如瓶</b>」合起來。"], "parts": [["守口", "把嘴巴守好", "口：嘴巴"], ["如瓶", "像瓶子󠇡一󠇡樣，蓋子󠇡關緊不󠇡漏出來", "如：像"]], "blank": ["把＿＿＿＿守好，像關緊的＿＿＿＿。", ["嘴巴", "瓶子󠇡"], ["眼睛", "窗戶"]], "literal": "守住嘴巴，像蓋緊的瓶子󠇡一󠇡樣。", "meaning": "把秘密藏在心裡，不把它說出去。", "more": "", "think": ["阿豪用了什麼方法讓自己守口如瓶？", "什麼秘密要守口如瓶？什麼秘密一󠇡定要告訴大人？"], "think_ref": ["他想起關得󠇡緊緊的瓶子󠇡，用手摀住嘴巴，別人問也只是笑一󠇡笑。", "驚喜、禮物可以保密；如果有人受傷、被欺負或有危險，一󠇡定要告訴大人。"], "judge": [["我答應幫妹妹準備驚喜，所以我守口如瓶，一󠇡個字也沒說。", true, "把秘密藏好沒有說出去，所以這句用得󠇡對。"], ["他一󠇢知道消息，馬上告訴全班同學，真是守口如瓶。", false, "馬上說出去，不󠇡是保守秘密，所以這句用錯了。"], ["不管大家怎麼問，哥哥󠇡都守口如瓶，不說出禮物是什麼。", true, "哥哥󠇡把秘密藏好，所以這句用得󠇡對。"]], "life": "爸爸準備送媽媽一󠇡束花，我守口如瓶，等到媽媽打開門的那一󠇡刻才大叫：「驚喜！」", "say": "你曾經為󠇡了驚喜守口如瓶嗎？說給家人聽。", "ch": {"q": "「口無遮攔」的意思󠇢是：說話不小心，什麼都說出去。它和󠇡「守口如瓶」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "守口如瓶是不把秘密說出去，口無遮攔是什麼都說出去，所以意思󠇢相󠇡反。"}}, {"id": "xzmx", "no": 17, "lab": "第九課", "idiom": "瞎子󠇡摸象", "story_title": "大象到底像什麼", "source": "典故出自佛經故事", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了古代印度的一󠇡座王宮。國王牽來一󠇢頭大象，請來六個眼睛看不󠇡見的人，笑著說：「你們摸一󠇢摸，告訴我大象長󠇡什麼樣子󠇡。」", "第一個人摸到大象的耳朵，說：「大象就像一󠇢把大扇子󠇡！」第二個人摸到大象的長鼻子󠇡，說：「不󠇡對，大象像一󠇢條彎彎的大水管！」第三個人抱住大象的腿，說：「你們都錯了，大象像一󠇢根粗粗的柱子󠇡！」", "第四個人摸到大象的牙，說：「大象像一󠇢根尖尖的長矛！」第五個人摸到大象的肚子󠇡，說：「大象像一󠇡面又大又硬的牆！」第六個人抓到大象的尾巴󠇡，說：「哈哈，大象明明像一󠇢條繩子󠇡！」", "小柚在本子󠇡上寫下：「線索一：每個人都只摸到大象的一󠇢小部分󠇡。」", "六個人開始吵架，每個人都覺得󠇡自己才是對的。「扇子󠇡！」「水管！」「柱子󠇡！」「繩子󠇡！」吵得󠇡好大聲，連大象都被吵得󠇡甩甩耳朵。", "小柚又寫下：「線索二：只知道一󠇢小部分󠇡，就以為󠇡自己知道全部。」", "國王笑著說：「你們說的都對，也都不󠇡對。大象有扇子󠇡一󠇡樣的耳朵、水管一󠇡樣的鼻子󠇡、柱子󠇡一󠇡樣的腿、繩子󠇡一󠇡樣的尾巴󠇡……要把大家摸到的合在一󠇢起，才是一󠇢頭完整的大象。」", "六個人聽了，你看我、我看你，都不好意思󠇢地󠇡笑了。他們手牽手，從頭到尾一󠇢起摸了一󠇡遍大象，這才真正知道大象的樣子󠇡。", "那天以後，六個人變成了好朋友。每次遇到新東西󠇡，他們都會一󠇢起摸一󠇢摸，再把每個人的發現說出來，合在一󠇢起想。國王看了很高興󠇡，說：「你們合作的樣子󠇡，比大象還了󠇡不起！」", "小柚想：「我們看事情，也常常只看到一󠇢小部分󠇡。多聽聽別人的發現，把大家的想法合起來，才會看得󠇡更清楚。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「後來，人們就用四個字，來說『只看到事情的一󠇢小部分󠇡，就以為󠇡自己知道全部』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "長矛：古代一󠇢種長長的、前面尖尖的武器。", "hints": ["故事裡的人眼睛看不󠇡見，古時候叫做「<b class=\"key\">瞎子󠇡</b>」。", "他們用手「<b class=\"key\">摸</b>」大「<b class=\"key\">象</b>」。", "把「<b class=\"key\">瞎子󠇡</b>」和󠇡「<b class=\"key\">摸象</b>」合起來。"], "parts": [["瞎子󠇡", "眼睛看不󠇡見的人（古時候的說法，現在要說「視障朋友」比較有禮貌）", ""], ["摸象", "只摸到大象的一󠇢小部分󠇡", ""]], "blank": ["每個人只摸到大象的＿＿＿＿，就以為󠇡知道＿＿＿＿。", ["一󠇢小部分󠇡", "全部"], ["全部", "一󠇢小部分󠇡"]], "literal": "看不󠇡見的人摸大象，只摸到一󠇡部分󠇡。", "meaning": "只看到事情的一󠇢小部分󠇡，就以為󠇡自己知道全部。", "more": "", "think": ["六個人為󠇡什麼會吵架？", "怎麼做才不󠇡會像瞎子󠇡摸象一󠇡樣？"], "think_ref": ["因為󠇡每個人只摸到一󠇡部分󠇡，都以為󠇡自己知道整頭大象的樣子󠇡。", "多聽聽不同人的說法、多看看不同地方，把大家的發現合起來再下結論。"], "judge": [["只聽一󠇡個人的說法，就認定誰對誰錯，就像瞎子󠇡摸象。", true, "只知道一󠇡部分󠇡就下結論，所以這句用得󠇡對。"], ["他把整本書從頭讀到尾，才寫心得，真是瞎子󠇡摸象。", false, "他看了全部內容，不󠇡是只知道一󠇡部分󠇡，所以這句用錯了。"], ["只看了一󠇢張照片就說整個城市很髒，真是瞎子󠇡摸象。", true, "只看到一󠇢小部分󠇡就說全部，所以這句用得󠇡對。"]], "life": "我只吃了一󠇢口青椒就說所有蔬菜都難吃，媽媽笑我是瞎子󠇡摸象。", "say": "你有沒有只看到一󠇡部分󠇡，就以為󠇡知道全部的經驗？", "ch": {"q": "「以偏概全」的意思󠇢是：用一󠇢小部分󠇡，來說全部都是這樣。它和󠇡「瞎子󠇡摸象」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 0, "why": "兩個成語都是只看到一󠇡部分󠇡就以為󠇡是全部，所以意思󠇢很像。"}}, {"id": "czdy", "no": 18, "lab": "第九課", "idiom": "粗枝大葉", "story_title": "糊塗兔的遠足", "source": "原創故事", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他來到了森林小學。明天要去遠足，老師發了一󠇢張清單：「帶水壺、帽子󠇡、雨衣、午餐盒，還有家長󠇡同意書。」", "小白兔看了一󠇢眼清單，就把它塞進口袋：「好啦好啦，我都記住了！」她蹦蹦跳跳地󠇡回家，晚上隨手抓了幾樣東西󠇡丟進書包，就去睡覺了。", "第二天，大家在學校門口集合。老師說：「請拿出同意書。」小白兔翻呀󠇡翻，書包裡只有水壺和󠇡一󠇢顆蘋果──同意書、帽子󠇡、雨衣和󠇡午餐盒都沒帶！", "小柚在本子󠇡上寫下：「線索一：小白兔做事不仔󠇡細，清單只看一󠇢眼就丟一󠇢邊。」", "老師只好打電話請兔媽媽送同意書過來，大家等了好久才出發。走到半路，太陽好大，大家都戴著帽子󠇡，只有小白兔曬得󠇡耳朵紅通通的。中午突然下起雨，大家穿上雨衣，小白兔只好躲到大樹下，渾身溼答答的。", "午餐時間到了，大家打開午餐盒，小白兔只有一󠇢顆蘋果。好朋友小松鼠分給她一󠇡半的三明治，小烏龜也分給她一󠇢些水果。小白兔吃著吃著，眼淚掉了下來：「都是我太粗心了……」", "小柚又寫下：「線索二：粗心大意，只看大概，不󠇡注意小地方，結果出了好多問題。」", "回家以後，小白兔做了一󠇡個「出門檢查表」，每帶好一󠇡樣，就打一󠇡個勾。下一󠇡次遠足，她一󠇡樣一󠇡樣檢查，背󠇡著整整齊齊的書包出門，老師還稱讚她：「進步好多喔！」", "小松鼠看了小白兔的檢查表，也學著做了一󠇢張。後來，全班都做了自己的檢查表，貼在書包上。老師笑著說：「小白兔的一󠇡次粗心，反而讓大家都學會了細心！」", "小柚點點頭：「做事情不能只看大概，要一󠇡樣一󠇡樣仔󠇡細檢查，才不󠇡會出錯。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『做事情粗心，不󠇡夠仔󠇡細』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "同意書：家長󠇡簽名，表示同意孩子󠇡參加活動的單子󠇡。", "hints": ["畫樹的時候，只畫「<b class=\"key\">粗</b>」粗的樹「<b class=\"key\">枝</b>」。", "還有「<b class=\"key\">大</b>」大的樹「<b class=\"key\">葉</b>」，小地方都沒畫，很不仔󠇡細。", "把「<b class=\"key\">粗枝</b>」和󠇡「<b class=\"key\">大葉</b>」合起來。"], "parts": [["粗枝", "粗大的樹枝", ""], ["大葉", "大大的葉子󠇡", ""]], "blank": ["只看＿＿＿＿的樹枝和󠇡大葉子󠇡，不󠇡注意＿＿＿＿的地方。", ["粗大", "細小"], ["細小", "粗大"]], "literal": "只看到粗粗的樹枝和󠇡大大的葉子󠇡，細小的地方都沒注意。", "meaning": "做事情粗心，不󠇡夠仔󠇡細。", "more": "", "think": ["小白兔遠足時遇到哪些麻煩？", "你有什麼方法可以讓自己不粗枝大葉？"], "think_ref": ["沒帶同意書、帽子󠇡、雨衣和󠇡午餐盒，大家等她，她被太陽曬、被雨淋，午餐也不󠇡夠吃。", "可以做檢查表、一󠇡樣一󠇡樣打勾，或請家人幫忙再看一󠇡次。"], "judge": [["他做事粗枝大葉，常常忘記帶作業。", true, "常常忘東忘西，表示做事粗心，所以這句用得󠇡對。"], ["姊姊󠇡寫功課時一󠇢題一󠇢題仔󠇡細檢查，真是粗枝大葉。", false, "仔󠇡細檢查是很細心，不󠇡是粗心，所以這句用錯了。"], ["因為󠇡粗枝大葉，弟弟󠇡把鹽當成糖加進果汁裡。", true, "沒看清楚就加，是粗心不仔󠇡細，所以這句用得󠇡對。"]], "life": "我粗枝大葉，把數學題目的加號看成減號，整題都算錯了。", "say": "你曾經因為󠇡粗枝大葉出過什麼錯？後來怎麼改？", "ch": {"q": "「一󠇢絲不苟」的意思󠇢是：連一󠇢根絲那麼小的地方都不馬虎，非常仔󠇡細。它和󠇡「粗枝大葉」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "粗枝大葉是粗心不仔󠇡細，一󠇢絲不苟是非常仔󠇡細，所以意思󠇢相󠇡反。"}}, {"id": "zxmd", "no": 19, "lab": "第十課", "idiom": "自相󠇡矛盾", "story_title": "最厲害的矛和󠇡盾", "source": "典故出自《韓非子》", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了古代楚國熱鬧的市場。賣菜的、賣布的、賣糖葫蘆的，大家都在大聲叫賣。", "有一󠇡個商人站在攤子󠇡前面，左手拿著一󠇢枝長長的矛，右手拿著一󠇡面圓圓的盾。矛是用來刺的武器，盾是用來擋的護具。", "商人先舉起盾，大聲說：「快來看喔！我的盾是全世界最堅固的，不管什麼東西󠇡都刺不穿它！」大家圍過來，敲一󠇢敲盾，真的好硬。", "接著，他又舉起矛，更大聲地󠇡說：「再來看喔！我的矛是全世界最鋒利的，不管什麼東西󠇡都刺得󠇡穿！」", "小柚在本子󠇡上寫下：「線索一：商人說，他的盾什麼都刺不穿；他的矛什麼都刺得󠇡穿。」", "這時候，一󠇡個小朋友舉手問：「那請問，如果用你的矛，去刺你的盾，會怎麼樣呢？」", "市場一󠇡下子󠇡安靜下來，大家都看著商人。商人張開嘴巴，又閉上嘴巴，臉漲得󠇡紅紅的，一󠇡句話也說不出來。如果矛刺穿了盾，盾就不󠇡是最堅固的；如果矛刺不穿，矛就不󠇡是最鋒利的。", "小柚又寫下：「線索二：自己說的兩句話，互相󠇡打架，不可能兩句都對。」", "大家哈哈大笑，紛紛走開了。商人抓抓頭，小聲地󠇡說：「下次我要說實話，不能為󠇡了賣東西󠇡亂說了。」", "第二天，那個商人換了一󠇢種說法：「我的盾很堅固，可以保護你；我的矛很鋒利，可以拿來練習。」他不󠇡再說「全世界最」，大家反而覺得󠇡他很誠實，生意也慢慢變好了。", "小柚想：「說話要前後一󠇡致，要是自己的話互相󠇡打架，別人就不󠇡會相󠇡信你了。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「後來，人們就用四個字，來說『自己說的話前後不一󠇡樣，讓人不知道哪一󠇡個才對』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "矛：長長的、前面尖尖的武器。盾：用來擋住攻擊的護具。", "hints": ["商人說的話，是「<b class=\"key\">自</b>」己和󠇡自己互「<b class=\"key\">相󠇡</b>」打架。", "他賣的兩樣東西󠇡，一󠇡個叫「<b class=\"key\">矛</b>」，一󠇡個叫「<b class=\"key\">盾</b>」。", "四個字是：自相󠇡□□。"], "parts": [["自相󠇡", "自己和󠇡自己", "相󠇡：互相󠇡"], ["矛盾", "矛和󠇡盾，比喻前後說法對不起來", "矛：刺人的武器；盾：擋住攻擊的護具"]], "blank": ["自己說的話，＿＿＿＿說法不一󠇡樣，不可能＿＿＿＿都對。", ["前後", "兩句"], ["每天", "一󠇡句"]], "literal": "自己的矛和󠇡自己的盾互相󠇡打架。", "meaning": "自己說的話前後不一󠇡樣，讓人不知道哪一󠇡個才對。", "more": "", "think": ["小朋友的問題，為󠇡什麼讓商人說不出話？", "你聽過自相󠇡矛盾的話嗎？舉一󠇡個例子󠇡。"], "think_ref": ["因為󠇡不管矛刺不󠇡刺得󠇡穿盾，他說的兩句話裡一󠇡定有一󠇡句是錯的。", "例如：「我最討厭吃青菜，最喜歡吃的是空心菜。」空心菜也是青菜，前後說不通。"], "judge": [["他說自己從來不說謊，又說昨天騙了媽媽，真是自相󠇡矛盾。", true, "前後兩句話對不起來，所以這句用得󠇡對。"], ["哥哥󠇡說今天要寫功課，回家後就認真寫完了，真是自相󠇡矛盾。", false, "說的和󠇡做的一󠇡樣，沒有互相󠇡打架，所以這句用錯了。"], ["弟弟󠇡說他不󠇡怕黑，卻一󠇢關燈就大叫，說的和󠇡做的自相󠇡矛盾。", true, "他說的話和󠇡表現對不起來，所以這句用得󠇡對。"]], "life": "妹妹說她最不喜歡甜食，卻一󠇢口氣吃了三塊巧克力蛋糕，大家都笑她自相󠇡矛盾。", "say": "怎麼說話才不󠇡會自相󠇡矛盾？說說你的想法。", "ch": {"q": "「言行一󠇡致」的意思󠇢是：說的話和󠇡做的事一󠇡樣。它和󠇡「自相󠇡矛盾」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "自相󠇡矛盾是前後對不起來，言行一󠇡致是說到做到，所以意思󠇢相󠇡反。"}}, {"id": "ctdf", "no": 20, "lab": "第十課", "idiom": "粗茶淡飯", "story_title": "國王想要的好味道", "source": "原創故事（成語出自宋朝的詩）", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他來到了一󠇡座金光閃閃的王宮。國王每天吃的都是山珍海味：烤全雞、大龍蝦、十層的奶油蛋糕……可是他卻愁眉苦臉。", "「唉，每一󠇡道菜都好膩，我一󠇢點胃口都沒有。」國王摸著圓圓的肚子󠇡，還常常肚子󠇡痛、睡不好覺。御醫說：「大王，您要多吃清淡的東西󠇡才行。」國王卻皺眉頭：「清淡的東西󠇡哪有好吃的？」", "有一󠇢天，國王穿上普通的衣服，偷偷溜出王宮散步。他走呀󠇡走，走進了山腳下的一󠇢間小木屋。屋裡的老爺爺󠇡正在吃午飯，熱情地󠇡說：「客人，一󠇢起吃吧！」", "桌上只有一󠇢壺普通的茶、一󠇢碗白米飯、一󠇢盤炒青菜和󠇡一󠇢碗豆腐湯。小柚在本子󠇡上寫下：「線索一：老爺爺󠇡吃的是普通的茶，和󠇡簡單的飯菜。」", "國王餓壞了，大口吃了起來。咦？白飯香香的，青菜甜甜的，豆腐湯暖暖的，喝一󠇢口茶，嘴巴好舒服！他一󠇢連吃了三碗飯，笑著說：「這是我吃過最好吃的一󠇢餐！」", "老爺爺󠇡說：「這些菜都是我自己種󠇡的，沒有加很多油、很多鹽，吃起來清清淡淡，身體才會健康。」國王發現，老爺爺󠇡雖然年紀很大，卻每天精神好、走路很快。", "小柚又寫下：「線索二：簡單、清淡的食物，也可以吃得󠇡很開心、很健康。」", "回到王宮以後，國王請廚師每天做清淡的飯菜，少油、少鹽、多吃青菜。過了幾個月，國王的肚子󠇡不󠇡痛了，晚上也睡得󠇡好香。他還把多出來的大餐分給窮苦的人。", "從此以後，國王常常換上普通的衣服，去小木屋找老爺爺󠇡喝茶聊天。他們一󠇢起在菜園裡種󠇡菜、澆水，國王學會了自己種󠇡青菜，還說：「自己種󠇡的菜，吃起來最香！」", "小柚想：「好吃的東西󠇡不一󠇡定要很貴，簡單的飯菜也有幸福的味道。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『簡單、清淡的食物』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "山珍海味：山上和󠇡海裡珍貴好吃的東西󠇡。御醫：在王宮裡幫國王看病的醫生。", "hints": ["老爺爺󠇡喝的是普通的「<b class=\"key\">茶</b>」，「<b class=\"key\">粗</b>」在這裡是普通、不精緻的意思󠇢。", "他吃的是清「<b class=\"key\">淡</b>」的「<b class=\"key\">飯</b>」菜。", "把「<b class=\"key\">粗茶</b>」和󠇡「<b class=\"key\">淡飯</b>」合起來。"], "parts": [["粗茶", "普通的茶", "粗：普通、不精緻"], ["淡飯", "簡單、清淡的飯菜", "淡：味道不󠇡重"]], "blank": ["＿＿＿＿的茶，清＿＿＿＿的飯菜。", ["普通", "淡"], ["很貴", "辣"]], "literal": "普通的茶，清淡的飯。", "meaning": "簡單、清淡的食物。也可以形容生活簡單樸素。", "more": "", "think": ["國王為󠇡什麼在小木屋吃得󠇡特別開心？", "你覺得󠇡吃粗茶淡飯有什麼好處󠇡？"], "think_ref": ["因為󠇡他肚子󠇡很餓，而且簡單清淡的飯菜吃起來很舒服，不油膩。", "比較健康、不󠇡會給身體太多負擔，也讓人學會珍惜簡單的生活。"], "judge": [["爺爺󠇡每天吃粗茶淡飯，身體很健康。", true, "簡單清淡的食物，所以這句用得󠇡對。"], ["今天我們去吃十道菜的大餐，有龍蝦和󠇡牛排，真是粗茶淡飯。", false, "龍蝦和󠇡牛排是豐盛󠇡的大餐，不󠇡是簡單清淡的食物，所以這句用錯了。"], ["露營的晚上只有白飯和󠇡青菜湯，這樣的粗茶淡飯也很好吃。", true, "白飯和󠇡青菜湯是簡單的食物，所以這句用得󠇡對。"]], "life": "奶奶󠇡說：「粗茶淡飯，吃得󠇡健康最重要。」她每天都煮清淡的青菜和󠇡湯給我們吃。", "say": "你最喜歡家裡的哪一󠇡道簡單的菜？為󠇡什麼？", "ch": {"q": "「山珍海味」的意思󠇢是：山上和󠇡海裡珍貴好吃的東西󠇡，形容很豐盛󠇡的大餐。它和󠇡「粗茶淡飯」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "粗茶淡飯是簡單的食物，山珍海味是豐盛󠇡的大餐，所以意思󠇢相󠇡反。"}}, {"id": "qzbs", "no": 21, "lab": "第十一課", "idiom": "七嘴八舌", "story_title": "班會吵翻天", "source": "原創故事", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了二年三班的教室。今天的班會要決定一󠇡件大事：校慶園遊會，我們班要賣什麼？", "班長󠇡才說完「請大家發表意見」，全班就一󠇢起說話了。小胖說：「賣炸雞！」小美說：「不󠇡要，賣手工書籤！」阿宏說：「我們來辦釣魚遊戲！」後面的同學喊：「賣冰淇淋啦！」", "大家你一󠇡句、我一󠇡句，越說越大聲。教室裡吵得󠇡像菜市場，班長󠇡站在台上揮手，可是根本沒有人聽見他在說什麼。", "小柚坐在窗邊，摀著耳朵寫下：「線索一：很多人一󠇢起說話，好多張嘴巴同時在講。」", "這時候，老師敲了敲桌子󠇡，大家才慢慢安靜下來。老師笑著說：「大家的想法都很好，可是一󠇢起說，誰也聽不󠇡到誰。我們換個方法吧！」", "老師請每個人把想法寫在小紙條上，貼到黑板。結果黑板上貼滿了紙條：炸雞、書籤、釣魚遊戲、冰淇淋、手做餅乾󠇡、套圈圈……每個人的想法都不一󠇡樣。", "小柚又寫下：「線索二：每個人都有自己的說法，大家搶著發表意見。」", "接著，大家輪流舉手說明理由，再一󠇢起投票。最後決定辦「釣魚遊戲」，還要用小美的手工書籤當獎品，炸雞就留到慶功宴再吃。大家都很滿意，拍手歡呼。", "園遊會那天，二年三班的攤位前排了好長的隊伍。大家分工合作，有人負責收錢，有人負責教客人釣魚，還有人負責發書籤。班長󠇡笑著說：「好好討論以後，大家合作起來真順利！」", "小柚點點頭：「大家都有想法很棒，可是要輪流說、好好聽，才能討論出結果。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『很多人一󠇢起說話，每個人都有自己的想法』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "園遊會：大家擺攤賣東西󠇡、玩遊戲的活動。", "hints": ["好多張「<b class=\"key\">嘴</b>」巴一󠇢起說話，「<b class=\"key\">七</b>」表示很多。", "好多條舌頭動個不停，「<b class=\"key\">八</b>」也表示很多，「<b class=\"key\">舌</b>」就是舌頭。", "四個字裡有兩個數字：七和󠇡八。"], "parts": [["七嘴", "很多人一󠇢起說話", "七：表示很多"], ["八舌", "每個人都有自己的說法", "八：表示很多；舌：舌頭"]], "blank": ["＿＿＿＿人一󠇢起說話，每個人都有＿＿＿＿的想法。", ["很多", "自己"], ["一󠇡個", "一󠇡樣"]], "literal": "七張嘴巴、八條舌頭一󠇢起說話。", "meaning": "很多人一󠇢起說話，每個人都有自己的想法。", "more": "", "think": ["班會一󠇢開始為󠇡什麼討論不出結果？", "大家七嘴八舌的時候，怎麼做才能好好討論？"], "think_ref": ["因為󠇡大家同時說話，誰也聽不󠇡到誰，班長󠇡也沒辦法整理大家的想法。", "可以舉手輪流發言、把想法寫下來、仔󠇡細聽別人說，最後再投票。"], "judge": [["老師一󠇢公布要去校外教學，大家就七嘴八舌地󠇡討論要帶什麼。", true, "很多人一󠇢起說話，所以這句用得󠇡對。"], ["圖書館裡大家都安安靜靜地󠇡看書，七嘴八舌。", false, "安安靜靜沒有人說話，所以這句用錯了。"], ["看到天上的彩虹，同學們七嘴八舌地󠇡說自己看到幾種顏色。", true, "大家一󠇢起說自己的想法，所以這句用得󠇡對。"]], "life": "晚餐時大家七嘴八舌地󠇡討論暑假󠇡要去哪裡玩，有人說海邊，有人說山上。", "say": "你們家什麼時候會七嘴八舌？說說看那時候的情形。", "ch": {"q": "「鴉雀無聲」的意思󠇢是：連烏鴉和󠇡麻雀的聲音都沒有，形容非常安靜。它和󠇡「七嘴八舌」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "七嘴八舌是很多人一󠇢起說話，鴉雀無聲是非常安靜，所以意思󠇢相󠇡反。"}}, {"id": "jsct", "no": 22, "lab": "第十一課", "idiom": "聚沙成塔", "story_title": "海邊的沙塔比賽", "source": "原創故事（成語出自佛經）", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他來到了一󠇡片金色的沙灘。今天這裡要舉辦「沙塔比賽」，誰堆的沙塔最高，就可以得到冠軍。", "參加比賽的小螃蟹看看自己的小鉗子󠇡，嘆了一󠇢口氣：「我這麼小，一󠇡次只能夾起幾粒沙子󠇡，怎麼可能堆出高高的塔呢？」旁邊的大海龜一󠇢推就是一󠇡大堆沙，海鷗也用翅膀一󠇢掃就是一󠇡大片。", "小螃蟹想了想：「沒關係，我就一󠇢點一󠇢點地󠇡堆吧！」他用小鉗子󠇡夾起沙子󠇡，放好，壓緊；再夾起沙子󠇡，放好，壓緊……一󠇡次、兩次、一󠇢百次。", "小柚蹲在旁邊看，在本子󠇡上寫下：「線索一：小螃蟹每次只搬一󠇢點點沙子󠇡，可是一󠇢直沒有停下來。」", "大海龜堆得󠇡很快，可是沙子󠇡堆得󠇡鬆鬆的，一󠇡陣海風吹來，嘩󠇡啦一󠇢聲，他的沙塔就倒󠇡了一󠇡半。海鷗堆到一󠇡半覺得󠇡無聊，跑去抓魚了。", "太陽慢慢往西邊移動，小螃蟹還在努力。一󠇡粒、兩粒、一󠇢千粒、一󠇡萬粒……他的沙塔一󠇢層一󠇢層地󠇡長󠇡高，到了傍晚，竟然比大家都高，上面還做了一󠇡扇小小的窗戶！", "小柚又寫下：「線索二：一󠇢點一󠇢點聚起來的沙子󠇡，最後變成了一󠇡座高高的塔。」", "評審宣布小螃蟹得到冠軍。大海龜驚訝地󠇡問：「你那麼小，怎麼做到的？」小螃蟹不好意思󠇢地󠇡說：「我只是每次都多堆一󠇢點點，從來沒有放棄。」大家都為󠇡他拍手。", "後來，小螃蟹把堆沙塔的方法教給其他小動物。大家每天一󠇢起堆一󠇢點點，到了夏天結束的時候，沙灘上出現了一󠇡座好大好大的沙城堡，有塔、有橋，還有一󠇢條小小的護城河。", "小柚想：「每天讀一󠇢點書、存一󠇢點錢、練習一󠇢點點，慢慢累積，也能完成很大的事情。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『一󠇢點一󠇢點累積，最後就能完成很多事情』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "", "hints": ["小螃蟹把一󠇡粒一󠇡粒的「<b class=\"key\">沙</b>」子󠇡「<b class=\"key\">聚</b>」在一󠇢起。", "最後變「<b class=\"key\">成</b>」了一󠇡座高高的「<b class=\"key\">塔</b>」。", "把「<b class=\"key\">聚沙</b>」和󠇡「<b class=\"key\">成塔</b>」合起來。"], "parts": [["聚沙", "把一󠇢點點沙子󠇡聚在一󠇢起", "聚：集合在一󠇢起"], ["成塔", "慢慢堆成一󠇡座塔", "成：變成"]], "blank": ["一󠇢點一󠇢點把＿＿＿＿聚起來，最後變成一󠇡座＿＿＿＿。", ["沙子󠇡", "塔"], ["石頭󠇡", "洞"]], "literal": "把沙子󠇡聚起來，堆成一󠇡座塔。", "meaning": "一󠇢點一󠇢點累積，最後就能完成很多事情。", "more": "", "think": ["小螃蟹為󠇡什麼能贏過大海龜？", "你想用聚沙成塔的方法完成什麼事？"], "think_ref": ["因為󠇡他一󠇢點一󠇢點仔󠇡細堆、壓緊，而且一󠇢直沒有放棄；大海龜堆得󠇡太快太鬆，海鷗半途而廢。", "例如：每天讀十分鐘書、每天存五元、每天練習一󠇢首曲子󠇡。"], "judge": [["我每天存五元，聚沙成塔，終於買到想要的故事書。", true, "一󠇢點一󠇢點存，最後完成目標，所以這句用得󠇡對。"], ["他一󠇡次就把整盒餅乾󠇡吃光了，真是聚沙成塔。", false, "一󠇡次吃光不󠇡是一󠇢點一󠇢點累積，所以這句用錯了。"], ["每天背一󠇡個英文單字，聚沙成塔，一󠇢年就記住三百多個。", true, "每天累積一󠇢點，最後變很多，所以這句用得󠇡對。"]], "life": "每天讀一󠇢點書，也能聚沙成塔，一󠇡個學期下來，我讀完了二十本橋樑書。", "say": "你有沒有用聚沙成塔的方法完成過什麼事？", "ch": {"q": "「積少成多」的意思󠇢是：少少的東西󠇡累積起來，就會變多。它和󠇡「聚沙成塔」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 0, "why": "兩個成語都在說一󠇢點一󠇢點累積，最後變很多，所以意思󠇢很像。"}}, {"id": "hxgw", "no": 23, "lab": "第十二課", "idiom": "歡欣鼓舞", "story_title": "下雨了！", "source": "原創故事（成語出自宋朝的文章）", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了一󠇡個很久沒有下雨的村子󠇡。田裡的土裂開了，稻子󠇡垂著頭，小河也乾󠇡得󠇡只剩下石頭󠇡。", "村民們每天看著天空，皺著眉頭說：「再不󠇡下雨，今年就沒有米可以吃了。」小朋友們也不能在河邊玩水，只能坐在樹下發呆。", "這天下午，天空忽然變暗了，一󠇢朵一󠇢朵的烏雲飄過來。「轟隆隆！」打雷了！接著，豆大的雨點「滴答󠇡、滴答󠇡」地󠇡落下來，越下越大。", "小柚躲在屋簷下，看見大家都跑出來了！他寫下：「線索一：大家非常開心、非常快樂。」", "老爺爺󠇡張開雙手，讓雨打在臉上，笑得󠇡合不攏嘴；小朋友在雨裡跳來跳去，踩著水坑；媽媽們拿出鍋子󠇡、臉盆接雨水，還一󠇢邊唱歌。有人拿出大鼓，咚咚咚地󠇡敲了起來，大家跟著鼓聲手舞足蹈。", "小柚又寫下：「線索二：大家開心得󠇡敲起鼓、跳起舞，好有精神！」", "雨下了一󠇢整個晚上。第二天早上，太陽出來了，稻子󠇡抬起了頭，小河又嘩󠇡啦啦地󠇡流了起來，田裡一󠇡片綠油油。村長󠇡說：「今年的稻子󠇡一󠇡定會長󠇡得󠇡很好！」大家又高興󠇡地󠇡歡呼起來。", "那年秋天，村子󠇡裡的稻子󠇡大豐收，金黃色的稻穗沉甸甸的。村民們辦了一󠇢場熱鬧的慶祝會，還特別請了大家都很喜歡的老鼓手，敲出最響亮的鼓聲。", "慶祝會上，小朋友們把自己畫的雨滴和󠇡稻子󠇡貼滿了村子󠇡的牆壁。村長󠇡說：「我們要好好珍惜每一󠇢滴雨水。」大家一󠇢起挖了一󠇡個大水池，下雨的時候把雨水存起來，以後就不󠇡怕不󠇡下雨了。", "小柚想：「等了好久終於實現的事，最讓人開心！大家一󠇢起慶祝，快樂就變成好幾倍。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「有一󠇡句成語，用四個字來說『非常開心、興󠇡奮』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "手舞足蹈：開心得󠇡手和󠇡腳都跳起舞來。沉甸甸：很重的樣子󠇡。", "hints": ["大家非常「<b class=\"key\">歡</b>」喜、「<b class=\"key\">欣</b>」喜，就是開心。", "有人敲起大「<b class=\"key\">鼓</b>」，大家跳起「<b class=\"key\">舞</b>」來。", "把「<b class=\"key\">歡欣</b>」和󠇡「<b class=\"key\">鼓舞</b>」合起來。"], "parts": [["歡欣", "開心、快樂", "歡、欣：都是高興󠇡"], ["鼓舞", "開心得󠇡敲鼓跳舞，讓人更有精神、更興󠇡奮", ""]], "blank": ["大家非常＿＿＿＿，開心得󠇡敲鼓＿＿＿＿。", ["快樂", "跳舞"], ["難過", "睡覺"]], "literal": "很開心，開心得󠇡敲鼓跳舞。", "meaning": "非常開心、興󠇡奮。", "more": "", "think": ["村民們為󠇡什麼那麼歡欣鼓舞？", "什麼事情會讓你歡欣鼓舞？"], "think_ref": ["因為󠇡很久沒有下雨，田和󠇡小河都乾󠇡了，終於下雨，稻子󠇡有救了。", "例如：比賽得到第一名、放暑假󠇡、收到期待很久的禮物。"], "judge": [["我們班得到大隊接力第一名，大家歡欣鼓舞。", true, "大家非常開心，所以這句用得󠇡對。"], ["小狗走丟了，全家人歡欣鼓舞。", false, "小狗走丟大家會很著󠇣急難過，不󠇡會很開心，所以這句用錯了。"], ["聽到明天放颱風假󠇡，弟弟󠇡歡欣鼓舞地󠇡跳了起來。", true, "弟弟󠇡非常開心興󠇡奮，所以這句用得󠇡對。"]], "life": "聽說動物園來了一󠇢隻小熊貓寶寶，全班歡欣鼓舞，等不及要去看牠。", "say": "說一󠇡件讓你歡欣鼓舞的事。", "ch": {"q": "「垂頭喪󠇡氣」的意思󠇢是：低著頭，很失望、沒精神。它和󠇡「歡欣鼓舞」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 1, "why": "歡欣鼓舞是非常開心，垂頭喪󠇡氣是很失望，所以意思󠇢相󠇡反。"}}, {"id": "bfbz", "no": 24, "lab": "第十二課", "idiom": "百發百中󠇡", "story_title": "神射手養由基", "source": "典故出自《戰國策》", "story": ["小偵探小柚翻開時光故事書，金光一󠇢閃，他來到了古代楚國的練箭場。很多人圍成一󠇢圈，原來是有名的神射手養由基要表演射箭。", "有人在一󠇢百步外的柳樹上，選了一󠇡片小小的柳葉，用紅筆點上一󠇡個記號。那片葉子󠇡遠遠看去，只有一󠇢顆米那麼小，還在風裡輕輕搖晃󠇡。", "養由基拉開弓，瞇起一󠇢隻眼睛，「咻──」一󠇢聲，箭飛了出去，正好射穿那片柳葉的紅點！大家還沒來得󠇡及拍手，他又連射了好幾箭，每一󠇡箭都射中󠇡大家指定的葉子󠇡。", "小柚張大嘴巴，在本子󠇡上寫下：「線索一：他射了好多次，每一󠇡次都射出去了。」", "大家拍手叫好，有人說：「射了一󠇢百次，就中󠇡了一󠇢百次！」小柚跟著數，真的一󠇡箭都沒有落空。", "小柚又寫下：「線索二：每一󠇡次都打中󠇡目標，一󠇡次都沒有失手。」", "小柚好󠇡奇地󠇡跑去問養由基：「你怎麼這麼厲害？」養由基笑著說：「我小時候每天天一󠇡亮就練習，手痠了也不停。我還會盯著一󠇢根細細的頭髮看，看到它好像變得󠇡跟繩子󠇡一󠇡樣大，才開始射。」", "這時候，一󠇡位老人走過來提醒他：「你的箭術雖然好，可是如果累了還一󠇢直射，萬一󠇢有一󠇡箭沒射中󠇡，大家對你的稱讚就沒了。要懂得󠇡休息喔！」養由基點點頭，謝謝老人的提醒。", "從那天起，養由基每天練箭以後，都會好好休息，也常常教年輕人射箭。他告訴大家：「沒有人一󠇢開始就百發百中󠇡，只要每天練習，你們也可以越來越厲害。」", "小柚想：「厲害的本領，是每天練習一󠇢點一󠇢點累積出來的。而且，就算很厲害，也要謙虛、會休息。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「後來，人們就用四個字，來說『每一󠇡次都能打中󠇡目標，表示技術很好』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "一󠇢百步：大約是七十公尺那麼遠。", "hints": ["他射了一「<b class=\"key\">百</b>」次，每次都「<b class=\"key\">發</b>」射出去。", "一󠇢百次都射「<b class=\"key\">中󠇡</b>」了。", "四個字裡有兩個「<b class=\"key\">百</b>」。"], "parts": [["百發", "每一󠇡次都射出去", "百：表示很多次；發：射出"], ["百中󠇡", "每一󠇡次都打中󠇡目標", "中：打中󠇡"]], "blank": ["射了一󠇢百次，一󠇢百次都打＿＿＿＿，表示技術很＿＿＿＿。", ["中", "好"], ["歪", "差"]], "literal": "射一󠇢百次，中󠇡一󠇢百次。", "meaning": "每一󠇡次都能打中󠇡目標，表示技術很好。", "more": "", "think": ["養由基的好本領是怎麼練出來的？", "你想在哪一󠇡件事上練到百發百中󠇡？要怎麼練？"], "think_ref": ["他從小每天練習，手痠也不停，還專心練眼力。", "例如：投籃、跳繩、寫字，可以每天固定練習一󠇡段時間。"], "judge": [["哥哥󠇡練了一󠇡個暑假󠇡的投籃，現在罰球百發百中󠇡。", true, "每次都投進，技術很好，所以這句用得󠇡對。"], ["他丟了十次球，只有一󠇡次進框，真是百發百中󠇡。", false, "十次只中󠇡一󠇡次，不󠇡是每次都中󠇡，所以這句用錯了。"], ["爺爺󠇡猜謎語百發百中󠇡，每一󠇢題都猜對。", true, "每一󠇡次都猜對，所以這句用得󠇡對。"]], "life": "弟弟󠇡每天練習投籃，希望自己能百發百中󠇡，成為󠇡籃球隊的神射手。", "say": "你有沒有一󠇡件事做得󠇡百發百中󠇡？是怎麼練習的？", "ch": {"q": "「百步穿楊」的意思󠇢是：在一󠇢百步遠的地方，射穿楊柳的葉子󠇡，形容射箭的技術非常好。它和󠇡「百發百中󠇡」的意思󠇢是？", "opts": ["很像", "相󠇡反"], "ans": 0, "why": "兩個成語都在形容技術很好、每次都打中󠇡，所以意思󠇢很像。這兩個成語都來自養由基的故事喔！"}}, {"id": "szdt", "no": 25, "lab": "加碼", "idiom": "守株待兔", "story_title": "種󠇡田人和󠇡樹樁", "source": "典故出自《韓非子》", "story": ["小偵探小柚翻開爺爺󠇡送他的「時光故事書」，書頁忽然發出金色的光。眼前一󠇡亮，他就來到了很久很久以前的宋國。小柚躲在田邊的大樹後面，拿出線索小本子󠇡，準備好好觀察。", "田裡有一󠇡個農夫，正彎著腰除草，滿頭大汗。太陽好大，他一󠇢邊擦汗，一󠇢邊小聲抱怨：「每天種󠇡田，又熱又累，什麼時候才能輕鬆一󠇢點呢？」", "忽然，草叢裡「咻～」的一󠇢聲，一󠇢隻兔子󠇡衝了出來，跑得󠇡好快好快！「碰！」兔子󠇡一󠇢頭撞上田邊的樹樁，倒󠇡在地上，再也不󠇡動了。", "農夫跑過去撿起兔子󠇡，開心得󠇡不得了󠇡：「哇！不󠇡用追、不󠇡用抓，兔子󠇡自己送上門來了！今天晚上有兔肉可以吃囉󠇢！」", "小柚在本子󠇡上寫下：「線索一：兔子󠇡是自己撞上來的，這是運氣。」", "第二天，農夫心想：「種󠇡田好累喔！要是每天都有兔子󠇡來撞樹樁，我就不󠇡用工作了。」於是，他把鋤頭󠇡丟在一󠇢旁，坐在樹樁旁邊，眼睛盯著樹樁，一󠇢直等、一󠇢直等……", "隔壁的老伯伯󠇡走過來說：「你怎麼不󠇡種󠇡田呢？草都長󠇡出來了。」農夫搖搖頭說：「我在等兔子󠇡，等到了就有肉吃，比種󠇡田輕鬆多了！」老伯伯󠇡嘆了一󠇢口氣，搖著頭走開了。", "小柚皺起眉頭，又寫下：「線索二：農夫不󠇡種󠇡田了，一󠇢直守在樹樁旁邊。」", "一󠇢天過去了，沒有兔子󠇡。十天過去了，還是沒有兔子󠇡。田裡的雜草越長󠇡越高，把稻子󠇡都蓋住了。秋天到了，別人家的稻子󠇡金黃黃的，農夫的田裡卻只有雜草。農夫一󠇢隻兔子󠇡也沒等到，田也荒廢了，村子󠇡裡的人都笑他好傻。", "小柚想起爺爺󠇡說過的話：「天上不󠇡會掉下禮物，田裡長󠇡出的稻子󠇡，是一󠇢滴一󠇢滴汗水換來的。」他看著荒廢的田，心裡有點難過，真希望農夫能早一󠇢點明白。", "小柚闔上本子󠇡，小聲地󠇡說：「好運氣不󠇡會天天掉下來呀󠇡！想要有收穫，還是要自己努力。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「後來，人們就用四個字，來說這種『不想努力，只想等好運氣自己掉下來』的人。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "樹樁：樹被砍掉以後，留在地上的那一󠇢截。", "hints": ["故事裡，農夫一󠇢直「<b class=\"key\">守</b>」在一󠇡個地方，不肯離開。", "他守在哪裡？古時候把「<b class=\"key\">樹樁</b>」叫做「<b class=\"key\">株</b>」。", "他在「<b class=\"key\">等待</b>」哪一󠇢種動物？把四個字連起來看看！"], "parts": [["守株", "守在樹樁旁邊不離開", "守：守在旁邊；株：樹樁"], ["待兔", "等待兔子󠇡來", "待：等待"]], "blank": ["守在＿＿＿＿旁邊，等＿＿＿＿自己撞上來。", ["樹樁", "兔子󠇡"], ["老虎", "石頭󠇡"]], "literal": "守在樹樁旁邊，等兔子󠇡自己撞上來。", "meaning": "不想努力，只想等好運氣自己來。", "more": "也可以用來說一󠇡個人只會用老方法，不知道要改變。", "think": ["農夫第一次撿到兔子󠇡，是因為󠇡很努力，還是因為󠇡運氣好？", "農夫做錯了什麼？如果你是他的好朋友，你會怎麼勸他？"], "think_ref": ["運氣好。兔子󠇡是自己撞上來的，不󠇡是農夫抓到的。", "他把一󠇡次的好運，當成每天都會有，結果不󠇡去種󠇡田。可以勸他：好運不󠇡會天天來，還是要好好種󠇡田。"], "judge": [["弟弟󠇡不󠇡練習寫字，只希望考試的題目剛好都會寫，這就像守株待兔。", true, "弟弟󠇡不想努力，只想等好運，所以這句用得󠇡對。"], ["姊姊󠇡每天練琴，終於在比賽得到第一名，真是守株待兔。", false, "姊姊󠇡是努力練習才得獎，不󠇡是等好運，所以這句用錯了。"], ["小華在公園撿到十元以後，每天都去同一個地方等著撿錢，真像守株待兔。", true, "小華一󠇢直等同樣的好運再發生，就像農夫等兔子󠇡。"]], "life": "哥哥󠇡想買新球鞋，卻不肯存零用錢，每天只等著別人送他，這樣守株待兔，是等不󠇡到的。", "say": "想要得到一󠇡樣東西󠇡，用什麼方法，才不󠇡會變成守株待兔？", "ch": {"q": "哪一󠇡個成語的意思󠇢，和󠇡「守株待兔」剛好相󠇡反？", "opts": ["一󠇢舉兩得", "腳踏實地󠇡"], "ans": 1, "why": "腳踏實地󠇡：腳穩穩踩在地上，比喻做事一󠇡步一󠇡步、很實在。農夫只想等好運，和󠇡腳踏實地󠇡剛好相󠇡反。"}}, {"id": "yjld", "no": 26, "lab": "加碼", "idiom": "一󠇢舉兩得", "story_title": "卞莊子打老虎", "source": "典故出自《史記》卞莊子刺虎的故事", "story": ["小偵探小柚翻開時光故事書，書頁發出金色的光。這一󠇡次，他來到了古代的一󠇡個小村子󠇡。村子󠇡旁邊有一󠇡座高高的山，山上常常傳來可怕的吼叫聲。", "村子󠇡裡有一󠇡個力氣很大、又很勇敢的人，名叫卞莊子。這天，村民慌慌張張地󠇡跑來說：「不好了！山上有兩隻老虎，正在搶一󠇢頭牛！要是老虎吃完牛，說不󠇡定會跑下山來！」", "卞莊子拿起寶劍，馬上就要衝上山。旁邊一󠇡個小男孩拉住他：「等一󠇢等！」", "「為󠇡什麼要等？」卞莊子問。", "小男孩說：「兩隻老虎都想吃那頭牛，一󠇡定會打起來。打完以後，小老虎會被咬死，大老虎也會受傷。到時候，你只要對付一󠇢隻受傷的老虎就好了。」", "躲在旁邊的小柚，趕快在本子󠇡上寫下：「線索一：先不󠇡要急，等老虎自己打起來。」", "卞莊子想一󠇢想：「有道理！一󠇡次對付兩隻生氣的老虎，太危險了。」他就躲在大石頭󠇡後面，靜靜地󠇡等著。", "果然，兩隻老虎為󠇡了搶牛，你咬我、我抓你，打得󠇡好激烈。吼叫聲一󠇡陣比一󠇡陣大，連樹上的鳥都嚇得󠇡飛走了。最後，小老虎被咬死了，大老虎也受了重傷，趴在地上喘氣。", "卞莊子跳出來，只出手一󠇡次，就打敗了大老虎。村民都拍手說：「哇！只出手一󠇡次，就得到兩隻老虎！村子󠇡安全了！」大家還送了好多好吃的東西󠇡謝謝他。", "那個小男孩後來成了卞莊子的好幫手。每次遇到難題，卞莊子都會先問他：「你覺得󠇡怎麼做最好？」兩個人一󠇢起想辦法，村子󠇡越來越平安。", "小柚眼睛一󠇡亮，寫下：「線索二：只做一󠇡次動作，卻得到兩個收穫。」他心想：「這個小男孩好聰明喔！遇到事情先想一󠇢想，常常能找到更好的辦法。」", "時光故事書又亮了起來，把小柚帶回家。書的最後一󠇡頁寫著：「後來，人們就用四個字，來說『做一󠇡件事，同時得到兩種好處󠇡』。」", "小偵探，你推理出來了嗎？是哪四個字呢？"], "note": "卞莊子：古代一󠇡位很勇敢的人。", "hints": ["卞莊子出手了幾次？答案是第一個字。", "「<b class=\"key\">出手</b>」就是  '<section class="card"><h2><span class="no">6</span>'+ic('target')+UI.s6+'</h2>'+
  d.judge.map((j,k)=>'<div class="jd"><p class="q">'+(k+1)+'. '+j[0]+'</p><div class="row"><button class="yes" data-j="'+k+'" data-v="1" aria-pressed="false"><span class="sym">○</span>'+UI.right+'</button><button class="nope" data-j="'+k+'" data-v="0" aria-pressed="false"><span class="sym">✕</span>'+UI.wrong+'</button></div><p class="fb" id="f'+k+'" hidden></p></div>').join('')+'</section>'+
 '<section class="card"><h2><span class="no">7</span>'+ic('house')+UI.s7+'</h2><img class="pic" src="img/'+id+'-life.jpg" alt="">'+
  '<p class="q">'+d.life+'</p><div class="row"><button data-play="'+id+'-life" data-kind="life">'+ic('speaker')+UI.listen+'</button></div>'+
  '<p class="q">'+UI.say+d.say+'</p></section>'+
 '<section class="card"><h2><span class="no">8</span>'+ic('trophy')+UI.s8+'</h2><p class="q">'+d.ch.q+'</p>'+
  '<div class="row">'+d.ch.opts.map((o,k)=>'<button data-ch="'+k+'" aria-pressed="false">'+o+'</button>').join('')+'</div><p class="fb" id="chf" hidden></p></section>'+
 '<section class="card done" id="done" hidden><p>'+ic('party')+UI.got+'「'+d.idiom+'」</p><p style="font-size:1rem">'+ic('fish')+UI.got_tk+'</p><div class="row" style="justify-content:center"><button id="bGoBook">'+ic('cards')+UI.see_book+'</button>'+(st.i<DATA.length-1?'<button id="bNext">'+ic('next')+UI.next_idiom+'</button>':'')+'</div></section>';
 paintIcons($('#app'));
 const d2=d;let fillK=0;
 const app=$('#app');
 app.onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.play){play(b.dataset.play,b);return;}
  if(b.dataset.restart){const k=b.dataset.restart;stopAudio();au.src='';cur='';play(k,app.querySelector('[data-play="'+k+'"]'));return;}
  if(b.dataset.hint){const k=+b.dataset.hint,h=$('#h'+k);h.hidden=!h.hidden;b.setAttribute('aria-pressed',!h.hidden);const nx=app.querySelector('[data-hint="'+(k+1)+'"]');if(nx&&!h.hidden)nx.disabled=false;return;}
  if(b.id==='bAns'){const a=$('#ans');a.hidden=!a.hidden;b.setAttribute('aria-pressed',!a.hidden);return;}
  if(b.dataset.flip){flip(b,b.getAttribute('aria-pressed')!=='true');return;}
  if(b.id==='bSeq'){seq(id,b);return;}
  if(b.dataset.w!==undefined){
   if(fillK>=d2.blank[1].length)return;
   const fb=$('#wfb');
   if(b.dataset.w===d2.blank[1][fillK]){const s=app.querySelector('.slot[data-k="'+fillK+'"]');s.innerHTML=b.dataset.w;s.classList.add('f');b.classList.add('ok');b.disabled=true;fillK++;fb.hidden=true;
    if(fillK>=d2.blank[1].length){showMean(true);}}
   else{b.classList.remove('shake','bad');void b.offsetWidth;b.classList.add('shake','bad');fb.hidden=false;clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('bad'),1200);}
   return;}
  if(b.id==='bReset'){fillK=0;$('#wfb').hidden=true;app.querySelectorAll('.slot').forEach(s=>{s.innerHTML='　';s.classList.remove('f')});app.querySelectorAll('.chip').forEach(c=>{c.disabled=false;c.classList.remove('ok','bad')});return;}
  if(b.id==='bMean'){showMean($('#mean').hidden);return;}
  if(b.dataset.ref){const r=$('#r'+b.dataset.ref);r.hidden=!r.hidden;b.setAttribute('aria-pressed',!r.hidden);return;}
  if(b.dataset.j){const k=+b.dataset.j,v=b.dataset.v==='1',j=d2.judge[k];
   b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
   const f=$('#f'+k);f.hidden=false;const ok=v===j[1];f.className='fb '+(ok?'y':'n');
   f.innerHTML=ok?ic('ok')+' '+j[2]:ic('search')+' '+UI.think_again;paintIcons(f);return;}
  if(b.dataset.ch){const k=+b.dataset.ch,ok=k===d2.ch.ans;
   app.querySelectorAll('[data-ch]').forEach(x=>x.setAttribute('aria-pressed',x===b));
   const f=$('#chf');f.hidden=false;f.className='fb '+(ok?'y':'n');f.innerHTML=ok?ic('ok')+' '+d2.ch.why+'<img class="chpic" src="img/'+id+'-ch.jpg" alt="">':ic('search')+' '+UI.think_again;paintIcons(f);
   if(ok){$('#done').hidden=false;earn(id);}return;}
  if(b.id==='bGoBook'){showCards();return;}
  if(b.id==='bNext'){go(st.i+1);return;}
 };
}
function go(i){stopGame();stopAudio();$('#modal').innerHTML='';st.view='';st.i=i;location.hash=DATA[i].id;tabs();render();window.scrollTo(0,0);}
function showCards(){stopGame();stopAudio();st.view='cards';location.hash='cards';tabs();renderCards();window.scrollTo(0,0);}
$('#sel').onchange=e=>go(+e.target.value);
$('#bBook').onclick=()=>st.view==='cards'?go(st.i):showCards();
$('#bFish').onclick=()=>st.view==='fish'?go(st.i):showFish();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
document.addEventListener('error',e=>{if(e.target&&e.target.tagName==='IMG')e.target.hidden=true;},true);
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>setSize(b.dataset.size));
function setSize(s){document.documentElement.className=s;st.size=s;document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.size===s));save();}
function setZy(on){st.zy=on;document.body.classList.toggle('zy',on);$('#bZy').setAttribute('aria-pressed',on);save();}
function setHc(on){st.hc=on;document.body.classList.toggle('hc',on);$('#bHc').setAttribute('aria-pressed',on);save();}
function setVoice(v){st.voice='f';}
function setRate(r){st.rate=+r;au.playbackRate=st.rate;const b=$('#bRate');b.querySelector('.ic').dataset.ic=st.rate<1?'turtle':'rabbit';paintIcons(b);$('#rLab').textContent=st.rate<1?UI.slow:UI.fast;save();}
$('#bZy').onclick=()=>setZy(!st.zy);
$('#bHc').onclick=()=>setHc(!st.hc);
$('#bRate').onclick=()=>setRate(st.rate<1?1:0.85);
function fromHash(){const h=location.hash.slice(1);const k=DATA.findIndex(d=>d.id===h);return k<0?0:k;}
function route(){if(location.hash==='#cards'){if(st.view!=='cards'){stopGame();st.view='cards';stopAudio();tabs();renderCards();}return;}if(location.hash==='#fish'){if(st.view!=='fish'){st.view='fish';stopAudio();tabs();renderFish();}return;}const k=fromHash();if(k!==st.i||st.view){stopGame();st.view='';st.i=k;stopAudio();tabs();render();}}
window.addEventListener('hashchange',route);
st.i=fromHash();
paintIcons();setSize(st.size||'s2');setZy(!!st.zy);setHc(!!st.hc);setVoice(st.voice);setRate(st.rate);
if(location.hash==='#cards'){st.view='cards';tabs();renderCards();}else if(location.hash==='#fish'){st.view='fish';tabs();renderFish();}else{tabs();render();}
}
</script>
</body>
</html>
