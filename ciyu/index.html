<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>語詞辨析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="font/zy.css">
<style>
:root{
  --font-ui:"Huninn","Microsoft JhengHei","PingFang TC",sans-serif;
  --font-text:"LXGW WenKai TC","Microsoft JhengHei","PingFang TC",serif;
  --font-zy:"BpmfZY","LXGW WenKai TC","Microsoft JhengHei",serif;
  --bg:#56655c; --ink:#f6f3ea; --soft:rgba(0,0,0,.2); --paper:#fbf6ea; --pink:#22332b; --mute:#5a6b62;
  --accent:#e8c46a; --hi:#ffe89a; --focus:#ffe066;
  --same:#1f7a4d; --same-bg:#d9f0e1; --opp:#b8431f; --opp-bg:#ffe2d3; --diff:#5a3ea6; --diff-bg:#e8e0ff;
  --plain-bg:#e9efe6; --good:#1f7a4d; --bad:#b3261e;
}
html{font-size:20px}
html[data-fs="2"]{font-size:24px}
html[data-fs="3"]{font-size:29px}
body.hc{--bg:#000; --ink:#fff; --soft:#000; --paper:#000; --pink:#fff; --mute:#fff; --accent:#fff; --hi:#ffeb3b; --focus:#ffeb3b;
  --same:#fff; --same-bg:#000; --opp:#fff; --opp-bg:#000; --diff:#fff; --diff-bg:#000; --plain-bg:#000; --good:#ffeb3b; --bad:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);line-height:1.5}
button,select{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
:focus-visible{outline:5px solid var(--focus);outline-offset:3px}
/* 設定列：最淡，不加框 */
.bar{padding:.4rem .6rem 0;display:flex;flex-direction:column;gap:.35rem}
.row{display:flex;gap:.35rem;align-items:center;overflow-x:auto}
.grp{display:flex;gap:.25rem;align-items:center;flex-shrink:0}
.lab{font-size:.75rem;opacity:.8;white-space:nowrap}
.tb{flex-shrink:0;min-height:64px;min-width:64px;padding:.2rem .5rem;border-radius:14px;background:var(--soft);color:var(--ink);white-space:nowrap;font-size:.9rem;display:inline-flex;align-items:center;gap:.3rem;justify-content:center}
.tb[aria-pressed="true"]{background:var(--accent);color:#22332b;font-weight:700}
body.hc .tb{border:3px solid #fff}
body.hc .tb[aria-pressed="true"]{background:#ffeb3b;color:#000}
.ic{display:inline-flex;width:1.75em;height:1.75em;flex:none}
.ic svg{width:100%;height:100%;overflow:visible}
button[aria-pressed="true"] .ic svg,.big .ic svg,body.hc .ic svg{background:#fffdf8;border-radius:50%;padding:2px}
.zyic{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:#fffdf8;color:#3b2a25;font-weight:700;border:2px solid #3b2a25}
.msg .ic,.prog .ic,.trap .ic{width:1.4em;height:1.4em;vertical-align:-.3em;margin-right:.2em}
.spk.ic{width:1.6em;height:1.6em;vertical-align:-.35em;opacity:1;margin-right:.3em}
.say .ic{width:1.6em;height:1.6em}
.a1{font-size:.8rem}.a2{font-size:1.05rem}.a3{font-size:1.35rem}
select.tb{max-width:7.4rem;text-overflow:ellipsis;color:var(--ink);padding:.2rem .4rem;font-size:.85rem}@media (min-width:900px){select.tb{max-width:16rem}}
select.tb option{color:#22332b}
main{padding:.6rem;max-width:1000px;margin:0 auto}
/* 紙卡：由上到下 ①問題 ②看的東西 ③作答區 */
.board{background:var(--paper);color:var(--pink);border-radius:22px;padding:1rem 1rem .8rem;font-family:var(--font-text)}
body.hc .board{border:4px solid #fff}
.zy .t{font-family:var(--font-zy);line-height:1.9}
.prog{display:flex;flex-wrap:wrap;gap:.2rem .9rem;align-items:baseline;font-family:var(--font-ui);font-size:.85rem;color:var(--mute);margin-bottom:.5rem}
.prog .st{white-space:nowrap}
.prog .now{color:var(--pink);font-weight:700;font-size:1rem;background:var(--hi);border-radius:8px;padding:0 .4rem}
body.hc .prog .now{color:#000}
.prog .sp{margin-left:auto}
.ask{font-family:var(--font-ui);font-size:1.35rem;font-weight:700;margin:0 0 .8rem}
[data-say]{cursor:pointer}
.spk{font-size:.7em;opacity:.6;margin-right:.25em;font-family:var(--font-ui)}
.pair{display:grid;grid-template-columns:1fr 3.2rem 1fr;gap:.4rem;align-items:start;text-align:center}
.pic{width:min(100%,12rem);margin:0 auto;border-radius:16px;overflow:hidden;line-height:0}
.pic svg,.pic img{width:100%;height:auto;display:block}
.word{font-size:3rem;font-weight:700;line-height:1.3;margin:.1rem 0}
.zy .word{line-height:1.7}
.clue{font-size:1.05rem;color:var(--mute);margin:0 auto;max-width:17rem;text-align:left}
.midsym{font-family:var(--font-ui);font-size:2.6rem;font-weight:700;align-self:center;color:var(--mute)}
.midsym.r-same{color:var(--same)}.midsym.r-opp{color:var(--opp)}.midsym.r-diff,.midsym.r-nopp{color:var(--diff)}
.nx{position:relative;display:inline-block}.nx::after{content:"";position:absolute;left:5%;right:5%;top:50%;border-top:.1em solid currentColor;transform:rotate(-40deg)}
.note.tip{font-family:var(--font-ui);font-weight:700;margin:0 0 .6rem}
.line{font-size:1.6rem;font-weight:700;text-align:center;margin:0 0 .6rem}
.line .s{font-family:var(--font-ui);margin:0 .5em}
.note{font-size:1.1rem;margin:.7rem 0 0;color:var(--pink)}
.note.trap{font-family:var(--font-ui);font-weight:700}
/* 作答區：全頁最醒目 */
.do{border:6px solid var(--accent);border-radius:20px;padding:.7rem;margin-top:.9rem;background:#fff}
body.hc .do{background:#000;border-color:#ffeb3b;border-width:8px}
.opts{display:flex;gap:.6rem;flex-wrap:wrap}
.opt{flex:1;min-width:7.5rem;min-height:84px;border-radius:16px;font-family:var(--font-ui);font-size:1.3rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.3rem .6rem}
.opt .sym{font-size:2.2rem;line-height:1}
.opt.r-same{background:var(--same-bg);color:var(--same)}.opt.r-opp{background:var(--opp-bg);color:var(--opp)}.opt.r-diff,.opt.r-nopp{background:var(--diff-bg);color:var(--diff)}
.opt.plain{background:var(--plain-bg);color:var(--pink)}
body.hc .opt{border:4px solid #fff}
.opt.wrong{opacity:.4;text-decoration:line-through}
.stmt{font-size:1.5rem;display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .1rem}
.paren{font-family:var(--font-ui);font-size:1.6rem;white-space:nowrap;margin-right:.3rem}
.paren b{display:inline-block;min-width:1.5em;text-align:center;color:var(--good)}
.tok{min-height:64px;padding:.1rem .15rem;font-family:inherit;font-size:inherit;color:inherit;display:inline-flex;align-items:center}
button.tok{border-bottom:4px dotted var(--mute);border-radius:0}
.tok.key{background:var(--hi);border-radius:999px;padding:.1rem .7rem;font-weight:700;outline:4px solid var(--bad)}
body.hc .tok.key{color:#000;outline-color:#fff}
.say{min-height:64px;min-width:64px;border-radius:14px;background:var(--plain-bg);font-size:1.3rem;margin-right:.3rem}
body.hc .say{border:3px solid #fff}
.cmp{display:flex;gap:1rem;justify-content:center;align-items:center}
.cmp .vs{font-size:2.2rem;font-family:var(--font-ui);font-weight:700}
.card{min-width:6.5rem;border-radius:18px;padding:.4rem .7rem;text-align:center;font-family:var(--font-ui);border:5px solid currentColor}
.card .cap{font-size:.8rem;display:block;color:var(--mute)}
.card .sym{font-size:3rem;line-height:1.1;font-weight:700;display:block}
.card .nm{font-size:1.1rem;font-weight:700;display:block}
.card.r-same{background:var(--same-bg);color:var(--same)}.card.r-opp{background:var(--opp-bg);color:var(--opp)}.card.r-diff,.card.r-nopp{background:var(--diff-bg);color:var(--diff)}
.msg{font-family:var(--font-ui);font-size:1.2rem;font-weight:700;margin:.7rem 0 0;color:var(--good)}
.msg.no{color:var(--bad)}
.test{margin-top:.9rem}
.sent{font-size:1.35rem;margin:.4rem 0;display:flex;flex-wrap:wrap;align-items:center;gap:.3rem}
.blank{display:inline-block;min-width:4.2em;border-bottom:5px solid var(--pink);text-align:center;font-weight:700;min-height:1.6em}
.blank.ok{color:var(--good);border-color:var(--good)}.blank.no{color:var(--bad);border-bottom-style:dashed}
.pick{min-height:64px;padding:.2rem .9rem;border-radius:14px;background:var(--plain-bg);font-family:inherit;font-size:1.25rem}
body.hc .pick{border:3px solid #fff}
.foot{display:flex;justify-content:space-between;gap:.6rem;margin-top:.9rem;flex-wrap:wrap}
.big{min-height:64px;padding:.3rem 1rem;border-radius:16px;background:var(--plain-bg);color:var(--pink);font-size:1.05rem;font-family:var(--font-ui);display:inline-flex;align-items:center;gap:.4rem;justify-content:center}
.big.go{background:var(--accent);color:#22332b;font-weight:700;font-size:1.2rem}
body.hc .big{border:3px solid #fff}
body.hc .big.go{background:#ffeb3b;color:#000}
.rgt{display:flex;gap:.6rem;margin-left:auto;flex-wrap:wrap}
#novoice{display:none;font-size:.85rem;padding:.3rem .6rem}
@media (max-width:640px){.word{font-size:2.2rem}.stmt{font-size:1.25rem}.pair{grid-template-columns:1fr 2.2rem 1fr}.midsym{font-size:2rem}}

.say .ic svg{background:#fffdf8;border-radius:50%;padding:3px}
.say .ic{width:2em;height:2em}
/* ===== 理解語詞（Gemini 內容，語詞辨析樣式）===== */
.modes{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:0 0 .8rem;font-family:var(--font-ui)}
.mtab{min-height:64px;padding:.2rem .7rem;border-radius:18px;background:var(--plain-bg);color:var(--pink);font-size:.95rem;display:inline-flex;align-items:center;gap:.3rem;text-align:left}
.mtab[aria-pressed="true"]{background:var(--accent);color:#22332b;font-weight:700}
body.hc .mtab{border:3px solid #fff}body.hc .mtab[aria-pressed="true"]{background:#ffeb3b;color:#000}
.note.sub{margin:-.5rem 0 .6rem;font-size:1rem;color:var(--mute)}
.stars2{display:inline-flex;align-items:center;gap:.2rem;font-weight:700;color:var(--pink)}
.star{width:1.3em;height:1.3em}.star.big{width:4rem;height:4rem}
.ljtop{display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap;margin:.3rem 0}
.gpic{width:min(100%,13rem);background:#fff;border-radius:16px;padding:.3rem}
.gpic svg,.gpic img{width:100%;height:auto;display:block;border-radius:12px}
.wbox{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.zyl{font-family:var(--font-ui);color:var(--mute);letter-spacing:.15em;font-size:.95rem}
.ljword{display:flex;gap:.4rem;cursor:pointer}
.wt{font-size:3.2rem;font-weight:700;line-height:1.3;padding:0 .35rem;border-radius:14px;border:4px solid transparent}
.zy .wt{line-height:1.7}
.wt.c1{color:#b3261e;background:#fde2df;border-color:#e57368}.wt.c2{color:#1d4ed8;background:#dde8ff;border-color:#7aa2f0}
.step{margin-top:1rem;padding-top:.6rem;border-top:3px dashed #d9dfd5}
.step.do{border-top:6px solid var(--accent)}
.sth{font-family:var(--font-ui);font-size:1.15rem;margin:0 0 .4rem;display:flex;align-items:center;gap:.3rem;color:var(--pink)}
.stat{font-family:var(--font-ui);font-size:1rem;margin:.5rem 0 0;color:var(--mute)}
.stat.okc{color:var(--good);font-weight:700}.stat.hintc{color:var(--bad);font-weight:700}
.orow{display:flex;align-items:center;justify-content:center;gap:.3rem;padding:.3rem 0;flex-wrap:wrap}
.tile{min-width:64px;min-height:64px;border-radius:14px;background:var(--plain-bg);font-family:var(--font-text);font-size:1.7rem;display:inline-flex;align-items:center;justify-content:center;color:var(--pink);padding:0 .2rem}
.zy .tile .t{line-height:1.3}
.tile.c1{background:#fde2df;color:#b3261e;box-shadow:inset 0 0 0 4px #e57368;font-weight:700}
.tile.c2{background:#dde8ff;color:#1d4ed8;box-shadow:inset 0 0 0 4px #7aa2f0;font-weight:700}
.plus{font-size:1.5rem;font-family:var(--font-ui);color:var(--mute);margin:0 .15rem}
.rings{display:flex;flex-direction:column;gap:.8rem}
.ringrow{display:flex;gap:.5rem;align-items:center}.ringrow .opt{flex:1;font-family:var(--font-text);font-size:1.5rem;font-weight:400}
.opt .tile{min-width:auto;min-height:auto;font-size:1.5rem;padding:0 .25rem;margin:0 .05rem}
.opt.circled{position:relative}
.opt.circled::after{content:"";position:absolute;inset:-8px;border:5px solid #d9342b;border-radius:999px;transform:rotate(-2deg);animation:ringIn .35s ease-out;pointer-events:none}
@keyframes ringIn{from{transform:scale(.8) rotate(-8deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.opt.circled::after{animation:none}}
.spicw{display:flex;justify-content:center;margin:.3rem 0}.spicw svg{width:9rem;height:auto;border-radius:12px}
.pick.picked{background:var(--good);color:#fff}
.wrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}
.wword{font-size:2.2rem;font-weight:700}.wmean{font-size:1.4rem;color:var(--mute)}.wrow .big{margin-left:auto}
.grids{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:.5rem 0}
.tz{position:relative;width:min(40vw,12rem);aspect-ratio:1/1;border:4px solid #c84b31;border-radius:10px;background:#fffdf9;overflow:hidden}
.tz::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed #f3a59a}
.tz::after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px dashed #f3a59a}
.tz .tr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#c9ccd1;font-family:var(--font-text);font-size:calc(min(40vw,12rem)*.76);line-height:1}
.tz canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1;cursor:crosshair}
body.hc .tz{background:#000;border-color:#ffeb3b}body.hc .tz .tr{color:#555}
.pens{display:flex;align-items:center;gap:.6rem;justify-content:center;font-family:var(--font-ui)}
.lab2{font-size:1rem;color:var(--mute)}
.pen{width:64px;height:64px;border-radius:50%;background:var(--pc);border:4px solid #fff;box-shadow:0 0 0 2px #c9ccd1}
.pen[aria-pressed="true"]{box-shadow:0 0 0 5px var(--accent)}
body.hc .pen[aria-pressed="true"]{box-shadow:0 0 0 5px #ffeb3b}
/* 小測驗：不用粗體 */
.qz .qbox{flex:1;min-width:14rem}
.qtype{font-family:var(--font-ui);font-size:.9rem;color:var(--mute);margin:0}
.qp{font-size:1.45rem;font-weight:400;line-height:1.6;margin:.3rem 0 .5rem}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.qopt{min-height:84px;border-radius:16px;background:var(--plain-bg);color:var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-text);font-weight:400;padding:.3rem}
.qopt .qzy{font-family:var(--font-ui);font-size:.85rem;color:var(--mute)}
.qopt .qw{font-size:1.7rem}
.qopt.right{background:var(--good);color:#fff}.qopt.right .qzy{color:#e8f5ec}
.qok{font-family:var(--font-ui);font-size:.9rem;display:inline-flex;align-items:center;gap:.2rem}
body.hc .qopt{border:4px solid #fff;background:#000}body.hc .qopt.right{background:#ffeb3b;color:#000}
.cert{text-align:center;border:6px solid var(--accent);border-radius:20px;padding:1rem;background:#fff}
.certn{font-size:1.6rem;color:var(--same);margin:.3rem 0}.certs .star{width:2rem;height:2rem}
body.hc .cert{background:#000}
body.hc .tile{border:3px solid #fff;background:#000;color:#fff}
body.hc .tile.c1,body.hc .wt.c1{color:#ffeb3b;background:#000;box-shadow:none;border-color:#ffeb3b}
body.hc .tile.c2,body.hc .wt.c2{color:#7fe3ff;background:#000;box-shadow:none;border-color:#7fe3ff}
body.hc .opt.circled::after{border-color:#ff4fd8}body.hc .gpic{background:#fff}
@media (max-width:640px){.wt{font-size:2.4rem}.tile{font-size:1.4rem}.qopts{grid-template-columns:1fr}}
@media print{.bar,.foot,.modes{display:none!important}}
[hidden]{display:none!important}
/* 選詞填寫 */
.tile.xs{background:#fff1b8;color:#5b4636;box-shadow:inset 0 0 0 4px #e8c46a;font-weight:700}
.tile.c3{background:#dff3e2;color:#1e7a3a;box-shadow:inset 0 0 0 4px #6cc070;font-weight:700}
.tile.circled{position:relative}.tile.circled::after{content:"";position:absolute;inset:-7px;border:5px solid #d9342b;border-radius:999px;transform:rotate(-2deg);pointer-events:none}
.xrows .orow{justify-content:flex-start;gap:.5rem}.xrows .tile{font-size:1.9rem;min-width:72px;min-height:72px}
.xmean{margin:.6rem 0;padding:.4rem 0;border-bottom:2px dashed #e6e0cf}.xmq{display:flex;align-items:center;gap:.4rem;font-size:1.35rem;margin-bottom:.4rem}
.xmq .tile{min-width:56px;min-height:56px}.xpic{width:min(100%,11rem)}.xw{font-size:1.6rem;font-family:var(--font-text)}
body.hc .tile.xs{background:#000;color:#fff;border-color:#fff;box-shadow:inset 0 0 0 4px #fff}body.hc .tile.c3{color:#9dff9d;background:#000;box-shadow:none;border-color:#9dff9d}
body.hc .tile.circled::after{border-color:#ff4fd8}
.modes.sub{padding:.5rem .6rem;margin-top:-.3rem;border-radius:18px;background:#f1ecdd;border-left:6px solid var(--accent)}
.mtab.lvtab{background:#fff;font-size:.92rem}.mtab.lvtab[aria-pressed="true"]{background:var(--accent)}
body.hc .modes.sub{background:#000;border-left-color:#ffeb3b}body.hc .mtab.lvtab{background:#000;color:#fff}body.hc .mtab.lvtab[aria-pressed="true"]{background:#ffeb3b;color:#000}
.xask{font-weight:700;color:var(--pink);font-size:1.2rem}
#ws{display:none}
@media print{body.wsprint>*:not(#ws){display:none!important}body.wsprint #ws{display:block!important;color:#000;background:#fff;font-family:var(--font-text);font-size:15pt}
#ws .wshead{display:flex;justify-content:space-between;font-family:var(--font-ui);font-weight:700;font-size:14pt;border-bottom:2px solid #000;padding-bottom:4pt;margin-bottom:6pt}
#ws .wsdir{font-size:12pt;margin:0 0 8pt}#ws .wsq{break-inside:avoid;page-break-inside:avoid;border:1.5px solid #555;border-radius:10px;padding:6pt 10pt;margin:0 0 9pt}
#ws h3{font-family:var(--font-ui);font-size:13pt;margin:0 0 3pt}#ws .wswords{font-size:24pt;letter-spacing:.15em;margin:2pt 0 6pt}
#ws .wsl3{font-family:var(--font-ui);font-size:12pt;margin:4pt 0 2pt}#ws .wsmatch{display:flex;gap:30%;margin:2pt 0 4pt 1em}
#ws .wsl,#ws .wsr{font-size:15pt;line-height:2}#ws .dot{font-size:9pt;margin:0 .5em;vertical-align:middle}#ws .wssub{font-size:11pt}
#ws .wsask{font-size:12pt;margin:0 0 2pt}#ws .wssent{font-size:15pt;line-height:2;margin:0}#ws .wskey{break-before:page;page-break-before:always;font-size:12pt}
.ws-zy #ws{}}
#wsdlg{position:fixed;inset:0;background:rgba(40,50,44,.55);display:flex;align-items:center;justify-content:center;z-index:200}
#wsdlg .wsbox{background:#fbf6ea;border-radius:22px;padding:1.2rem 1.4rem;width:min(92vw,30rem);display:flex;flex-direction:column;gap:.7rem}
#wsdlg .wsbox,#wsdlg .ask,#wsdlg .note{color:#22332b}#wsdlg .big{justify-content:center;text-decoration:none;color:#22332b}body.hc #wsdlg .wsbox,body.hc #wsdlg .ask,body.hc #wsdlg .note,body.hc #wsdlg .big{color:#fff}body.hc #wsdlg .wsbox{background:#000;border:4px solid #fff}
@media print{#wsdlg{display:none!important}}
#ws .wspics{display:flex;gap:14pt;margin:2pt 0 6pt}#ws .wsw{text-align:center;width:120pt}#ws .wsw img,#ws .wsw svg{width:120pt;height:90pt;object-fit:cover;border-radius:6pt;display:block}
#ws .wswd{font-size:22pt;letter-spacing:.1em;margin-top:2pt}
</style>
</head>
<body>
<header class="bar" aria-label="網頁設定">
  <div class="row">
    <div class="grp" role="group" aria-label="整頁字級"><span class="lab">字級</span>

  if(g.col){ h+=R(XU.x3cp,'p','note'); const cs=W.map(x=>g.col[x.w]).slice().sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    h+=W.map((x,wi)=>{ const ok=st.col[wi];

        return `<div class="sent">${sayBtn(s,'唸句子')}<button class="pick" data-act="xsw" data-w="${esc(x.w)}">${T(s)}</button>${shown?`<span class="msg ${ok?'':'no'}" style="margin:0">${icSvgS(ok?'ok':'cross')}${T(g.swap[x.w])}</span>`:''}</div>`; }).join('')}</div>`; }

function onXC1(b,sayEl){
  if(b&&b.dataset.act==='xprint'){ xcDlg(); return; }
  if(!b){ if(sayEl) speak(sayEl.dataset.say); return; }
  const D=XCD(), g=xg(), st=xst(), W=g.words, a=b.dataset.act, c=b.dataset.c, wi=+b.dataset.wi;
  if(b.dataset.say&&!a){ speak(b.dataset.say); return; }
  if(a==='xsame'){ if(st.same){ sayChar(c); return; }
    if(c===g.same){ st.same=true; sayChar(c); tipMsg(XF.sameOk(c),2400); render(); good($('.xs'),true); }
    else { bad(`[data-act="xsame"][data-c="${c}"]`); tipMsg(XF.notSame(c),2400); } return; }
  if(a==='xring'){ if(c===g.same){ bad(`[data-act="xring"][data-c="${c}"]`); tipMsg(XF.isSame(c),2400); return; }
    st.ring[wi]=true; sayChar(c); tipMsg(XF.ringOk(W[wi].w,c),2400); render(); const all=W.every((_,i)=>st.ring[i]); good($(`[data-act="xring"][data-wi="${wi}"].circled`),all); return; }
  if(a==='xcol'){ const x=W[wi], c=b.dataset.c; if(c===g.col[x.w]){ st.col[wi]=true; speak(XF.colOk(x.w,c)); tipMsg(XF.colOk(x.w,c),2400); render(); good($(`[data-act="xcol"][data-wi="${wi}"].picked`),W.every((_,i)=>st.col[i])); }
    else { speak(XU.colNo); tipMsg(XU.colNo,2400); bad(`[data-act="xcol"][data-wi="${wi}"][data-c="${c}"]`); } return; }
  if(a==='xmean'){ const x=W[wi]; if(b.dataset.m===x.dm){ st.mean[wi]=true; speak(XF.meanOk(x.w,dch(g,x),x.dm)); tipMsg(XF.meanOk(x.w,dch(g,x),x.dm),2400); render(); good($(`[data-act="xmean"][data-wi="${wi}"].picked`),W.every((_,i)=>st.mean[i])); }
    else { speak(XU.meanNo); tipMsg(XU.meanNo,2400); bad(`[data-act="xmean"][data-wi="${wi}"][data-m="${b.dataset.m}"]`); } return; }
  if(a==='xfill'){ const w=b.dataset.w, k=st.fill.length; if(k>=g.ans.length) return;
    if(w===g.ans[k]){ st.wrong=''; st.fill.push(w); const done=st.fill.length===g.ans.length; if(done){ speak(XF.full(g)); tipMsg(MF.fillOk({full:XF.full(g)}),2400); } else tone(GOOD); render(); good($('.blank.ok'),done); }
    else { st.wrong=w; const ws=g.sent.map(p=>typeof p==='number'?(st.fill[p]||(p===k?w:'什麼')):p).join(''); render(); speak(ws.replace(/[。！？]$/,'')+'。'+FILLNO); tipMsg(XF.fillNo(w)+(g.swap?'　'+XU.swapTip:''),3200); bad('.blank.no'); } return; }
  if(a==='xswap'){ st.swOpen=!st.swOpen; render(); return; }
  if(a==='xsw'){ const w=b.dataset.w; st.sw[w]=true; speak(XF.swapS(g,w)); render(); return; }
  if(a==='xwhole'){ speak(W.map(x=>`${x.w}，${x.mp}`).join('。')+'。'+XF.full(g)); return; }
  if(a==='xnext'||a==='xprev'){ S.x=Math.max(0,Math.min(D.groups.length-1,(S.x||0)+(a==='xnext'?1:-1))); save(); render(); window.scrollTo(0,0); return; }
  if(a==='xgo2'){ setMode('xc2'); return; }
}

  h+=`<section class="wskey"><h3>${T('教師解答')}</h3>${D.groups.map((g,n)=>`<p>${n+1}. ${T(XF.full(g))}</p><p class="wssub">${g.words.map(x=>T(x.w+(x.dm?'：'+dch(g,x)+'＝'+x.dm:'')+(g.col?'（'+g.col[x.w]+'）':''))).join('　')}</p>`).join('')}</section>`;

function go(di){ const p=cur(); let k=S.k+di, i=S.i;
  if(k>=p.says.length){ i=(i+1)%pairs().length; k=0; } else if(k<0){ i=(i-1+pairs().length)%pairs().length; k=pairs()[i].says.length-1; }
  S.i=i; S.k=k; save(); reset(); render(); window.scrollTo(0,0); }
// 朗讀：只用國語（臺灣）語音
const SAYFIX=[['樣子和環境','樣子汗環境'],['螃蟹和水鳥','螃蟹汗水鳥'],['我和爸爸','我汗爸爸'],['朝陽','招陽'],['「朝」','「招」'],['傍晚','幫晚'],['」和「','」，汗，「'],['東西和地方','東西汗地方'],['手和腳','手汗腳'],['教讀書','交讀書'],['還教我們','還交我們'],['長在同一','掌在同一'],['是和別','是汗別'],['是和一般','是汗一般'],['子和順序','子汗順序']];
const NOVEL=/Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|祖母|祖父|奶奶|爺爺/i; const vid=v=>v.voiceURI||v.name;
const NOT_TW=/zh[-_](CN|HK|SG|MO)|China|Mainland|普通话|Hong ?Kong|粤|粵/i;
let TW=[];
function twVoices(){ try{ TW=speechSynthesis.getVoices().filter(v=>/zh[-_]TW/i.test(v.lang)&&!NOT_TW.test(v.name)&&!NOVEL.test(v.name)).filter((v,i,a)=>a.findIndex(y=>vid(y)===vid(v))===i); TW.sort((a,b)=>(/Mei|美佳|Yating|雅婷|HsiaoChen|曉臻|Hanhan/i.test(b.name)?1:0)-(/Mei|美佳|Yating|雅婷|HsiaoChen|曉臻|Hanhan/i.test(a.name)?1:0)); }catch(e){ TW=[]; } vBadge(); return TW; }
const curVoice=()=>TW.find(v=>vid(v)===S.voice)||TW.find(v=>v.name===S.voice)||TW[0]||null;
function vBadge(){ const b=$('#bVoice'); if(!b) return; b.hidden=!TW.length; const v=curVoice(); if(v) $('#vLab').textContent='換聲音 '+(TW.indexOf(v)+1)+'/'+TW.length; }
function speak(t){ const sy=window.speechSynthesis; if(!sy||!window.SpeechSynthesisUtterance) { $('#novoice').style.display='block'; return; }
  const vs=sy.getVoices(); const tw=TW.length?TW:twVoices();
  if(vs.length&&!tw.length){ $('#novoice').style.display='block'; return; }
  SAYFIX.forEach(([a,b])=>{ t=t.split(a).join(b); });
  const u=new SpeechSynthesisUtterance(t.replace(/[「」]/g,'')); u.lang='zh-TW'; u.rate=S.rate; if(tw.length){ const cv=curVoice(); if(cv){ u.voice=cv; if(cv.lang) u.lang=cv.lang; } }
  try{ sy.cancel(); sy.speak(u); }catch(e){} }
if(window.speechSynthesis) try{ twVoices(); speechSynthesis.addEventListener('voiceschanged',twVoices); setTimeout(twVoices,1500); }catch(e){}
// 回饋：輕柔音效＋小星星
const RM=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const GOOD=[[784,.16],[1047,.3]], GREAT=[[659,.14],[784,.14],[1047,.4]], OOPS=[[330,.16,'triangle'],[262,.3,'triangle']];
let AC=null;
function tone(seq){ if(!S.snd) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
  let t=AC.currentTime+0.01; seq.forEach(([f,d,ty])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=ty||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(ty?0.12:0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.05); t+=d*0.7; }); }catch(e){} }
function burst(r,n){ if(RM()||!document.body.animate) return; const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const cols=S.hc?['#ffeb3b','#ffffff']:['#f2b632','#2f9e6b','#ff8f66','#7fb8e6'];
  for(let i=0;i<n;i++){ const sp=document.createElement('span'); sp.textContent=i%3?'✦':'★'; sp.setAttribute('aria-hidden','true');
    sp.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;font-size:${18+Math.random()*16}px;color:${cols[i%cols.length]};pointer-events:none;z-index:99;margin:-12px 0 0 -10px`;
    document.body.appendChild(sp); const ang=Math.PI*2*i/n+Math.random()*.4, dist=60+Math.random()*(n>10?90:40);
    sp.animate([{transform:'translate(0,0) scale(.4)',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(1)`,opacity:1,offset:.6},{transform:`translate(${Math.cos(ang)*dist*1.15}px,${Math.sin(ang)*dist*1.15+20}px) scale(.8)`,opacity:0}],{duration:800,easing:'ease-out'}).onfinish=()=>sp.remove(); } }
function onBoard(e){ const b=e.target.closest('[data-act]'), sayEl=e.target.closest('[data-say]');
  if(b&&b.dataset.act==='mode'){ setMode(b.dataset.m); return; }

  if(a==='to'){ V.step=b.dataset.s; V.msg=null; V.wrong={}; }

  if(a==='exam'){ const right=rightCard(p,lens)===lens?'o':'x'; if(b.dataset.a===right){ V.ans=right; V.msg={ok:true,t:UI.right}; } else { V.msg={ok:false,t:UI.again}; V.step='key'; V.clue=true; } }
  if(a==='steps'){ V.step='key'; V.msg=null; V.clue=true; }
  if(a==='clue') V.clue=true;
  if(a==='showtest') V.test=true;
  if(a==='test') V.tests[b.dataset.n]=b.dataset.c;
  if(a==='nextq'){ go(1); return; } if(a==='prev'){ go(-1); return; }

    if(V.msg.ok){ const big=a==='ans'||a==='exam'; tone(big?GREAT:GOOD); burst(rect,big?16:7); const m=$('.msg'); if(m) m.animate([{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:350,easing:'ease-out'}); }

  } }
