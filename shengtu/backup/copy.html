<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>複製生圖小幫手程式</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#4f5f58;font-family:"jf-openhuninn-2.0","Microsoft JhengHei",sans-serif}
.card{background:#f6f1e6;border:4px solid #3b2a1e;border-radius:24px;padding:40px 48px;text-align:center;max-width:640px}
h1{font-size:2.2rem;margin:0 0 16px;color:#3b2a1e}
p{font-size:1.5rem;line-height:1.6;color:#3b2a1e;margin:0 0 24px}
button{font:inherit;font-size:2rem;min-height:96px;padding:0 48px;border-radius:20px;border:4px solid #3b2a1e;background:#f2c14e;color:#3b2a1e;cursor:pointer}
button:focus-visible{outline:6px solid #1d4ed8;outline-offset:4px}
#msg{margin-top:24px;font-size:1.6rem;font-weight:bold;color:#1d6b3a;min-height:2em}
</style></head><body>
<div class="card">
<h1>複製生圖小幫手程式</h1>
<p>按下面的黃色按鈕，程式就會複製好。</p>
<button id="b" disabled>讀取中…</button>
<div id="msg" role="status"></div>
</div>
<script>
var src = '';
var b = document.getElementById('b'), msg = document.getElementById('msg');
fetch('source-20261124.txt', {cache:'no-store'}).then(function(r){return r.text();}).then(function(t){ src = t; b.disabled = false; b.textContent = '複製程式'; });
b.addEventListener('click', function(){
  navigator.clipboard.writeText(src).then(function(){
    msg.textContent = '✔ 已複製好了（' + src.length.toLocaleString() + ' 字）';
  }, function(){
    var ta = document.createElement('textarea'); ta.value = src; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    msg.textContent = '✔ 已複製好了';
  });
});
</script>
</body></html>
