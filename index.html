<title>薛老師的教室</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one centred column. Home = two giant subject blocks; subject = lesson cards with picture; lesson = colour-coded sections of big game buttons. */
:root{
  --bg:#f3f8fc; --panel:#ffffff; --ink:#1f2a33; --muted:#51606c; --line:#c9d6e0;
  --zh:#c8432f; --zh-soft:#fde4de;            /* 國語：番茄紅 */
  --math:#1d65b5; --math-soft:#dcebfb;        /* 數學：藍 */
  --focus:#ff9f1c;
  --sec-v:#fff1a8; --sec-v-ink:#5c4a00;       /* 詞語：黃 */
  --sec-1:#bdeef2; --sec-1-ink:#005c66;       /* 一方面：青 */
  --sec-2:#cdeebf; --sec-2-ink:#1e5a12;       /* 看似卻：綠 */
  --sec-3:#ffd6e7; --sec-3-ink:#7a1d45;
  --sec-4:#fff0a8; --sec-4-ink:#6b4e00;       /* 短語：粉紅 */
  --btn:#ffffff; --btn-ink:#1f2a33; --shadow:0 6px 0 rgba(31,42,51,.18);
  --font:"Huninn","LXGW WenKai TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#56655c; --panel:#46534b; --ink:#f6f3ea; --muted:#dde5de; --line:#83928a;
  --zh:#ff7a63; --zh-soft:#3d2320; --math:#6fb0ff; --math-soft:#1b2c40; --focus:#ffb547;
  --sec-v:#4a3f10; --sec-v-ink:#ffe98a; --sec-1:#0e4248; --sec-1-ink:#a6f1f7; --sec-2:#1f4318; --sec-2-ink:#c3f0b0; --sec-3:#4d1f33; --sec-3-ink:#ffc2dc; --sec-4:#4a3d0a; --sec-4-ink:#ffe680;
  --btn:#f4ecd8; --btn-ink:#22302a; --shadow:0 6px 0 rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#56655c; --panel:#46534b; --ink:#f6f3ea; --muted:#dde5de; --line:#83928a;
  --zh:#ff7a63; --zh-soft:#3d2320; --math:#6fb0ff; --math-soft:#1b2c40; --focus:#ffb547;
  --sec-v:#4a3f10; --sec-v-ink:#ffe98a; --sec-1:#0e4248; --sec-1-ink:#a6f1f7; --sec-2:#1f4318; --sec-2-ink:#c3f0b0; --sec-3:#4d1f33; --sec-3-ink:#ffc2dc; --sec-4:#4a3d0a; --sec-4-ink:#ffe680;
  --btn:#f4ecd8; --btn-ink:#22302a; --shadow:0 6px 0 rgba(0,0,0,.45); color-scheme:dark}
/* 高對比模式（老師護眼用）：黑底、黃白字、粗框 */
:root[data-contrast="high"]{
  --bg:#000; --panel:#000; --ink:#fff; --muted:#ffe600; --line:#fff;
  --zh:#ffe600; --zh-soft:#000; --math:#00e5ff; --math-soft:#000; --focus:#ff4fd8;
  --sec-v:#000; --sec-v-ink:#ffe600; --sec-1:#000; --sec-1-ink:#00e5ff; --sec-2:#000; --sec-2-ink:#7dff5a; --sec-3:#000; --sec-3-ink:#ff8ad0; --sec-4:#000; --sec-4-ink:#ffe066;
  --btn:#000; --btn-ink:#fff; --shadow:none; color-scheme:dark}
:root[data-contrast="high"] .section,:root[data-contrast="high"] .game,:root[data-contrast="high"] .lesson,:root[data-contrast="high"] .subject{border-width:4px!important}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
.wrap{max-width:980px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,a{font-family:inherit}
:focus-visible{outline:5px solid var(--focus);outline-offset:3px;border-radius:14px}
.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:16px;background:var(--panel);padding:8px 14px;z-index:9}
/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand svg{width:2.4rem;height:2.4rem;flex:none}
.brand h1{margin:0;font-size:1.7rem;letter-spacing:.06em;font-weight:400}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool{min-height:52px;min-width:52px;border:3px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:4px 14px;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tool[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.sizes{display:inline-flex;border:3px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.sizes button{min-height:46px;min-width:52px;font-size:.8rem;border:none;background:transparent;color:var(--ink);cursor:pointer;font-weight:700}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sizes .s1{font-size:.75rem}.sizes .s2{font-size:.95rem}.sizes .s3{font-size:1.15rem}
/* breadcrumb + back */
.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;min-height:64px;padding:6px 22px 6px 14px;border-radius:999px;border:3px solid var(--ink);background:var(--panel);color:var(--ink);text-decoration:none;font-size:1rem;box-shadow:var(--shadow)}
.back svg{width:1.3em;height:1.3em}
.crumb{color:var(--muted);font-size:.85rem}
h2.page{font-size:1.5rem;margin:0;font-weight:400;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lead{margin:0;color:var(--muted);font-size:.9rem}
/* speaker */
.spk{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid currentColor;background:transparent;color:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.spk svg{width:26px;height:26px}
.spk.speaking{background:var(--focus);color:#000;border-color:var(--focus)}
/* home subjects */
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.subject{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;border-radius:32px;border:4px solid transparent;text-decoration:none;color:#fff;box-shadow:var(--shadow);padding:20px;text-align:center}
.subject.zh{background:var(--zh)}.subject.math{background:var(--math)}.subject.zy{background:#2e7d4f}
:root[data-contrast="high"] .subject.zy{color:#7dff5a;border-color:#7dff5a}
.lesson.zy{border-color:#2e7d4f}.lesson.zy .go{background:#2e7d4f}.lesson.zy .thumb,.lessonhead .mini.zy{background:#e3f3e6}
:root[data-contrast="high"] .lesson.zy .go{background:#000;color:#7dff5a;border:2px solid #7dff5a}
:root[data-contrast="high"] .lesson.zy .thumb,:root[data-contrast="high"] .lessonhead .mini.zy{background:#eaffe3}
/* 字音：玫瑰紅（和國語同是紅色系，偏粉紫好區分） */
.subject.zg{background:#b0335f}
:root[data-contrast="high"] .subject.zg{color:#ff8fb8;border-color:#ff8fb8}
.lesson.zg{border-color:#b0335f}.lesson.zg .go{background:#b0335f}.lesson.zg .thumb,.lessonhead .mini.zg{background:#fbe1ea}
:root[data-contrast="high"] .lesson.zg .go{background:#000;color:#ff8fb8;border:2px solid #ff8fb8}
:root[data-contrast="high"] .lesson.zg .thumb{background:#fff0f5}
/* 數讀題：紫 */
.subject.sd{background:#6b4fa0}
:root[data-contrast="high"] .subject.sd{color:#e0b8ff;border-color:#e0b8ff}
.lesson.sd{border-color:#6b4fa0}.lesson.sd .go{background:#6b4fa0}.lesson.sd .thumb,.lessonhead .mini.sd{background:#ece6f8}
:root[data-contrast="high"] .lesson.sd .go{background:#000;color:#e0b8ff;border:2px solid #e0b8ff}
:root[data-contrast="high"] .lesson.sd .thumb,:root[data-contrast="high"] .lessonhead .mini.sd{background:#f3eaff}
:root[data-contrast="high"] .subject{background:#000;color:var(--zh);border-color:var(--zh)}
:root[data-contrast="high"] .subject.math{color:var(--math);border-color:var(--math)}
.subject .icon{width:110px;height:110px}
.subject .label{font-size:2.4rem;letter-spacing:.2em;line-height:1.1}
.subject .sub{font-size:.85rem;opacity:.95}
.badge{display:inline-block;background:#fff;color:#1f2a33;border-radius:999px;padding:2px 14px;font-size:.75rem}
.subject.soon{opacity:.92}
/* lessons */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.lesson{display:flex;flex-direction:column;border-radius:28px;border:4px solid var(--zh);background:var(--panel);color:var(--ink);text-decoration:none;overflow:hidden;box-shadow:var(--shadow)}
.lesson .thumb{background:var(--zh-soft);display:flex;align-items:center;justify-content:center;padding:14px;aspect-ratio:4/3;max-width:100%}
.lesson .thumb svg{width:70%;height:auto}
.lesson .info{padding:12px 18px 16px;display:flex;flex-direction:column;gap:4px}
.lesson .title{font-size:1.6rem;line-height:1.2}
.lesson .meta{font-size:.8rem;color:var(--muted)}
.lesson .go{margin-top:6px;align-self:flex-start;background:var(--zh);color:#fff;border-radius:999px;padding:4px 18px;font-size:.85rem}
:root[data-contrast="high"] .lesson .go{background:#000;color:var(--zh);border:2px solid var(--zh)}
.empty{border:4px dashed var(--line);border-radius:28px;padding:30px;text-align:center;color:var(--muted)}
/* lesson page */
.lessonhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lessonhead .mini{width:96px;height:96px;flex:none;background:var(--zh-soft);border-radius:24px;display:flex;align-items:center;justify-content:center}
.lessonhead .mini svg{width:76px}
.section{border-radius:28px;padding:16px 18px 20px;border:4px solid transparent;display:flex;flex-direction:column;gap:12px}
.section.v{background:var(--sec-v);color:var(--sec-v-ink);border-color:color-mix(in srgb,var(--sec-v-ink) 35%,transparent)}
.section.p1{background:var(--sec-1);color:var(--sec-1-ink);border-color:color-mix(in srgb,var(--sec-1-ink) 35%,transparent)}
.section.p2{background:var(--sec-2);color:var(--sec-2-ink);border-color:color-mix(in srgb,var(--sec-2-ink) 35%,transparent)}
.section.p3{background:var(--sec-3);color:var(--sec-3-ink);border-color:color-mix(in srgb,var(--sec-3-ink) 35%,transparent)}
.section.p4{background:var(--sec-4);color:var(--sec-4-ink);border-color:color-mix(in srgb,var(--sec-4-ink) 35%,transparent)}
:root[data-contrast="high"] .section{border-color:currentColor}
.sechead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.num{flex:none;width:52px;height:52px;border-radius:50%;background:currentColor;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.num span{color:var(--panel)}
:root[data-contrast="high"] .num span{color:#000}
.sechead h3{margin:0;font-size:1.4rem;font-weight:400;line-height:1.25}
.sechead small{display:block;font-size:.75rem;opacity:.85}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.game{display:flex;align-items:center;gap:12px;min-height:84px;padding:10px 16px;border-radius:22px;background:var(--btn);color:var(--btn-ink);text-decoration:none;border:3px solid currentColor;box-shadow:var(--shadow);font-size:1.15rem}
.section .game{border-color:color-mix(in srgb,currentColor 0%,transparent)}
.section.v .game{color:var(--btn-ink);border-color:var(--sec-v-ink)}
.section.p1 .game{border-color:var(--sec-1-ink)}.section.p2 .game{border-color:var(--sec-2-ink)}.section.p3 .game{border-color:var(--sec-3-ink)}.section.p4 .game{border-color:var(--sec-4-ink)}
.game svg{width:46px;height:46px;flex:none}
.game .gname{display:flex;flex-direction:column;line-height:1.2}
.game .gname small{font-size:.65rem;color:var(--muted)}
.game:hover,.lesson:hover,.subject:hover,.back:hover{transform:translateY(-2px)}
.game:active,.lesson:active,.subject:active{transform:translateY(3px);box-shadow:none}
.videobtn{border-color:#c8432f;max-width:420px}
.lesson .thumb svg.th{width:62%;height:auto}
/* 圖案的深色線條在深色底上會不見，所以縮圖底色在任何模式都用淺色 */
.lesson .thumb,.lessonhead .mini{background:#fde4de}
:root[data-contrast="high"] .lesson .thumb,:root[data-contrast="high"] .lessonhead .mini{background:#fff3d6}
.lesson.math{border-color:var(--math)}
.lesson.math .go{background:var(--math)}
.lesson.math .thumb,.lessonhead .mini.math{background:#dcebfb}
:root[data-contrast="high"] .lesson.math .go{background:#000;color:var(--math);border:2px solid var(--math)}
:root[data-contrast="high"] .lesson.math .thumb,:root[data-contrast="high"] .lessonhead .mini.math{background:#e3f6ff}
.note{font-size:.75rem;color:var(--muted);text-align:center}
.voicemsg{background:var(--panel);border:3px dashed var(--focus);border-radius:18px;padding:12px 16px;font-size:.8rem;line-height:1.7}
@media (max-width:640px){.subjects{grid-template-columns:minmax(0,1fr)}.subject{min-height:200px}.subject .icon{width:84px;height:84px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.game:hover,.lesson:hover,.subject:hover,.back:hover{transform:none}}

/* 注音字型（注音芫荽體 OFL）：開啟注音時改用含注音的字型；多音字由程式依詞語自動選讀音 */
@font-face{font-family:"BpmfZY";src:url("zy.woff") format("woff");font-display:swap}
html.zy{--font:"BpmfZY","Huninn","Microsoft JhengHei",sans-serif}
html.zy .tools{font-family:"Huninn","Microsoft JhengHei",sans-serif}
</style>

// ---------- settings ----------
function setFs(px){ document.documentElement.style.setProperty('--fs', px+'px'); document.querySelectorAll('.sizes button[data-fs]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.fs==px))); store.set('xue.fs',px); }
document.querySelectorAll('.sizes button[data-fs]').forEach(b=>b.addEventListener('click',()=>setFs(b.dataset.fs)));
setFs(store.get('xue.fs')||24);
function setContrast(on){ if(on) document.documentElement.setAttribute('data-contrast','high'); else document.documentElement.removeAttribute('data-contrast'); $('#contrastBtn').setAttribute('aria-pressed',String(on)); store.set('xue.hc',on?'1':'0'); }
$('#contrastBtn').addEventListener('click',()=>setContrast($('#contrastBtn').getAttribute('aria-pressed')!=='true'));
setContrast(store.get('xue.hc')==='1');

let RATE=store.get('xue.rate')==='1'?1:0.6;
function setRate(r){ RATE=r; document.querySelectorAll('.rates button').forEach(b=>b.setAttribute('aria-pressed',String(parseFloat(b.dataset.rate)===r))); store.set('xue.rate',String(r)); }
document.querySelectorAll('.rates button').forEach(b=>b.addEventListener('click',()=>{ setRate(parseFloat(b.dataset.rate)); say(b.dataset.rate==='1.0'?'快一點':'慢慢唸'); }));
setRate(RATE===1?1:0.6);

function route(){
