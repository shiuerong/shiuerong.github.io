<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>數學讀題練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="font/zy.css">
<style>
:root{
  --bg:#e9f1df; --paper:#fffaf0; --ink:#22302a; --muted:#4f5f55; --line:#c3d1bb;
  --track:#b8432c; --flag:#f2b705; --ok:#1f7a35; --ok-bg:#dff3e2; --no:#b3261e; --no-bg:#fde3e0; --focus:#ff8a00;
  --nav:#ffffff; --nav-ink:#22302a; --sel:#e3efe0; --sel-line:#4f8a68; --pick:#f3d36b; --pick-ink:#22302a;
  --set-btn:#ffffff; --set-on:#cfe0d4; --set-on-ink:#1e3a2e; --stage-line:#e0a800;
  --card:#fffaf0; --card-ink:#22302a; --card-line:#c8b98f;
  --font-ui:"Huninn","Microsoft JhengHei","PingFang TC",sans-serif;
  --font-text:"LXGW WenKai TC","Microsoft JhengHei","PingFang TC",serif;
  --font-zy:"BpmfZY","LXGW WenKai TC","Microsoft JhengHei",serif;
  --fs:24px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-contrast="high"]){
  --bg:#1e3a2e; --ink:#f1ead6; --muted:#c9d6c8; --line:#4d6f5f; --track:#e07a5f;
  --nav:#2a4a3c; --nav-ink:#f1ead6; --sel:#3a6652; --sel-line:#a8d5ba; --set-btn:rgba(255,255,255,.06); --stage-line:#ffd25e; color-scheme:dark}}
:root[data-contrast="high"]{
  --bg:#000; --paper:#000; --ink:#fff; --muted:#ffe600; --line:#fff; --track:#ffe600; --ok:#7dff7d; --ok-bg:#000; --no:#ff8a8a; --no-bg:#000;
  --focus:#00e5ff; --nav:#000; --nav-ink:#fff; --sel:#000; --sel-line:#ffe600; --pick:#ffe600; --pick-ink:#000;
  --set-btn:#000; --set-on:#ffe600; --set-on-ink:#000; --stage-line:#fff; --card:#000; --card-ink:#fff; --card-line:#fff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);line-height:1.5;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:5px solid var(--focus);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 1 設定列：淡 */
.setbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--set-btn)}
.seg .lab{display:inline-flex;align-items:center;padding:0 4px 0 12px;font-size:.7rem;color:var(--muted)}
.seg button,.tool{min-height:64px;min-width:64px;border:none;background:transparent;font-size:.75rem;cursor:pointer;padding:0 12px;color:var(--ink)}
.seg .s1{font-size:.7rem}.seg .s2{font-size:.9rem}.seg .s3{font-size:1.15rem}
.tool{border:2px solid var(--line);border-radius:18px;background:var(--set-btn);display:inline-flex;align-items:center;gap:6px}
.tool svg{width:1.3em;height:1.3em}
.seg button[aria-pressed="true"],.tool[aria-pressed="true"]{background:var(--set-on);color:var(--set-on-ink);font-weight:700}

:root[data-contrast="high"] .seg,:root[data-contrast="high"] .tool{border-width:4px}

/* 標題 */
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:3.2rem;height:3.2rem;flex:none}
.brand h1{margin:0;font-family:var(--font-text);font-weight:700;font-size:1.9rem;line-height:1.2}

/* 2 選練習：中等 */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lane{min-height:84px;border:3px solid var(--line);border-radius:20px;background:var(--nav);color:var(--nav-ink);cursor:pointer;
  display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;font-size:1rem}
.lane .bib{flex:none;width:2.6rem;height:2.6rem;border-radius:12px;border:3px solid var(--line);display:flex;align-items:center;justify-content:center}
.lane .bib svg{width:1.7rem;height:1.7rem}
.lane .ln{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.lane .ln small{font-size:.65rem;color:var(--muted)}
.lane[aria-selected="true"]{background:var(--sel);border:4px solid var(--sel-line);font-weight:700}
.lane[aria-selected="true"] .bib{background:var(--sel-line);border-color:var(--sel-line)}
:root[data-contrast="high"] .lane{border-width:4px}
:root[data-contrast="high"] .lane[aria-selected="true"]{background:#ffe600;color:#000}
:root[data-contrast="high"] .lane[aria-selected="true"] .ln small{color:#000}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{min-height:64px;border:2px solid var(--line);border-radius:999px;background:var(--nav);color:var(--nav-ink);padding:0 18px 0 10px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.9rem;cursor:pointer}
.mode svg{width:2.3rem;height:2.3rem;flex:none;background:#f4ecd8;border-radius:10px;padding:3px}
.mode[aria-pressed="true"]{background:var(--pick);color:var(--pick-ink);border-color:var(--pick);font-weight:700}
.mode[aria-pressed="true"]::before{content:"▶";font-size:.7rem}
:root[data-contrast="high"] .mode{border-width:4px}
@media (max-width:820px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}.lanes{grid-template-columns:1fr}}

/* 3 作答區：最醒目 */
.stage{background:var(--card);color:var(--card-ink);border:6px solid var(--stage-line);border-radius:28px;padding:18px clamp(12px,3vw,28px) 24px;
  box-shadow:0 0 0 4px rgba(255,210,94,.18),0 10px 24px rgba(0,0,0,.25);min-width:0}
:root[data-contrast="high"] .stage{box-shadow:none}
.ghead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.howto{display:flex;gap:10px;align-items:center;min-width:0}
.howto p{margin:0;font-family:var(--font-text);font-size:1rem}
.say{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid var(--card-ink);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--card-ink)}
.say svg{width:30px;height:30px}
.say.on{background:#f2b705;color:#000;border-color:#f2b705}
.btn{min-height:64px;min-width:64px;border-radius:18px;border:3px solid var(--card-ink);background:var(--card);color:var(--card-ink);font-size:.9rem;font-weight:700;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:1.3em;height:1.3em}
.btn.main{background:var(--track);border-color:var(--track);color:#fff}
.btn[aria-pressed="true"]{background:#f3d36b;color:#22302a;border-color:#c49a00}
:root[data-contrast="high"] .btn.main,:root[data-contrast="high"] .btn[aria-pressed="true"]{background:#ffe600;color:#000;border-color:#ffe600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.count{font-size:.85rem;min-width:4.5em;text-align:center}
.fb{min-height:2.4em;display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.1rem;font-weight:700;margin-top:10px}
.fb svg{width:1.4em;height:1.4em}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.pic{background:#fff;border:3px solid var(--card-line);border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3}
.pic svg{width:100%;height:100%;display:block}
:root[data-contrast="high"] .pic{border:4px solid #fff}
.txt{font-family:var(--font-text)}
html.zy .zyon,html.zy .zyon *:not(svg):not(svg *){font-family:var(--font-zy)}
html.zy .zyon .eq{font-family:var(--font-ui)}

/* 進度點 */
.progress{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.dot{min-width:56px;height:56px;border-radius:999px;border:3px solid var(--card-line);background:transparent;color:var(--card-ink);font-size:.75rem;font-weight:700;cursor:pointer;padding:0 .3em}
.dot.done{background:#1f7a35;border-color:#1f7a35;color:#fff}
.dot.miss{background:#b3261e;border-color:#b3261e;color:#fff}
.dot.cur{outline:4px solid #f2b705;outline-offset:2px}

/* 翻卡 */
.flip{display:grid;place-items:center;gap:14px}
.fcard{width:min(480px,100%);min-height:min(360px,80vw);border:4px solid var(--card-line);border-radius:24px;background:#fff;color:#22302a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;cursor:pointer;font-size:3.2rem;font-family:var(--font-text);font-weight:700}
.fcard .pic{width:100%;font-size:1rem}
.fcard .mean{font-size:.42em;font-weight:400}
.fcard .tag{font-size:.3em;color:#4f5f55;font-family:var(--font-ui);font-weight:400}
:root[data-contrast="high"] .fcard{background:#000;color:#fff;border-color:#fff}
:root[data-contrast="high"] .fcard .tag{color:#ffe600}

/* 配對 */
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:16px}
.wtile{min-height:72px;min-width:96px;border:3px solid var(--card-ink);border-radius:18px;background:#fff;color:#22302a;font-family:var(--font-text);font-size:1.8rem;font-weight:700;padding:0 16px;cursor:pointer}
.wtile[aria-pressed="true"]{outline:6px solid #f2b705;outline-offset:3px;transform:translateY(-4px)}
.wtile.used{visibility:hidden}
:root[data-contrast="high"] .wtile{background:#000;color:#fff;border-color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,44%),1fr));gap:12px}
.mspot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;border:3px dashed var(--card-line);border-radius:20px;background:transparent;cursor:pointer;color:var(--card-ink)}
.mspot .pic{width:100%}
.mspot .slot{min-height:2.6rem;font-family:var(--font-text);font-size:1.6rem;font-weight:700}
.mspot .slot:empty::before{content:"放在這裡";font-size:.6em;opacity:.7;font-weight:400}
.mspot.done{border-style:solid;border-color:var(--ok);background:var(--ok-bg);cursor:default}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* 選擇題 */
.qtop{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin-bottom:14px}
.qtop .pic{width:min(340px,100%)}
.clause{display:inline;font:inherit;color:inherit;background:none;border:none;padding:0 .05em;margin:0;cursor:pointer;line-height:inherit;text-align:left;border-bottom:3px dotted #b9c9b0;border-radius:6px}
.clause:hover{background:#f6efd8}
.clause.on{background:#fff0a8;border-bottom-color:#c49a00}
:root[data-contrast="high"] .clause{border-bottom-color:#fff}
:root[data-contrast="high"] .clause.on{background:#000;outline:3px solid #ffe600}
.tip{font-size:.7rem;text-align:center;margin:0;opacity:.85}
.qtext{font-family:var(--font-text);font-size:1.5rem;line-height:1.7;margin:0;flex:1 1 320px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
.opt{min-height:80px;border:3px solid var(--card-ink);border-radius:18px;background:#fff;color:#22302a;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;font-size:1.8rem;font-weight:700}
.opt .lb{font-size:.55em;border:2px solid currentColor;border-radius:8px;padding:0 .3em;font-weight:700}
.opt.word{font-family:var(--font-text)}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.opt.right::after{content:"✓";font-size:.8em}
.opt.wrong::after{content:"✗";font-size:.8em}
:root[data-contrast="high"] .opt{background:#000;color:#fff;border-color:#fff;border-width:4px}
:root[data-contrast="high"] .opt.right{color:#7dff7d;border-color:#7dff7d}
:root[data-contrast="high"] .opt.wrong{color:#ff8a8a;border-color:#ff8a8a}

/* 讀題卡 */
.rcard{display:flex;flex-direction:column;gap:14px;align-items:center}
.rq{background:#fff;color:#22302a;border:4px solid var(--card-line);border-radius:24px;padding:18px 22px;width:100%;font-family:var(--font-text);font-size:1.8rem;line-height:1.9}
:root[data-contrast="high"] .rq{background:#000;color:#fff;border-color:#fff}
.rq .pic{width:min(360px,100%);margin:0 auto 10px;font-size:1rem}
.k{border-radius:8px;padding:0 .1em;font-weight:700}
.k.add{background:#c9ecc4;box-shadow:inset 0 -.2em 0 #3f9b4a}
.k.sub{background:#fbd0c9;box-shadow:inset 0 -.2em 0 #d62828}
.k.cmp{background:#cfe0ff;box-shadow:inset 0 -.2em 0 #2a6fb0}
.k.ask{background:#fff0a8;box-shadow:inset 0 -.2em 0 #c49a00}
:root[data-contrast="high"] .k{background:#000!important;box-shadow:none!important;color:#ffe600;outline:3px solid #ffe600}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:.75rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:1.4em;height:1em;border-radius:4px}
.ans{width:100%;border:4px dashed var(--ok);border-radius:20px;padding:12px 18px;text-align:center;font-size:1.6rem;font-weight:700}
.ans .eq{font-family:var(--font-ui);font-size:1.2em;display:block}
.ans .a{font-family:var(--font-text)}

/* 結束 */
.end{text-align:center;display:grid;gap:12px;justify-items:center;padding:20px 0}
.end .big{font-family:var(--font-text);font-size:2rem;font-weight:700}
.end svg{width:96px;height:96px}

/* 分享 */
dialog.share{border:4px solid var(--card-line);border-radius:24px;background:var(--card);color:var(--card-ink);max-width:min(520px,92vw);padding:20px}
dialog.share::backdrop{background:rgba(0,0,0,.5)}
dialog.share h2{margin:0 0 6px;font-size:1.1rem}
dialog.share .qr{background:#fff;padding:10px;border-radius:12px;width:min(300px,70vw);margin:10px auto}
dialog.share .qr svg{display:block;width:100%;height:auto}
dialog.share input{width:100%;min-height:56px;margin:10px 0;font:inherit;font-size:.7rem;border:3px solid var(--card-line);border-radius:12px;padding:0 10px;background:#fff;color:#22302a}
.msg{font-size:.8rem;border:3px solid var(--no);border-radius:14px;padding:10px 14px;background:var(--no-bg)}

/* 可愛圖示（cute-button-icons） */
.ic{display:inline-flex;width:1.6em;height:1.6em;flex:none;vertical-align:-.35em}
.ic svg{width:100%!important;height:100%!important;overflow:visible;background:none!important;padding:0!important}
button[aria-pressed="true"] .ic svg,:root[data-contrast="high"] .ic svg{background:#fffdf8!important;border-radius:50%;padding:2px!important}
.zyic{display:inline-flex;align-items:center;justify-content:center;width:1.45em;height:1.45em;border-radius:50%;background:#fffdf8;color:#3b2a25;font-weight:700;border:2px solid #3b2a25;flex:none;line-height:1}
.mode[aria-pressed="true"]::before{content:""!important;display:inline-block;border-left:.5em solid currentColor;border-top:.32em solid transparent;border-bottom:.32em solid transparent;margin-right:.25em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3em}

.spk svg,.say svg{width:80%!important;height:80%!important;background:#fffdf8;border-radius:50%;padding:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="setbar" role="group" aria-label="網頁設定">
    <div class="seg" role="group" aria-label="字的大小"><span class="lab">字級</span><button class="s1" type="button" data-fs="20" aria-label="字小">A</button><button class="s2" type="button" data-fs="24" aria-label="字中">A</button><button class="s3" type="button" data-fs="30" aria-label="字大">A</button></div>
    <div class="seg" role="group" aria-label="朗讀速度"><span class="lab">語速</span><button type="button" data-rate="0.85"><span class="ic" aria-hidden="true"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><ellipse cx="22" cy="28" rx="15" ry="11" fill="#8fd18a" stroke="#3b2a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M14 26l8-6 8 6-8 6z" fill="#c8eebd" stroke="#3b2a25" stroke-width="2"/><circle cx="40" cy="25" r="6" fill="#b9e6a6" stroke="#3b2a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="41.5" cy="23.5" r="1.4" fill="#3b2a25"/><path d="M11 38v3M30 38v3" stroke="#3b2a25" stroke-width="4" stroke-linecap="round"/></svg></span>慢</button><button type="button" data-rate="1"><span class="ic" aria-hidden="true"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M17 20Q12 3 17 3t5 17M31 20q5-17 0-17t-5 17" fill="#fff" stroke="#3b2a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M17 18q-2-10 0-12M31 18q2-10 0-12" stroke="#ff9fb0" stroke-width="2.5"/><circle cx="24" cy="30" r="13" fill="#fff" stroke="#3b2a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="20" cy="29" r="1.6" fill="#3b2a25"/><circle cx="28" cy="29" r="1.6" fill="#3b2a25"/><path d="M21.6 32q2.4 2.2 4.8 0" fill="none" stroke="#3b2a25" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="16.5" cy="31.5" rx="2" ry="1.3" fill="#ff9fb0"/><ellipse cx="31.5" cy="31.5" rx="2" ry="1.3" fill="#ff9fb0"/></svg></span>快</button></div>
    <button class="tool" id="zyBtn" type="button" aria-pressed="false"><span class="zyic" aria-hidden="true">ㄅ</span>注音</button>
    <button class="tool" id="qtBtn" type="button" aria-pressed="false"><span class="ic" aria-hidden="true"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M24 6c-8 0-12 6-12 13v8l-4 6h32l-4-6v-8c0-7-4-13-12-13z" fill="#d9d4cc" stroke="#3b2a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="24" cy="38" r="4" fill="#b7b0a5" stroke="#3b2a25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M8 8l32 32" stroke="#e0533d" stroke-width="4.5" stroke-linecap="round"/></svg></span>安靜</button>

  if(curAudio){ curAudio.pause(); curAudio=null; }
  if(!('speechSynthesis' in window)) return;
  if(!tw) pickVoice();
  if(!tw){ const m=$('#voiceMsg'); m.hidden=false; m.innerHTML=T('這台平板（電腦）沒有臺灣國語語音，請到設定新增「中文（台灣）」語音。'); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(sayText(text)); u.voice=tw; u.lang=tw.lang||'zh-TW'; u.rate=RATE;
  document.querySelectorAll('.say.on').forEach(b=>b.classList.remove('on')); if(btn) btn.classList.add('on');
  u.onend=u.onerror=()=>btn&&btn.classList.remove('on'); speechSynthesis.speak(u);
}
const sayBtn = (text,label) => `<button class="say" type="button" data-say="${esc(text)}" aria-label="唸出：${esc(label||text)}">${ICON.spk}</button>`;
document.addEventListener('click',e=>{ const b=e.target.closest('.say[data-say]'); if(b){ e.stopPropagation(); speak(b.dataset.say,b); } },true);
let ac=null;
function beep(ok){ if(QUIET) return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); (ok?[660,880]:[240,180]).forEach((f,i)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type=ok?'triangle':'square'; o.frequency.value=f; const t=ac.currentTime+i*.12; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(ok?.2:.08,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+.2); }); }catch(e){} }

// ---------- 區塊與玩法 ----------
const SECS = [
  {key:'a', title:'數學常用字', sub:'22 個常用字', modes:['flash','match','pick']},
  {key:'b', title:'讀題卡', sub:'30 張讀題卡', modes:['read']},
  {key:'c', title:'應用題', sub:'26 題選算式', modes:['eq']},
];
const MODES = {
  flash:{name:'翻卡', how:'先唸唸看，再按翻卡。'},
  match:{name:'配對', how:'先點一個詞，再點對的圖。'},
  pick:{name:'看圖選詞', how:'看圖，選出對的詞。'},
  read:{name:'讀題', how:'唸唸看題目，想一想要怎麼算，再翻面看答案。'},
  eq:{name:'選算式', how:'讀完題目，選出對的算式。'},
};
const state = { sec:'a', mode:'flash' };
function readHash(){ const h=decodeURIComponent(location.hash.slice(1)); const [path,...qs]=h.split('&'); const [s,m]=path.split('_');
  const sec=SECS.find(x=>x.key===s); if(sec){ state.sec=s; state.mode=sec.modes.includes(m)?m:sec.modes[0]; }
  const p=Object.fromEntries(qs.map(x=>x.split('=')));
  if(p.zy!==undefined) setZy(p.zy==='1',true); if(p.rate) setRate(p.rate==='1'?1:0.85); if(p.fs) setFs({1:20,2:24,3:30}[p.fs]||24); }
function writeHash(){ history.replaceState(null,'','#'+state.sec+'_'+state.mode); }
function drawNav(){
  $('#title').innerHTML=T('數學讀題練習');
  $('#lanes').innerHTML = SECS.map(s=>`<button class="lane" role="tab" type="button" data-sec="${s.key}" aria-selected="${s.key===state.sec}"><span class="bib">${LICON[s.key]}</span><span class="ln"><span>${T(s.title)}</span><small>${T(s.sub)}</small></span></button>`).join('');
  const sec=SECS.find(s=>s.key===state.sec);
  $('#modes').innerHTML = sec.modes.map(m=>`<button class="mode" type="button" data-mode="${m}" aria-pressed="${m===state.mode}">${MICON[m]}<span>${T(MODES[m].name)}</span></button>`).join('');
}
$('#lanes').addEventListener('click',e=>{ const b=e.target.closest('.lane'); if(!b) return; state.sec=b.dataset.sec; state.mode=SECS.find(s=>s.key===state.sec).modes[0]; go(); });
$('#modes').addEventListener('click',e=>{ const b=e.target.closest('.mode'); if(!b) return; state.mode=b.dataset.mode; go(); });
let VIEW=null; // 目前玩法的重畫函式（切換注音時用）
function go(){ writeHash(); drawNav(); stopAll(); const st=$('#stage'); st.innerHTML=''; VIEW=GAMES[state.mode](st); }
function head(st, how){ const d=document.createElement('div'); d.className='ghead'; d.innerHTML=`<div class="howto">${sayBtn(how)}<p>${T(how)}</p></div>`; st.append(d); }
function endScreen(box, ok, total, again){
  box.innerHTML=`<div class="end">${ICON.star}<div class="big">${T('全部完成')}</div>${total?`<div>${esc(ok)} ／ ${esc(total)}</div>`:''}<button class="btn main" type="button">${T('再玩一次')}</button></div>`;
  box.querySelector('button').onclick=again; beep(true);
}
const FB = (ok) => `<span class="fb ${ok?'ok':'no'}">${ok?ICON.ok:ICON.no}${T(ok?'答對了':'再想想')}</span>`;
const W = DATA.words, PIC = DATA.pics;
const wIdx = w => W.findIndex(x=>x[0]===w);

// ---------- 玩法：數學常用字 ----------
const GAMES = {};
GAMES.flash = st => {
  head(st, MODES.flash.how); const box=document.createElement('div'); st.append(box);
  let i=0, back=false;
  function draw(){ const [w,mean,p]=W[i];
    box.innerHTML=`<div class="flip"><button class="fcard" type="button" aria-label="${back?'背面':'正面'}：${esc(w)}，點一下翻面">${back?`<span class="pic">${PIC[p]}</span><span>${T(w)}</span>${mean!==w?`<span class="mean">＝ ${T(mean)}</span>`:''}`:`<span>${T(w)}</span><span class="tag">${T('翻面')}</span>`}</button>
      <div class="row"><button class="btn" type="button" data-a="prev" aria-label="上一張">${ICON.prev}</button>${sayBtn(w)}<button class="btn main" type="button" data-a="flip">${ICON.flipi}${T('翻面')}</button><span class="count">${i+1} ／ ${W.length}</span><button class="btn" type="button" data-a="next" aria-label="下一張">${ICON.next}</button></div></div>`;
  }
  box.onclick=e=>{ const a=e.target.closest('[data-a],.fcard'); if(!a) return; const k=a.dataset.a||'flip';
    if(k==='flip'){ back=!back; if(back) speak(W[i][0]===W[i][1]?W[i][0]:W[i][0]+'，'+W[i][1]); }
    if(k==='next'){ i=(i+1)%W.length; back=false; } if(k==='prev'){ i=(i-1+W.length)%W.length; back=false; } draw(); box.querySelector(`[data-a="${k}"]`)?.focus(); };
  draw(); return draw;
};
GAMES.match = st => {
  head(st, MODES.match.how); const box=document.createElement('div'); st.append(box);
  const rounds=DATA.rounds; let r=0, sel=null, done=new Set(), miss=0;
  function draw(){ const ws=rounds[r];
    box.innerHTML=`<p class="count" style="margin:0 0 10px">${r+1} ／ ${rounds.length}</p>
      <div class="tray">${shuffle(ws).map(w=>`<button class="wtile${done.has(w)?' used':''}" type="button" data-w="${esc(w)}" aria-pressed="${sel===w}">${T(w)}</button>`).join('')}</div>
      <div class="mgrid">${ws.map(w=>({w,o:Math.random()})).sort((a,b)=>a.o-b.o).map(({w})=>`<button class="mspot${done.has(w)?' done':''}" type="button" data-p="${esc(w)}" aria-label="${done.has(w)?esc(w):'一張圖，放詞語'}"><span class="pic">${PIC[W[wIdx(w)][2]]}</span><span class="slot">${done.has(w)?T(w):''}</span></button>`).join('')}</div>
      <div class="fbx"></div>`;
  }
  box.onclick=e=>{ const t=e.target.closest('.wtile'); const p=e.target.closest('.mspot');
    if(t&&!t.classList.contains('used')){ sel=t.dataset.w; box.querySelectorAll('.wtile').forEach(x=>x.setAttribute('aria-pressed',String(x===t))); speak(sel); return; }
    if(p&&!p.classList.contains('done')){ if(!sel){ box.querySelector('.fbx').innerHTML=`<span class="fb no">${T('先點一個詞，再點對的圖。')}</span>`; return; }
      if(p.dataset.p===sel){ done.add(sel); beep(true); sel=null;
        if(rounds[r].every(w=>done.has(w))){ if(r<rounds.length-1){ r++; draw(); box.querySelector('.fbx').innerHTML=FB(true); } else endScreen(box,0,0,()=>{ r=0; done.clear(); draw(); }); return; }
        const keep=[...box.querySelectorAll('.mspot')].map(x=>x.dataset.p); draw2(keep); box.querySelector('.fbx').innerHTML=FB(true); }
      else { beep(false); miss++; p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); box.querySelector('.fbx').innerHTML=FB(false); } } };
  function draw2(order){ // 保持圖的位置
    const ws=rounds[r]; const tiles=[...box.querySelectorAll('.wtile')].map(x=>x.dataset.w);
    box.querySelector('.tray').innerHTML=tiles.map(w=>`<button class="wtile${done.has(w)?' used':''}" type="button" data-w="${esc(w)}" aria-pressed="false">${T(w)}</button>`).join('');
    box.querySelector('.mgrid').innerHTML=order.map(w=>`<button class="mspot${done.has(w)?' done':''}" type="button" data-p="${esc(w)}" aria-label="${done.has(w)?esc(w):'一張圖，放詞語'}"><span class="pic">${PIC[W[wIdx(w)][2]]}</span><span class="slot">${done.has(w)?T(w):''}</span></button>`).join('');
  }
  draw(); return ()=>{ const order=[...box.querySelectorAll('.mspot')].map(x=>x.dataset.p); if(order.length) draw2(order); else draw(); };
};
GAMES.pick = st => {
  head(st, MODES.pick.how); const box=document.createElement('div'); st.append(box);
  let qs, i, res;
  const conf = w => DATA.conf.find(g=>g.includes(w))||[w];
  function init(){ qs=shuffle(W.map(x=>x[0])).map(w=>{ const pool=shuffle(W.map(x=>x[0]).filter(x=>!conf(w).includes(x))); return {w, opts:shuffle([w,pool[0],pool[1]])}; }); i=0; res=[]; draw(); }
  function draw(){ if(i>=qs.length) return endScreen(box,res.filter(x=>x==='done').length,qs.length,init);
    const q=qs[i];
    box.innerHTML=`<div class="progress">${qs.map((_,k)=>`<button class="dot ${res[k]||''}${k===i?' cur':''}" type="button" data-k="${k}" aria-label="第${k+1}題">${k+1}</button>`).join('')}</div>
      <div class="qtop"><span class="pic">${PIC[W[wIdx(q.w)][2]]}</span></div>
      <div class="opts">${q.opts.map(o=>`<button class="opt word" type="button" data-o="${esc(o)}">${T(o)}</button>`).join('')}</div><div class="fbx"></div>`;
  }
  box.onclick=e=>{ const d=e.target.closest('.dot'); if(d){ i=+d.dataset.k; draw(); return; }
    const o=e.target.closest('.opt'); if(!o||o.disabled) return; const q=qs[i];
    if(o.dataset.o===q.w){ o.classList.add('right'); box.querySelectorAll('.opt').forEach(x=>x.disabled=true); if(!res[i]) res[i]='done'; beep(true); speak(q.w); box.querySelector('.fbx').innerHTML=FB(true)+`<div class="row"><button class="btn main" type="button" data-n="1">${T('下一張')}${ICON.next}</button></div>`; }
    else { o.classList.add('wrong'); o.disabled=true; res[i]='miss'; beep(false); box.querySelector('.fbx').innerHTML=FB(false); }
    if(e.target.closest('[data-n]')){} };
  box.addEventListener('click',e=>{ if(e.target.closest('[data-n]')){ i++; draw(); box.querySelector('.opt,.btn')?.focus(); } });
  init(); return draw;
};

// ---------- 讀題卡 ----------
function marked(t, on, from, to){ const ch=zyStr(t); const plain=[...t]; from=from||0; to=to==null?plain.length:to;
  if(!on) return esc(ch.slice(from,to).join(''));
  const K=DATA.keys; const out=[]; let i=from;
  while(i<to){ let hit=null; for(const [k,c] of K){ const n=[...k].length; if(i+n<=to&&plain.slice(i,i+n).join('')===k){ hit=[k,c]; break; } }
    if(hit){ const n=[...hit[0]].length; out.push(`<span class="k ${hit[1]}">${esc(ch.slice(i,i+n).join(''))}</span>`); i+=n; } else { out.push(esc(ch[i])); i++; } }
  return out.join(''); }
// 題目依逗號分段，每一段都可以點來聽
function clauses(t, on){ const plain=[...t]; const out=[]; let a=0, k=0;
  for(let i=0;i<plain.length;i++){ if(plain[i]==='，'||i===plain.length-1){ const b=i+1; const seg=plain.slice(a,b).join('');
      out.push(`<button class="clause" type="button" data-t="${esc(t)}" data-k="${k}" data-seg="${esc(seg.replace(/[，？]/g,''))}" aria-label="聽這一段：${esc(seg)}">${marked(t,on,a,b)}</button>`); a=b; k++; } }
  return out.join(''); }
function playSeg(t,k,seg,btn){ const g=DATA.segs[t]; stopAll();
  if(!(AUD[t]&&g&&g[k])){ speak(seg,btn); return; }
  btn.classList.add('on'); const [s,e]=g[k]; const a=new Audio('data:audio/mpeg;base64,'+AUD[t]); a.playbackRate=RATE===1?1:0.85; curAudio=a;
  const done=()=>{ a.pause(); btn.classList.remove('on'); if(curAudio===a) curAudio=null; };
  a.addEventListener('loadedmetadata',()=>{ a.currentTime=s; a.play().catch(done); },{once:true});
  a.ontimeupdate=()=>{ if(a.currentTime>=e-0.02) done(); }; a.onended=done; a.onerror=done; }
document.addEventListener('click',e=>{ const c=e.target.closest('.clause'); if(c){ e.stopPropagation(); playSeg(c.dataset.t,+c.dataset.k,c.dataset.seg,c); } },true);
GAMES.read = st => {
  head(st, MODES.read.how); const box=document.createElement('div'); st.append(box);
  const R=DATA.reads; let i=0, back=false, mk=store.get('sd.mk')==='1';
  function draw(){ const [q,p,eq,a]=R[i];
    box.innerHTML=`<div class="rcard">
      <div class="row"><button class="btn" type="button" data-a="mk" aria-pressed="${mk}">${ICON.mark}${T('找關鍵字')}</button></div>
      ${mk?`<div class="legend"><span><i style="background:#c9ecc4"></i>${T('一共')}</span><span><i style="background:#fbd0c9"></i>${T('剩下')}</span><span><i style="background:#cfe0ff"></i>${T('比')}</span><span><i style="background:#fff0a8"></i>${T('幾')}</span></div>`:''}
      <div class="rq">${p?`<div class="pic">${PIC[p]}</div>`:''}<div class="cls">${clauses(q,mk)}</div></div>
      <p class="tip">${T('點一段題目，就會唸那一段。')}</p>
      ${back?`<div class="ans">${eq?`<span class="eq">${esc(eq)}</span>`:''}<span class="a">${T('答')}：${T(a)}</span></div>`:''}
      <div class="row"><button class="btn" type="button" data-a="prev" aria-label="上一張">${ICON.prev}</button>${sayBtn(q,'題目')}<button class="btn main" type="button" data-a="flip">${ICON.flipi}${T('翻面')}</button><span class="count">${i+1} ／ ${R.length}</span><button class="btn" type="button" data-a="next" aria-label="下一張">${ICON.next}</button></div></div>`;
  }
  box.onclick=e=>{ const a=e.target.closest('[data-a]'); if(!a) return; const k=a.dataset.a;
    if(k==='mk'){ mk=!mk; store.set('sd.mk',mk?'1':'0'); }
    if(k==='flip'){ back=!back; if(back){ const [,,eq,an]=R[i]; speak((eq?eq+'，':'')+'答：'+an); } }
    if(k==='next'){ i=(i+1)%R.length; back=false; } if(k==='prev'){ i=(i-1+R.length)%R.length; back=false; }
    draw(); box.querySelector(`[data-a="${k}"]`)?.focus(); };
  draw(); return draw;
};

// ---------- 應用題選算式 ----------
GAMES.eq = st => {
  head(st, MODES.eq.how); const box=document.createElement('div'); st.append(box);
  const Q=DATA.quiz; let qs,i,res,picked;
  function init(){ qs=Q.map((q,k)=>({k,order:shuffle([0,1,2])})); i=0; res=[]; picked={}; draw(); }
  function draw(){ if(i>=qs.length) return endScreen(box,res.filter(x=>x==='done').length,qs.length,init);
    const {k,order}=qs[i]; const [q,opts,ans]=Q[k]; const pk=picked[i]||[];
    const solved=pk.includes(ans);
    box.innerHTML=`<div class="progress">${qs.map((_,j)=>`<button class="dot ${res[j]||''}${j===i?' cur':''}" type="button" data-k="${j}" aria-label="第${j+1}題">${j+1}</button>`).join('')}</div>
      <div class="qtop">${sayBtn(q,'題目')}<p class="qtext cls">${clauses(q,false)}</p></div><p class="tip" style="margin-bottom:10px">${T('點一段題目，就會唸那一段。')}</p>
      <div class="opts">${order.map((o,n)=>`<button class="opt${pk.includes(o)?(o===ans?' right':' wrong'):''}" type="button" data-o="${o}"${pk.includes(o)||solved?' disabled':''}><span class="lb">${'ABC'[n]}</span><span class="eq">${esc(opts[o])}</span></button>`).join('')}</div>
      <div class="fbx">${solved?FB(true):(pk.length?FB(false):'')}</div>
      <div class="row" style="margin-top:16px"><button class="btn" type="button" data-p="1" aria-label="上一題"${i===0?' disabled':''}>${ICON.prev}</button><span class="count">${i+1} ／ ${qs.length}</span><button class="btn" type="button" data-n="1" aria-label="下一題">${ICON.next}</button></div>`;
  }
  box.onclick=e=>{ const d=e.target.closest('.dot'); if(d){ i=+d.dataset.k; draw(); return; }
    if(e.target.closest('[data-n]')){ i++; draw(); box.querySelector('.opt')?.focus(); return; }
    if(e.target.closest('[data-p]')){ if(i>0){ i--; draw(); } return; }
    const o=e.target.closest('.opt'); if(!o||o.disabled) return; const {k}=qs[i]; const ans=Q[k][2]; const v=+o.dataset.o;
    (picked[i]=picked[i]||[]).push(v);
    if(v===ans){ if(!res[i]) res[i]='done'; beep(true); speak(Q[k][1][ans]); } else { res[i]='miss'; beep(false); }
    draw(); box.querySelector(v===ans?'[data-n]':'.opt:not([disabled])')?.focus(); };
  init(); return draw;
};

// ---------- 設定 ----------
function setFs(px){ px=[20,24,30].includes(+px)?+px:24; document.documentElement.style.setProperty('--fs',px+'px'); document.querySelectorAll('[data-fs]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.fs===px))); store.set('sd.fs',px); }
document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>setFs(b.dataset.fs));
function setRate(r){ RATE=+r; document.querySelectorAll('[data-rate]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.rate===RATE))); store.set('sd.rate',String(RATE)); }
document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>setRate(b.dataset.rate));
function setHc(v){ if(v) document.documentElement.dataset.contrast='high'; else delete document.documentElement.dataset.contrast; $('#hcBtn').setAttribute('aria-pressed',String(!!v)); store.set('sd.hc',v?'1':'0'); }
$('#hcBtn').onclick=()=>setHc(!document.documentElement.dataset.contrast);
function setQuiet(v){ QUIET=!!v; $('#qtBtn').setAttribute('aria-pressed',String(QUIET)); store.set('sd.quiet',QUIET?'1':'0'); }
$('#qtBtn').onclick=()=>setQuiet(!QUIET);
function setZy(v,silent){ ZYON=!!v; document.documentElement.classList.toggle('zy',ZYON); $('#zyBtn').setAttribute('aria-pressed',String(ZYON)); store.set('sd.zy',ZYON?'1':'0');
  if(!silent){ drawNav(); const h=$('#stage .howto'); if(h){ const t=h.querySelector('.say').dataset.say; h.querySelector('p').innerHTML=T(t); } if(VIEW) VIEW(); } }
$('#zyBtn').onclick=()=>setZy(!ZYON);
// 分享
$('#shBtn').onclick=()=>{ const sec=SECS.find(s=>s.key===state.sec); const url=location.href.split('#')[0]+'#'+state.sec+'_'+state.mode+'&zy='+(ZYON?1:0)+'&rate='+(RATE===1?1:0.85);
  $('#shWhat').textContent=sec.title+'・'+MODES[state.mode].name; $('#shUrl').value=url;
  try{ const q=QRMake(url), n=q.getModuleCount(), m=4; let d=''; for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c+m} ${r+m}h1v1h-1z`;
    $('#shQr').innerHTML=`<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`; }catch(e){ $('#shQr').textContent=''; }
  $('#shDlg').showModal(); };
$('#shCopy').onclick=async()=>{ const i=$('#shUrl'); try{ await navigator.clipboard.writeText(i.value); }catch(e){ i.select(); document.execCommand&&document.execCommand('copy'); } $('#shCopy').textContent='已複製'; setTimeout(()=>$('#shCopy').textContent='複製連結',1500); };
$('#shClose').onclick=()=>$('#shDlg').close();

setFs(store.get('sd.fs')||24); setRate(RATE); setHc(store.get('sd.hc')==='1'); setQuiet(QUIET); setZy(store.get('sd.zy')==='1',true);
readHash(); go();
window.addEventListener('hashchange',()=>{ readHash(); go(); });
})();
</script>
