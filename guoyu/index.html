<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* 可愛圖示（cute-button-icons） */
.ic{display:inline-flex;width:1.6em;height:1.6em;flex:none;vertical-align:-.35em}
.ic svg{width:100%!important;height:100%!important;overflow:visible;background:none!important;padding:0!important}
button[aria-pressed="true"] .ic svg,:root[data-contrast="high"] .ic svg{background:#fffdf8!important;border-radius:50%;padding:2px!important}
.zyic{display:inline-flex;align-items:center;justify-content:center;width:1.45em;height:1.45em;border-radius:50%;background:#fffdf8;color:#3b2a25;font-weight:700;border:2px solid #3b2a25;flex:none;line-height:1}
.mode[aria-pressed="true"]::before{content:""!important;display:inline-block;border-left:.5em solid currentColor;border-top:.32em solid transparent;border-bottom:.32em solid transparent;margin-right:.25em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3em}

.spk svg,.say svg{width:80%!important;height:80%!important;background:#fffdf8;border-radius:50%;padding:3px}
[hidden]{display:none!important}
</style></head><body>
<meta charset="utf-8">
<title>國語遊戲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="font/zy.css">
<style>

/* Layout: one centred column like a running track — lane tabs (sections), mode chips, then one big game card on cream paper. */
:root{
  --bg:#e9f1df;          /* 運動場草地 */
  --lane:#ffffff;        /* 跑道白線 */
  --paper:#fffaf0;       /* 米白紙卡 */
  --ink:#22302a;         /* 墨綠黑 */
  --muted:#4f5f55;
  --line:#b9c9b0;
  --track:#b8432c;       /* 紅土跑道 */
  --track-ink:#ffffff;
  --flag:#f2b705;        /* 終點旗黃 */
  --ok:#1f7a35; --ok-bg:#dff3e2;
  --no:#b3261e; --no-bg:#fde3e0;
  --focus:#ff8a00;
  --shadow:0 6px 0 rgba(34,48,42,.18);
  --font-ui:"Huninn","Microsoft JhengHei","PingFang TC",sans-serif;
  --font-text:"LXGW WenKai TC","Microsoft JhengHei","PingFang TC",serif;
  --font-zy:"BpmfZY","LXGW WenKai TC","Microsoft JhengHei",serif;
  --fs:24px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#56655c; --lane:#4a5850; --paper:#f4ecd8; --ink:#f6f3ea; --muted:#dde5de; --line:#83928a;
  --track:#e07a5f; --track-ink:#1e1a14; --flag:#ffd25e; --ok:#9fe3a8; --ok-bg:#46594c; --no:#ffb0a6; --no-bg:#4a2a26;
  --focus:#ffb547; --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#56655c; --lane:#4a5850; --paper:#f4ecd8; --ink:#f6f3ea; --muted:#dde5de; --line:#83928a;
  --track:#e07a5f; --track-ink:#1e1a14; --flag:#ffd25e; --ok:#9fe3a8; --ok-bg:#46594c; --no:#ffb0a6; --no-bg:#4a2a26;
  --focus:#ffb547; --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark}
/* 高對比：黑底白字、黃色重點、粗白框 */
:root[data-contrast="high"]{
  --bg:#000; --lane:#000; --paper:#000; --ink:#fff; --muted:#ffe600; --line:#fff;
  --track:#ffe600; --track-ink:#000; --flag:#ffe600; --ok:#7dff7d; --ok-bg:#000; --no:#ff8a8a; --no-bg:#000;
  --focus:#00e5ff; --shadow:none; color-scheme:dark}
/* 紙卡上的字：一般與深色模式都是米白紙配深字；高對比是黑底白字 */
:root{--card:#fffaf0;--card-ink:#22302a;--card-line:#c8b98f}
:root[data-contrast="high"]{--card:#000;--card-ink:#fff;--card-line:#fff}



*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:5px solid var(--focus);outline-offset:3px}
:root[data-contrast="high"] *{text-shadow:none}

/* ---------- 頂端：課名＋工具列（兩排以內） ---------- */
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:2.6rem;height:2.6rem;flex:none}
.brand h1{margin:0;font-family:var(--font-text);font-weight:700;font-size:1.6rem;line-height:1.2;text-wrap:balance}
.brand small{display:block;font-size:.75rem;color:var(--muted);font-family:var(--font-ui)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
:root[data-theme="dark"] .seg, :root:not([data-theme="light"]) .seg{}
.seg button,.tool{min-height:64px;min-width:64px;border:none;background:transparent;font-size:.8rem;cursor:pointer;padding:0 12px;font-weight:700;color:var(--card-ink)}
.seg button[aria-pressed="true"]{background:var(--track);color:var(--track-ink)}
.seg .s1{font-size:.7rem}.seg .s2{font-size:.9rem}.seg .s3{font-size:1.15rem}
.tool{border:3px solid var(--line);border-radius:18px;background:var(--paper);display:inline-flex;align-items:center;gap:6px}
.tool svg{width:1.3em;height:1.3em}
.tool[aria-pressed="true"]{background:var(--track);color:var(--track-ink);border-color:var(--track)}
.seg .lab{display:inline-flex;align-items:center;padding:0 4px 0 12px;font-size:.7rem;color:var(--card-ink);opacity:.8}
:root[data-contrast="high"] .seg,:root[data-contrast="high"] .tool{border-width:4px;background:#000}
:root[data-contrast="high"] .seg button,:root[data-contrast="high"] .tool,:root[data-contrast="high"] .seg .lab{color:#fff}
:root[data-contrast="high"] .seg button[aria-pressed="true"],:root[data-contrast="high"] .tool[aria-pressed="true"]{background:#ffe600;color:#000}

/* ---------- 跑道分區（三條跑道＝三個練習） ---------- */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lane{position:relative;min-height:84px;border:3px solid var(--line);border-radius:20px;background:var(--lane);cursor:pointer;
  display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;font-size:1rem;box-shadow:var(--shadow)}
.lane .bib{flex:none;width:2.4rem;height:2.4rem;border-radius:10px;background:var(--paper);border:3px solid var(--track);color:var(--track);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem}
.lane .ln{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.lane .ln small{font-size:.65rem;color:var(--muted)}
.lane[aria-selected="true"]{border-color:var(--track);background:var(--track);color:var(--track-ink)}
.lane[aria-selected="true"] .ln small{color:var(--track-ink);opacity:.9}
.lane[aria-selected="true"]::after{content:"";position:absolute;right:12px;top:10px;width:22px;height:16px;
  background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/11px 8px;border:2px solid #000;border-radius:2px}
:root[data-contrast="high"] .lane{border-width:4px;color:#fff}
:root[data-contrast="high"] .lane[aria-selected="true"]{background:#ffe600;color:#000;border-color:#ffe600}

.modes{display:flex;flex-wrap:wrap;gap:10px}
.mode{min-height:64px;border:3px solid var(--line);border-radius:999px;background:var(--paper);color:var(--card-ink);padding:0 20px 0 12px;
  display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;cursor:pointer}
.mode svg{width:2rem;height:2rem;flex:none}
.mode[aria-pressed="true"]{border-color:var(--track);box-shadow:inset 0 0 0 3px var(--track)}
.mode[aria-pressed="true"]::before{content:"▶";color:var(--track);font-size:.7rem}
:root[data-contrast="high"] .mode{background:#000;color:#fff;border-width:4px}
:root[data-contrast="high"] .mode[aria-pressed="true"]{background:#ffe600;color:#000;box-shadow:none}

/* ---------- 遊戲卡 ---------- */
.stage{background:var(--card);color:var(--card-ink);border:4px solid var(--card-line);border-radius:28px;padding:18px clamp(12px,3vw,28px) 24px;box-shadow:var(--shadow);min-width:0}
:root[data-contrast="high"] .stage{border-width:5px}
.ghead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.ghead h2{margin:0;font-family:var(--font-text);font-size:1.3rem;font-weight:700}
.ghead p{margin:2px 0 0;font-family:var(--font-text);font-size:.95rem;color:var(--card-ink);opacity:.85}
.howto{display:flex;gap:10px;align-items:center;min-width:0}
.progress{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.say{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid var(--card-ink);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--card-ink)}
.say svg{width:30px;height:30px}
.say.on{background:#f2b705;color:#000;border-color:#f2b705}
.btn{min-height:64px;min-width:64px;border-radius:18px;border:3px solid var(--card-ink);background:var(--card);color:var(--card-ink);font-size:.9rem;font-weight:700;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.main{background:var(--track);border-color:var(--track);color:#fff}
:root[data-contrast="high"] .btn.main{background:#ffe600;color:#000;border-color:#ffe600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.fb{min-height:2.2em;display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.05rem;font-weight:700;margin-top:10px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.fb svg{width:1.4em;height:1.4em}
:root:not([data-contrast="high"]) .fb.ok{color:#1f7a35} :root:not([data-contrast="high"]) .fb.no{color:#b3261e}

/* 注音直排卡：一個音節一欄，聲調在右邊，輕聲點在上面 */
.zw{display:inline-flex;flex-direction:column;align-items:center;gap:.5em;font-family:"BpmfZY","LXGW WenKai TC",serif;line-height:1;color:var(--card-ink)}
.sy{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 .4em 0 .08em}
.sy .s{display:block;height:1em;line-height:1}
.sy .s.big,.symtile .big{display:inline-block;transform:scale(1.14);transform-origin:50% 55%}
.sy .s.big{display:block}
/* 聲調：寫在最後一個符號的右上（兩個符號中間的右邊） */
.sy .t{position:absolute;right:.2em;bottom:1em;transform:translateY(50%);width:.42em;height:.42em;display:block}
.sy .t svg,.opt .mk svg{width:100%;height:100%;display:block;overflow:visible}
.sy .d{display:block;width:.22em;height:.22em;margin:0 auto .12em;border-radius:50%;background:currentColor}
.sy .j,.symtile .j,.sy .t.j{color:#1565c0}
:root[data-contrast="high"] .sy .j,:root[data-contrast="high"] .symtile .j,:root[data-contrast="high"] .sy .t.j{color:#00e5ff}
.sy.one .t{bottom:.72em}
.sy.hole .t{right:.1em;width:.62em;height:.62em;border:.12em solid #c62828;border-radius:.1em}
:root[data-contrast="high"] .sy.hole .t{border-color:#ffe600}
.sy.one.hole .t{bottom:.72em}
.sy.box,.sy.askd{outline:.12em solid #c62828;outline-offset:.1em;border-radius:.15em;background:#fff3b0}
.sy.askd{outline:none;background:none}
.sy .q{display:flex;align-items:center;justify-content:center;width:1em;height:1.1em;border:.1em solid #c62828;border-radius:.15em;background:#fff3b0;color:#c62828;font-family:var(--font-ui);font-size:1em;font-weight:700}
.sy .q.r{height:1.6em;width:1.3em}
:root[data-contrast="high"] .sy .q{border-color:#ffe600;background:#000;color:#ffe600}
.ztone{font-size:2.2rem}
.tag2{display:inline-block;font-size:.65rem;border-radius:8px;padding:0 .4em;margin-left:.4em;vertical-align:middle}
:root[data-contrast="high"] .sy.box,:root[data-contrast="high"] .sy.askd{outline-color:#ffe600;background:#000}
.saycol{display:grid;grid-template-columns:auto;justify-items:center;gap:4px}
.saycol .hz{font-size:.7rem}
.ask{text-align:center;font-family:var(--font-text);font-size:1.2rem;margin:0 0 12px}
.ask b{padding:0 .3em;border-radius:8px}.ask .p1{background:#ffe1d6;color:#8a2a12}.ask .p2{background:#dbe9ff;color:#0d47a1}
:root[data-contrast="high"] .ask .p1,:root[data-contrast="high"] .ask .p2{background:#000;color:#ffe600;border:3px solid #ffe600}
.qnav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.progress .dot{width:auto;min-width:2.2rem;height:2.2rem;border-radius:999px;border:3px solid var(--card-line);background:transparent;color:var(--card-ink);font-size:.7rem;font-weight:700;cursor:pointer;padding:0 .3em}
.progress .dot.done{background:#1f7a35;border-color:#1f7a35;color:#fff}
.progress .dot.miss{background:#b3261e;border-color:#b3261e;color:#fff}
.progress .dot.cur{outline:4px solid #f2b705;outline-offset:2px}
.zcard{background:#fff;border:3px solid var(--card-line);border-radius:16px;padding:.35em .25em;display:inline-flex;justify-content:center;color:#22302a}
.zcard .zw{color:#22302a}
:root[data-contrast="high"] .zcard{background:#000;border-color:#fff;border-width:4px}
:root[data-contrast="high"] .zcard .zw{color:#fff}

.pic{background:#fff;border:3px solid var(--card-line);border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;max-width:100%}
.pic svg,.pic img{width:100%;height:100%;display:block}
.pic img{object-fit:contain}
.zh .nzy{font-family:var(--font-text)}
:root[data-contrast="high"] .pic{border:4px solid #fff}
.hz{font-family:var(--font-text);font-size:1.1rem;font-weight:700;color:var(--card-ink);letter-spacing:.08em}

/* 翻卡 */
.flip{display:grid;place-items:center;gap:12px}
.fcard{width:min(420px,100%);min-height:min(420px,90vw);border:4px solid var(--card-line);border-radius:24px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;cursor:pointer;font-size:2.6rem}
.fcard .tag{font-size:.3em;color:#4f5f55;font-family:var(--font-ui)}
.fcard .pic{width:100%}
:root[data-contrast="high"] .fcard{background:#000;border-color:#fff}
:root[data-contrast="high"] .fcard .tag{color:#ffe600}
.count{font-size:.85rem;color:var(--card-ink);min-width:4.5em;text-align:center}

/* 配對 */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,42%),1fr));gap:12px}
.mspot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;border:3px dashed var(--card-line);border-radius:20px;background:transparent;cursor:pointer;min-height:64px}
.mspot .slot{min-height:5.8rem;width:100%;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:1.6rem;color:var(--card-ink)}
.mspot .slot:empty::before{content:"放在這裡";font-size:.5em;opacity:.7;font-family:var(--font-ui)}
.mspot.done{border-style:solid;border-color:var(--ok);background:var(--ok-bg);cursor:default}
.mspot.shake,.opt.shake{animation:shake .4s}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px;min-height:64px}
.ztile{border:none;background:none;padding:0;cursor:pointer;font-size:1.6rem;border-radius:18px}
.ztile .zcard{min-width:64px;min-height:64px}
.ztile[aria-pressed="true"] .zcard{outline:5px solid #f2b705;outline-offset:3px;transform:translateY(-4px)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* 看圖選注音、選聲調、找符號 */
.qtop{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin-bottom:12px}
.qtop .pic{width:min(340px,100%)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.opts.tones{grid-template-columns:repeat(5,minmax(0,1fr))}
.opt{min-height:64px;border:3px solid var(--card-ink);border-radius:18px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;font-size:1.6rem;color:#22302a}
.opt .lb{font-family:var(--font-ui);font-size:.5em;font-weight:700}
.opt .mk{width:.8em;height:.8em;display:block}
.opt.ok{border-color:#1f7a35;background:#dff3e2;border-width:5px}
.opt.no{border-color:#b3261e;background:#fde3e0}
.opt .ic{width:1.1rem;height:1.1rem}
:root[data-contrast="high"] .opt{background:#000;color:#fff;border-color:#fff;border-width:4px}
:root[data-contrast="high"] .opt.ok{border-color:#7dff7d;background:#000}
:root[data-contrast="high"] .opt.no{border-color:#ff8a8a;background:#000}
.opt.gone{visibility:hidden}
.symtile{font-family:"BpmfZY","LXGW WenKai TC",serif;font-size:2rem}
.qword{font-size:2.4rem}

.end{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0;text-align:center}
.end .big{font-family:var(--font-text);font-size:2rem;font-weight:700}
.stars{display:flex;gap:10px}
.stars svg{width:3rem;height:3rem}
.note{font-size:.7rem;color:var(--muted);text-align:center}
.vmsg{background:var(--paper);color:var(--card-ink);border:3px dashed var(--track);border-radius:18px;padding:10px 14px;font-size:.8rem}

html.zy .stage, html.zy .lanes, html.zy .modes, html.zy .brand h1{font-family:var(--font-zy)}
html.zy .ghead h2, html.zy .ghead p, html.zy .hz, html.zy .end .big{font-family:var(--font-zy)}
html.zy .btn,html.zy .opt .lb,html.zy .mode,html.zy .lane{font-family:var(--font-zy)}

@media (max-width:760px){.lanes{grid-template-columns:minmax(0,1fr)}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}.opts.tones{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- 趣味：跑道、答對動畫、連對、戳氣球、打地鼠、翻牌 ---------- */
.track{position:relative;height:78px;margin:2px 0 12px;border-radius:40px;background:#efe6cf;border:3px solid var(--card-line)}
.track::before{content:'';position:absolute;left:48px;right:64px;top:50%;border-top:5px dashed #c8b98f}
.track .runner{position:absolute;top:50%;left:6px;width:92px;height:64px;transform:translateY(-50%);transition:left .7s ease}
.track .runner svg,.track .goal svg{width:100%;height:100%;display:block;overflow:visible}
.track .goal{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:46px;height:60px}
.track .runner.hop svg{animation:hop .55s ease}
@keyframes hop{40%{transform:translateY(-20px) rotate(-6deg)}}
:root[data-contrast="high"] .track{background:#000;border:4px solid #fff}
:root[data-contrast="high"] .track::before{border-top-color:#ffe600}
.burst{position:fixed;width:0;height:0;pointer-events:none;z-index:50}
.burst i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:4px;animation:fly .8s ease-out forwards}
.burst i.s{border-radius:50%}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.4);opacity:0}}
.streak{position:fixed;left:50%;top:28%;z-index:60;pointer-events:none;background:#f2b705;color:#22302a;font-weight:900;font-size:1.5rem;padding:12px 28px;border-radius:999px;border:4px solid #22302a;animation:pop 1.6s forwards;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08);opacity:1}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%);opacity:0}}
html.quiet *,html.quiet *::before,html.quiet *::after{animation:none!important;transition:none!important}
html.quiet .burst,html.quiet .streak{display:none!important}
.gspeed{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.gspeed .seg{display:inline-flex}
/* 戳氣球 */
.sky{position:relative;height:560px;border-radius:22px;background:linear-gradient(#cfeaff,#f4fbff);border:3px solid var(--card-line);overflow:hidden}
:root[data-contrast="high"] .sky{background:#000;border:4px solid #fff}
.balloon{position:absolute;bottom:-460px;width:23%;display:flex;flex-direction:column;align-items:center;border:none;background:none;cursor:pointer;padding:0;color:#22302a}
.balloon .bb{width:100%;min-height:170px;border-radius:48% 48% 44% 44%;display:flex;align-items:center;justify-content:center;border:3px solid #22302a;padding:16px 4px;box-shadow:inset -10px -12px 0 rgba(0,0,0,.08)}
.balloon .bb .zw{font-size:1.25rem;color:#22302a}
.balloon .knot{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:12px solid #22302a;margin-top:-2px}
.balloon .str{width:3px;height:56px;background:#7a8a7f}
.balloon.go{animation:rise var(--dur) linear infinite;animation-delay:var(--delay)}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-1040px)}}
.balloon.still{bottom:auto;top:24px;animation:bob 3.2s ease-in-out infinite;animation-delay:var(--delay)}
@keyframes bob{50%{transform:translateY(-12px)}}
.balloon.no .bb{animation:shake .4s}
.balloon.popped{visibility:hidden}
:root[data-contrast="high"] .balloon .bb{border:4px solid #fff;background:#000!important}
:root[data-contrast="high"] .balloon .bb .zw{color:#fff}
/* 打地鼠 */
.field{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;background:#9bcf7d;border-radius:22px;padding:16px;border:3px solid var(--card-line)}
:root[data-contrast="high"] .field{background:#000;border:4px solid #fff}
.hole{position:relative;height:215px;overflow:hidden;border-radius:16px}
.hole::after{content:'';position:absolute;left:6%;right:6%;bottom:4px;height:34px;background:#5b3b22;border-radius:50%;z-index:2}
:root[data-contrast="high"] .hole::after{background:#333;border:3px solid #fff}
.mole{position:absolute;left:50%;bottom:-190px;transform:translateX(-50%);width:128px;border:none;background:none;cursor:pointer;padding:0;transition:bottom .6s ease;z-index:1}
.mole.up{bottom:38px}
.mole svg{width:128px;height:96px;display:block}
.mole .sign{display:flex;align-items:center;justify-content:center;width:100px;height:74px;margin:-8px auto 0;background:#fff;border:3px solid #22302a;border-radius:14px;font-size:1.9rem;color:#22302a}
.mole .sign .zw{font-size:.9rem}
.mole.no .sign{animation:shake .4s}
.mole.hit .sign{background:#d8f5d0;border-color:#1f7a35}
:root[data-contrast="high"] .mole .sign{background:#000;color:#fff;border:4px solid #fff}
/* 翻牌 */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mcard{position:relative;min-height:190px;border:3px solid var(--card-ink);border-radius:18px;background:#fff;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;color:#22302a}
.mcard.back{background:repeating-linear-gradient(45deg,#f2b705 0 14px,#f6c94a 14px 28px)}
.mcard.back::after{content:'?';font-size:3rem;font-weight:900;color:#22302a}
.mcard .pic{width:100%;border:none}
.mcard .zcard .zw{font-size:1.05rem}
.mcard.done{border-color:#1f7a35;background:#eefae9}
:root[data-contrast="high"] .mcard{background:#000;color:#fff;border:4px solid #fff}
:root[data-contrast="high"] .mcard.back{background:#000}
:root[data-contrast="high"] .mcard.back::after{color:#ffe600}
@media (max-width:760px){.mem{grid-template-columns:repeat(2,minmax(0,1fr))}.balloon{width:46%}.field{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 視覺層次：設定列淡、選練習中等、作答區最醒目 ---------- */
:root{--nav:#ffffff;--nav-ink:#22302a;--nav-line:#c3d1bb;--sel:#e3efe0;--sel-line:#4f8a68;--pick:#f3d36b;--pick-ink:#22302a;--set-bg:rgba(34,48,42,.06);--set-btn:#ffffff;--set-on:#cfe0d4;--set-on-ink:#1e3a2e;--stage-line:#e0a800}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--nav:#46534b;--nav-ink:#f6f3ea;--nav-line:#83928a;--sel:#3c4a42;--sel-line:#a8d5ba;--set-bg:rgba(0,0,0,.18);--set-btn:rgba(255,255,255,.06);--set-on:#cfe0d4;--set-on-ink:#1e3a2e;--stage-line:#ffd25e}}
:root[data-theme="dark"]{--nav:#46534b;--nav-ink:#f6f3ea;--nav-line:#83928a;--sel:#3c4a42;--sel-line:#a8d5ba;--set-bg:rgba(0,0,0,.18);--set-btn:rgba(255,255,255,.06);--set-on:#cfe0d4;--set-on-ink:#1e3a2e;--stage-line:#ffd25e}
/* 1 設定列：低彩度、細字、不搶眼 */

:root:not([data-contrast="high"]) .setbar .sbl{color:var(--muted);font-weight:400;font-size:.7rem}
:root:not([data-contrast="high"]) .setbar .seg,:root:not([data-contrast="high"]) .setbar .tool,:root:not([data-contrast="high"]) .setbar .termsel select{background:var(--set-btn);color:var(--ink);border:2px solid var(--nav-line);font-weight:400}
:root:not([data-contrast="high"]) .setbar .seg button,:root:not([data-contrast="high"]) .setbar .tool{font-weight:400;font-size:.75rem;color:var(--ink)}
:root:not([data-contrast="high"]) .setbar .seg .lab{color:var(--muted)}
:root:not([data-contrast="high"]) .setbar .seg button[aria-pressed="true"],:root:not([data-contrast="high"]) .setbar .tool[aria-pressed="true"]{background:var(--set-on);color:var(--set-on-ink);font-weight:700}
:root:not([data-contrast="high"]) .setbar .termsel span{color:var(--muted);font-weight:400}
:root:not([data-contrast="high"]) .setbar .termsel select{font-size:.75rem}
:root:not([data-contrast="high"]) .lswap{background:transparent;color:var(--ink);border:2px solid var(--nav-line);font-weight:400;font-size:.85rem}
/* 2 選練習：深綠卡，選到的用薄荷綠框；玩法選到的用柔和黃 */
:root:not([data-contrast="high"]) .lane{background:var(--nav);color:var(--nav-ink);border:3px solid var(--nav-line);box-shadow:none}
:root:not([data-contrast="high"]) .lane .ln small{color:var(--muted)}
:root:not([data-contrast="high"]) .lane .bib{border-color:var(--nav-line);color:var(--nav-ink);background:transparent}
:root:not([data-contrast="high"]) .lane[aria-selected="true"]{background:var(--sel);color:var(--nav-ink);border:4px solid var(--sel-line)}
:root:not([data-contrast="high"]) .lane[aria-selected="true"] .ln small{color:var(--muted);opacity:1}
:root:not([data-contrast="high"]) .lane[aria-selected="true"] .bib{background:var(--sel-line);border-color:var(--sel-line);color:#1e3a2e}
:root:not([data-contrast="high"]) .modes .mode{background:var(--nav);color:var(--nav-ink);border:2px solid var(--nav-line);font-weight:400}
:root:not([data-contrast="high"]) .modes .mode svg{background:#f4ecd8;border-radius:10px;padding:3px;width:2.3rem;height:2.3rem}
:root:not([data-contrast="high"]) .modes .mode[aria-pressed="true"]{background:var(--pick);color:var(--pick-ink);border-color:var(--pick);box-shadow:none;font-weight:700}
:root:not([data-contrast="high"]) .modes .mode[aria-pressed="true"]::before{color:var(--pick-ink)}
:root:not([data-contrast="high"]) .lchip{background:var(--nav);color:var(--nav-ink);border:2px solid var(--nav-line)}
:root:not([data-contrast="high"]) .lchip[aria-pressed="true"]{border:4px solid var(--sel-line);box-shadow:none;background:var(--sel)}
/* 3 作答區：粗黃框＋陰影，最醒目 */
:root:not([data-contrast="high"]) .stage{border:6px solid var(--stage-line);box-shadow:0 0 0 4px rgba(255,210,94,.18),0 10px 24px rgba(0,0,0,.25)}

:root:not([data-contrast="high"]) .setbar .seg .s1{font-size:.7rem}:root:not([data-contrast="high"]) .setbar .seg .s2{font-size:.9rem}:root:not([data-contrast="high"]) .setbar .seg .s3{font-size:1.15rem}

function quizRun(st, qs, build){ let i=0, intro=false, streak=0; const res=[]; const jump=k=>{ if(k<0||k>=qs.length) return; i=k; q(); };
  const mark=head(st,qs.length,jump); const track=makeTrack(st,qs.length); const box=document.createElement('div'); st.append(box);
  const finish=()=>{ clearTimers(); box.innerHTML=''; if(res.filter(Boolean).length===qs.length) burst(track&&st.querySelector('.track .goal'),true); endScreen(box,res.filter(x=>x==='done').length,qs.length); };
  function q(){ clearTimers(); box.innerHTML=''; mark(i,'cur'); let tried=false, solved=false; const f=document.createElement('div'); f.className='fb';
    const nx=btn(i<qs.length-1?'下一題 ▶':'看成績','main',()=>{ i<qs.length-1?jump(i+1):finish(); });
    box.append(navBar(i,qs.length,jump));
    build(box, qs[i], (ok,el)=>{ if(solved) return false; if(ok){ solved=true; fb(f,true); const fresh=!res[i]; if(!res[i]) res[i]=tried?'miss':'done'; mark(i,res[i]); burst(el); track.step(res.filter(Boolean).length);
        if(fresh&&!tried){ streak++; if(streak%3===0) streakShow(streak); } else if(tried) streak=0; nx.focus({preventScroll:true}); return true; }
      tried=true; streak=0; res[i]='miss'; mark(i,'miss'); fb(f,false); el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),450); return false; }, !intro); intro=true;
    const r=document.createElement('div'); r.className='row'; r.append(nx); box.append(f,r); }
  q(); }

function zFindQsFor(L){ if(L.find&&L.find.length) return L.find.slice(); const ws=L.zwords&&L.zwords.length?L.zwords:L.words; const syms=L.newsym||[]; const qs=[];

function zmole(st){ quizRun(st, zFindQs(), (box,it,answer,first)=>{ const w=zword(it.w); const tm=(w.z[it.k].match(/[ˊˇˋ]/)||[''])[0];

  const face=o=> it.part==='韻母' ? `<span class="zw">${syl(o+tm)}</span>` : `<span class="symtile">${symHTML(o)}</span>`; let done=false;
  const makeMole=(h,o)=>{ const m=document.createElement('button'); m.type='button'; m.className='mole'; m.setAttribute('aria-label','地鼠'); m.innerHTML=MOLE+`<span class="sign">${face(o)}</span>`;

    const up=GSPEED==='slower'?6000:4000, gap=GSPEED==='slower'?1600:1100; let n=0;
    const cycle=()=>{ if(done) return; const free=holes.filter(h=>!h.querySelector('.mole.up')); if(free.length){ const h=free[Math.floor(Math.random()*free.length)]; h.innerHTML='';
        const o=(n++%2===0)?it.a:shuffle(it.o.filter(x=>x!==it.a))[0]; const m=makeMole(h,o); requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.add('up')));

      later(cycle,gap); };

function setupPad(cv){ const size=()=>{ const r=cv.parentElement.getBoundingClientRect(); const d=window.devicePixelRatio||1; cv.width=r.width*d; cv.height=r.height*d; const g=cv.getContext('2d'); g.scale(d,d); g.lineCap='round'; g.lineJoin='round'; g.lineWidth=Math.max(8,r.width/22); g.strokeStyle=document.documentElement.dataset.contrast?'#fff':'#22302a'; };
  size(); let drawing=false, last=null; const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  cv.addEventListener('pointerdown',e=>{ drawing=true; last=pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); const g=cv.getContext('2d'); g.beginPath(); g.moveTo(...last); g.lineTo(...p); g.stroke(); last=p; e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{ drawing=false; })); }

  const book=LIB.filter(l=>l.year===CUR.year&&l.book===CUR.book).flatMap(l=>(l.sents||[]).flatMap(p=>p.keys||[]));
  quizRun(st, qs, (box,e,answer,first)=>{ const top=document.createElement('div'); top.className='qtop'; top.innerHTML=`<div class="saycol">${sayBtn(e.t,'聽句子')}<span class="hz">聽句子</span></div>`; box.append(top);
    const q=document.createElement('div'); q.className='sq'; q.innerHTML=zhKey(e,e.key,true); box.append(q);
    const pool2=[...new Set(book.concat(['也','是','在','好','的','又','一起','什麼']))].filter(k=>k!==e.key&&!e.t.includes(k)&&[...k].length===[...e.key].length);
    const opts=document.createElement('div'); opts.className='opts';
    shuffle([e.key,...shuffle(pool2).slice(0,3)]).forEach(o=>{ const b=document.createElement('button'); b.type='button'; b.className='opt hzopt'; b.innerHTML=`<span class="zh">${o}</span>`;
      b.onclick=()=>{ const ok=o===e.key; if(answer(ok,b)){ b.classList.add('ok'); q.innerHTML=zhKey(e,e.key,'fill'); speak(e.t); } else if(!ok){ b.classList.add('no'); b.disabled=true; } }; opts.append(b); });
    box.append(opts); if(first) later(()=>speak('h_sfill'),300); }); }

// ---------- 分享練習（連結＋QR） ----------
const BASE='https://shiuerong.github.io/guoyu/';
function shareOpen(){ const url=BASE+'#'+CUR.id+'_'+state.sec.id+'_'+state.mode; const d=$('#shareDlg');
  $('#shWhat').textContent=`第${CUR.no}課 ${CUR.title}・${state.sec.name}・${MODES[state.mode].name}`; $('#shUrl').value=url;
  try{ const q=QRMake(url), n=q.getModuleCount(), m=4; let d=''; for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c+m} ${r+m}h1v1h-1z`; $('#shQr').innerHTML=`<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`; }catch(e){ $('#shQr').textContent='QR 產生失敗，請改用複製連結。'; }
  $('#shCopy').textContent='複製連結'; try{ d.showModal(); }catch(e){ d.setAttribute('open',''); } }
$('#shBtn').onclick=shareOpen; $('#shClose').onclick=()=>{ const d=$('#shareDlg'); try{ d.close(); }catch(e){ d.removeAttribute('open'); } $('#shBtn').focus(); };
$('#shCopy').onclick=async()=>{ const u=$('#shUrl'); let ok=false; try{ await navigator.clipboard.writeText(u.value); ok=true; }catch(e){ try{ u.select(); ok=document.execCommand('copy'); }catch(e2){} } $('#shCopy').textContent=ok?'已複製':'請長按網址複製'; u.select(); };

// ---------- 開始 ----------
async function start(){
  if(!LIB.length){ const d=await (await fetch('data/lessons.json?v='+AV)).json(); LIB=d.lessons; (d.audio||[]).forEach(a=>AUDIO.add(a)); DATARULES=(d.zyrules||[]).slice().sort((a,b)=>b[0].length-a[0].length).reverse();
    try{ PICS=await (await fetch('data/pics.json?v='+AV)).json(); }catch(e){ PICS={}; } }
  try{ Object.assign(PICS, JSON.parse(store.get('eng.previewPics')||'{}')); }catch(e){}
  try{ const pv=JSON.parse(store.get('eng.preview')||'[]'); pv.forEach(l=>{ const i=LIB.findIndex(x=>x.id===l.id); if(i>=0) LIB[i]=l; else LIB.push(l); }); }catch(e){}
  const h=decodeURIComponent(location.hash.slice(1)); if(h==='import'){ importPage(); return; }
  if(/[&]draft=1|_draft$/.test(h)) store.set('eng.draft','1'); if(/[&]draft=0/.test(h)) store.set('eng.draft','0'); if(store.get('eng.draft')!=='1'){ DRAFTS=DRAFTS.concat(LIB.filter(l=>l.draft&&!DRAFTS.includes(l))); LIB=LIB.filter(l=>!l.draft); } else { LIB=LIB.concat(DRAFTS.filter(l=>!LIB.includes(l))); DRAFTS=[]; }
  const [hh,...qp]=h.split('&'); const P=Object.fromEntries(qp.map(s=>s.split('=')));   // 教室入口帶來的注音、語速、字級
  if('zy' in P) setZy(P.zy==='1'); if(P.rate) setRate(+P.rate===1?1:0.85); if(P.fs) setFs({1:20,2:24,3:30}[P.fs]||24);
  const [id,sid,mode]=hh.split(/[_\/]/);
  LIB.sort((a,b)=>b.year-a.year||(a.term<b.term?-1:1)||a.book-b.book||a.no-b.no);
  openLesson(LIB.some(l=>l.id===id)?id:(LIB.find(l=>!l.zy)||LIB[0]).id, sid||'a', mode||'flash');
}
setQuiet(QUIET); setZy(store.get('g1.zy')==='1');
start();

})();
